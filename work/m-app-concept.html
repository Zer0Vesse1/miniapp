<style>
  #m-app-concept {
    display: grid;
    justify-items: center;
    padding: 20px 8px;
  }

  #m-app-concept .app {
    --canvas: light-dark(#f3f5fa, #111a2a);
    --surface: light-dark(#ffffff, #19253a);
    --ink: light-dark(#152137, #edf2ff);
    --quiet: light-dark(#586780, #a3b1cb);
    --line: light-dark(#e4e9f3, #2e3c56);
    --blue: light-dark(#244eb9, #a3bfff);
    --on-blue: light-dark(#ffffff, #142545);
    --blue-tint: light-dark(#e8eeff, #223659);
    --soft-violet: light-dark(#edf0fb, #293452);
    --widget-text: #fafcff;
    --widget-muted: #e6edff;
    --radius: 20px;
    --ease: cubic-bezier(.22, .78, .25, 1);
    width: min(100%, 416px);
    position: relative;
    overflow: hidden;
    isolation: isolate;
    color: var(--ink);
    background: var(--canvas);
    border: 1px solid var(--line);
    border-radius: 32px;
    box-shadow: 0 18px 44px color-mix(in srgb, var(--ink) 12%, transparent);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }
  #m-app-concept .app[data-appearance='light'] { color-scheme: light; }
  #m-app-concept .app[data-appearance='dark'] { color-scheme: dark; }

  #m-app-concept *, #m-app-concept *::before, #m-app-concept *::after { box-sizing: border-box; }
  #m-app-concept [hidden] { display: none !important; }
  #m-app-concept :is(h1,h2,h3,p,dl,dd) { margin: 0; }
  #m-app-concept button {
    min-height: 44px;
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    transition: background-color 160ms var(--ease), transform 160ms var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  #m-app-concept button:active { transform: scale(.98); }
  #m-app-concept :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  #m-app-concept svg { width: 19px; height: 19px; display: block; stroke-width: 1.8; }
  #m-app-concept i[data-lucide] { display: inline-grid; place-items: center; min-width: 17px; height: 19px; font: 600 17px/1 system-ui, sans-serif; }
  #m-app-concept i[data-lucide]::before { content: var(--glyph, '·'); }
  #m-app-concept i[data-lucide='plus'] { --glyph: '+'; }
  #m-app-concept i[data-lucide='more-horizontal'], #m-app-concept i[data-lucide='ellipsis'] { --glyph: '···'; }
  #m-app-concept i[data-lucide='square-parking'], #m-app-concept i[data-lucide='parking-square'] { --glyph: 'P'; }
  #m-app-concept i[data-lucide='book-open'], #m-app-concept i[data-lucide='cooking-pot'], #m-app-concept i[data-lucide='chef-hat'] { --glyph: '食'; }
  #m-app-concept i[data-lucide='contact-round'], #m-app-concept i[data-lucide='user-round'] { --glyph: '人'; }
  #m-app-concept i[data-lucide='map-pin'], #m-app-concept i[data-lucide='utensils'] { --glyph: '⌖'; }
  #m-app-concept i[data-lucide='calculator'] { --glyph: '÷'; }
  #m-app-concept i[data-lucide='clock-3'], #m-app-concept i[data-lucide='clock'] { --glyph: '◷'; }
  #m-app-concept i[data-lucide='layout-grid'] { --glyph: '⊞'; }
  #m-app-concept i[data-lucide='list'] { --glyph: '≡'; }
  #m-app-concept i[data-lucide='settings'], #m-app-concept i[data-lucide='settings-2'] { --glyph: '⚙'; }
  #m-app-concept i[data-lucide='sliders-horizontal'] { --glyph: '≡'; }
  #m-app-concept i[data-lucide='chevron-right'] { --glyph: '›'; }
  #m-app-concept i[data-lucide='chevron-left'] { --glyph: '‹'; }
  #m-app-concept i[data-lucide='arrow-up-right'] { --glyph: '↗'; }
  #m-app-concept i[data-lucide='check'] { --glyph: '✓'; }
  #m-app-concept i[data-lucide='eye-off'], #m-app-concept i[data-lucide='circle-minus'] { --glyph: '⊘'; }
  #m-app-concept i[data-lucide='x'] { --glyph: '×'; }
  #m-app-concept i[data-lucide='arrow-down-up'] { --glyph: '⇅'; }
  #m-app-concept i[data-lucide='info'] { --glyph: 'ⓘ'; }
  #m-app-concept i[data-lucide='history'] { --glyph: '↶'; }
  #m-app-concept i[data-lucide='monitor'], #m-app-concept i[data-lucide='sun'], #m-app-concept i[data-lucide='moon'] { --glyph: '◐'; }
  #m-app-concept i[data-lucide='upload'] { --glyph: '↑'; }
  #m-app-concept i[data-lucide='download'] { --glyph: '↓'; }

  #m-app-concept .shell {
    position: relative;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    height: 616px;
  }
  #m-app-concept .topbar {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 64px;
    padding: 10px 21px;
    gap: 12px;
  }
  #m-app-concept .top-title { font-size: 25px; font-weight: 700; letter-spacing: -.045em; line-height: 1.2; }
  #m-app-concept .top-action, #m-app-concept .close {
    display: grid;
    place-items: center;
    width: 44px;
    flex: none;
    border-radius: 50%;
    color: var(--blue);
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  #m-app-concept .top-action:active, #m-app-concept .close:active { background: var(--blue-tint); }
  #m-app-concept .top-action svg { width: 22px; height: 22px; }
  #m-app-concept .top-action i { font-size: 23px; }
  #m-app-concept .page {
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
    padding: 4px 19px 18px;
  }

  #m-app-concept .widget {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    border-radius: var(--radius);
    color: var(--widget-text);
    background: linear-gradient(132deg, #15274f 0%, #1d3d82 57%, #2a51b0 100%);
    box-shadow: 0 6px 18px rgb(35 64 134 / 17%);
  }
  #m-app-concept .widget-body {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-height: 169px;
    justify-content: flex-end;
    align-items: flex-start;
    position: relative;
    z-index: 1;
    text-align: left;
    padding: 17px 19px 18px;
  }
  #m-app-concept .widget-body:active { transform: none; background: rgb(0 14 41 / 19%); }
  #m-app-concept .widget-body:focus-visible { outline-offset: -5px; outline-color: var(--widget-text); border-radius: inherit; }
  #m-app-concept .widget-label { display: flex; align-items: center; gap: 7px; color: var(--widget-muted); font-size: 13px; margin-top: 2px; margin-bottom: auto; padding-right: 47px; }
  #m-app-concept .widget-label svg { width: 15px; height: 15px; }
  #m-app-concept .widget-label i { min-width: 15px; height: 15px; font-size: 13px; }
  #m-app-concept .widget-title { display: block; max-width: 100%; overflow-wrap: anywhere; font-size: clamp(24px, 6vw, 34px); font-weight: 670; line-height: 1.17; letter-spacing: -.045em; }
  #m-app-concept .widget-meta { display: block; color: var(--widget-muted); margin-top: 8px; font-size: 12px; overflow-wrap: anywhere; }
  #m-app-concept :is(.widget-title,.widget-meta) { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  #m-app-concept .widget-config {
    display: grid;
    place-items: center;
    position: absolute;
    z-index: 2;
    top: 11px;
    right: 11px;
    width: 44px;
    padding: 0;
    border-radius: 50%;
    color: var(--widget-text);
    background: rgb(246 250 255 / 15%);
    box-shadow: inset 0 0 0 1px rgb(246 250 255 / 14%);
  }
  #m-app-concept .widget-config:active { background: rgb(246 250 255 / 26%); }
  #m-app-concept .widget-config:focus-visible { outline-color: var(--widget-text); }
  #m-app-concept .widget-config i { font-size: 19px; letter-spacing: 1px; }
  #m-app-concept .widget-decoration {
    position: absolute;
    z-index: -1;
    pointer-events: none;
    right: -29px;
    bottom: -86px;
    width: 212px;
    height: 225px;
    border-radius: 42px;
    border: 1px solid rgb(205 221 255 / 22%);
    transform: rotate(-25deg);
    background: linear-gradient(155deg, transparent, rgb(140 178 255 / 15%));
  }
  #m-app-concept .widget-decoration::before, #m-app-concept .widget-decoration::after {
    content: "";
    position: absolute;
    inset: 15px;
    border-radius: 31px;
    border: 1px solid rgb(205 221 255 / 19%);
  }
  #m-app-concept .widget-decoration::after { inset: 31px; border-radius: 22px; }
  #m-app-concept [data-widget-slot] > .secondary { width: 100%; }

  #m-app-concept .section-heading { margin: 24px 2px 10px; font-size: 17px; font-weight: 690; letter-spacing: -.02em; }
  #m-app-concept .rows { border-radius: var(--radius); background: var(--surface); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  #m-app-concept [data-recent-list] { margin-bottom: 1px; }
  #m-app-concept .record, #m-app-concept .option {
    display: grid;
    grid-template-columns: auto minmax(0,1fr) auto;
    gap: 10px;
    align-items: center;
    position: relative;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
  }
  #m-app-concept .record:not(:last-child)::after, #m-app-concept .option:not(:last-child)::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 61px;
    right: 12px;
    height: 1px;
    background: var(--line);
    pointer-events: none;
  }
  #m-app-concept .record:active, #m-app-concept .option:active { background: var(--blue-tint); transform: none; }
  #m-app-concept .record:focus-visible, #m-app-concept .option:focus-visible { outline-offset: -3px; }
  #m-app-concept .record-icon {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    color: var(--blue);
    background: var(--blue-tint);
  }
  #m-app-concept .record-icon:is([data-kind='people'],.people) { background: var(--soft-violet); }
  #m-app-concept .record-info, #m-app-concept .option-text { min-width: 0; }
  #m-app-concept .record-name, #m-app-concept .option-name { display: block; font-size: 14px; font-weight: 660; color: var(--ink); }
  #m-app-concept .record-meta, #m-app-concept .option-meta { display: block; font-size: 12px; color: var(--quiet); margin-top: 3px; }
  #m-app-concept .record :is(.record-name,.record-meta) { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #m-app-concept .record-time, #m-app-concept .setting-value { color: var(--quiet); font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  #m-app-concept .record-time svg, #m-app-concept .setting-value svg { width: 15px; height: 15px; }
  #m-app-concept .setting-value { max-width: 108px; }
  #m-app-concept .setting-value > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #m-app-concept .setting-value > :last-child { flex: none; }
  #m-app-concept .option-text { overflow-wrap: anywhere; }
  #m-app-concept .option-marker { color: var(--blue); width: 20px; }

  #m-app-concept .module-tabs {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 4px;
  }
  #m-app-concept .topbar:has(.module-tabs:not([hidden])) { gap: 8px; }
  #m-app-concept .module-tab {
    min-width: 0;
    padding-inline: 7px;
    position: relative;
    border-radius: 11px;
    color: var(--quiet);
    white-space: nowrap;
    font-size: 13px;
    font-weight: 600;
  }
  #m-app-concept .module-tab[aria-selected='true'] {
    color: var(--blue);
    font-weight: 700;
  }
  #m-app-concept .module-tab[aria-selected='true']::after {
    content: "";
    position: absolute;
    inset: auto 7px 3px;
    height: 2px;
    border-radius: 2px;
    background: var(--blue);
  }
  #m-app-concept .module-tab:focus-visible { outline-offset: -3px; }
  #m-app-concept .module-tab:active { background: var(--blue-tint); }
  #m-app-concept .module-view-picker { position: relative; flex: none; }
  #m-app-concept .module-view-picker .top-action[aria-expanded='true'] { background: var(--blue-tint); }
  #m-app-concept .module-view-menu {
    display: grid;
    position: absolute;
    inset: calc(100% + 6px) 0 auto auto;
    min-width: 156px;
    padding: 5px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 9px 26px color-mix(in srgb, var(--ink) 17%, transparent);
  }
  #m-app-concept .module-view-option {
    display: grid;
    grid-template-columns: 19px 1fr 19px;
    align-items: center;
    gap: 9px;
    padding-inline: 9px;
    border-radius: 11px;
    font-size: 13px;
    text-align: left;
    white-space: nowrap;
  }
  #m-app-concept .module-view-option:focus-visible { outline-offset: -2px; }
  #m-app-concept .module-view-option[aria-checked='true'] { color: var(--blue); background: var(--blue-tint); font-weight: 650; }
  #m-app-concept .module-view-option[aria-checked='false'] .view-check { visibility: hidden; }
  #m-app-concept .module-view-option i[data-lucide] { font-size: 16px; }
  #m-app-concept .view-check svg { width: 15px; height: 15px; }
  #m-app-concept .module-entries .option {
    min-height: 66px;
    transition-property: transform;
  }
  #m-app-concept .module-entries .option:active { background: transparent; transform: scale(.985); }
  #m-app-concept .module-entries[data-view='grid'] {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    overflow: visible;
    border-radius: 0;
    background: none;
    box-shadow: none;
  }
  #m-app-concept .module-entries[data-view='grid'] .option {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-content: space-between;
    min-height: 138px;
    padding: 13px;
    gap: 12px;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  #m-app-concept .module-entries[data-view='grid'] .option:active { background: var(--surface); }
  #m-app-concept .module-entries[data-view='grid'] .option::after,
  #m-app-concept .module-entries[data-view='grid'] .option-marker { display: none; }
  #m-app-concept .module-entries[data-view='grid'] .record-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    color: #f7faff;
    background: linear-gradient(145deg, #4b71c9, #24458d);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 20%), 0 3px 6px rgb(45 70 132 / 15%);
  }
  #m-app-concept .module-entries[data-view='grid'] [data-key='people'] .record-icon { background: linear-gradient(145deg, #6673be, #425096); }
  #m-app-concept .module-entries[data-view='grid'] [data-key='food'] .record-icon { background: linear-gradient(145deg, #38799e, #205379); }
  #m-app-concept .module-entries[data-view='grid'] .record-icon svg { width: 24px; height: 24px; }
  #m-app-concept .module-entries[data-view='grid'] .record-icon i { font-size: 21px; }
  #m-app-concept .module-entries[data-view='grid'] .option-name { font-size: 15px; }
  #m-app-concept .shell.module-open:not(.module-moving) > :is(.topbar, [data-page='modules'], .bottom-nav) {
    visibility: hidden;
  }
  #m-app-concept .module-window {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
      env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: var(--canvas);
    transform-origin: top left;
  }
  #m-app-concept .module-window[inert] { pointer-events: none; }
  #m-app-concept .module-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 19px 8px;
  }
  #m-app-concept .module-toolbar-button {
    display: grid;
    place-items: center;
    width: 44px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--ink);
    background: linear-gradient(var(--surface), color-mix(in srgb, var(--surface) 65%, var(--canvas)));
    box-shadow: inset 0 1px 0 color-mix(in srgb, white 28%, transparent),
      0 2px 6px color-mix(in srgb, var(--ink) 8%, transparent);
  }
  #m-app-concept .module-back::before {
    content: '';
    width: 12px;
    height: 12px;
    border: solid currentColor;
    border-width: 0 0 3px 3px;
    border-radius: 1px;
    transform: translateX(2px) rotate(45deg);
  }
  #m-app-concept .module-toolbar-button:active { transform: scale(.94); }
  #m-app-concept .module-toolbar-button i[data-lucide] { font-size: 21px; font-variant-emoji: text; }
  #m-app-concept .module-settings-view { display: grid; gap: 15px; }
  #m-app-concept .module-settings-heading { padding-inline: 3px; font-size: 20px; font-weight: 690; }
  #m-app-concept .module-settings-group { display: grid; gap: 6px; }
  #m-app-concept .module-settings-group h3 { padding-inline: 3px; color: var(--quiet); font-size: 13px; font-weight: 650; }
  #m-app-concept .module-feature {
    display: grid;
    min-width: 0;
    gap: 18px;
    padding: 18px;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  #m-app-concept .feature-icon {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    color: var(--blue);
    background: var(--blue-tint);
  }
  #m-app-concept .feature-icon svg { width: 22px; height: 22px; }
  #m-app-concept .feature-header { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
  #m-app-concept .feature-copy { min-width: 0; }
  #m-app-concept .feature-title { font-size: 25px; font-weight: 710; letter-spacing: -.04em; }
  #m-app-concept .feature-meta { font-size: 13px; color: var(--quiet); margin-top: 3px; overflow-wrap: anywhere; }
  #m-app-concept .feature-value { font-size: 28px; font-weight: 680; letter-spacing: -.04em; color: var(--blue); overflow-wrap: anywhere; }
  #m-app-concept .module-content, #m-app-concept .module-actions { display: grid; gap: 9px; min-width: 0; }
  #m-app-concept .module-content .rows { background: var(--canvas); border-radius: 14px; }
  #m-app-concept .module-actions:has(> :nth-child(2)) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #m-app-concept .module-content output { font-weight: 650; color: var(--blue); }
  #m-app-concept .settings-stack { display: grid; gap: 12px; }
  #m-app-concept .settings-row { min-height: 58px; }
  #m-app-concept .settings-account { min-height: 74px; }
  #m-app-concept .settings-avatar {
    border-radius: 50%;
    background: linear-gradient(135deg, #2a5bc0, #193777);
    color: #f5f8ff;
    font-weight: 680;
  }
  #m-app-concept .settings-arrow { color: var(--quiet); }
  #m-app-concept .settings-arrow svg { width: 15px; height: 15px; }
  #m-app-concept .settings-note, #m-app-concept .settings-meta { font-size: 13px; color: var(--quiet); overflow-wrap: anywhere; }
  #m-app-concept .settings-detail { gap: 8px; }
  #m-app-concept .managed-groups { display: grid; gap: 14px; }
  #m-app-concept .managed-group { display: grid; gap: 6px; }
  #m-app-concept .managed-group h3 { padding-inline: 3px; color: var(--quiet); font-size: 13px; font-weight: 650; }
  #m-app-concept .topbar:has(.release-back:not([hidden])) {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) 44px;
    gap: 10px;
  }
  #m-app-concept .topbar:has(.release-back:not([hidden])) .top-title {
    font-size: 18px;
    letter-spacing: -.02em;
    text-align: center;
  }
  #m-app-concept .release-back svg { width: 21px; height: 21px; }
  #m-app-concept .release-page { padding-top: 8px; }
  #m-app-concept .release-list { display: grid; gap: 12px; }
  #m-app-concept .release-card {
    padding: 15px;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  #m-app-concept .release-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px 8px;
    padding-bottom: 11px;
    margin-bottom: 11px;
    border-bottom: 1px solid var(--line);
  }
  #m-app-concept .release-heading { display: flex; align-items: center; gap: 7px; }
  #m-app-concept .release-heading h2 { font-size: 20px; font-weight: 690; letter-spacing: -.03em; }
  #m-app-concept .release-current {
    padding: 3px 7px;
    border-radius: 10px;
    background: var(--blue-tint);
    color: var(--blue);
    font-size: 11px;
    font-weight: 650;
    white-space: nowrap;
  }
  #m-app-concept .release-date { color: var(--quiet); font-size: 12px; font-variant-numeric: tabular-nums; }
  #m-app-concept .release-revisions { display: grid; gap: 12px; }
  #m-app-concept .release-group h3 { color: var(--blue); font-size: 13px; font-weight: 670; }
  #m-app-concept .release-group ul { display: grid; gap: 5px; margin: 4px 0 0; padding-inline-start: 17px; }
  #m-app-concept .release-group li { font-size: 14px; overflow-wrap: anywhere; }
  #m-app-concept .release-group li::marker { color: var(--quiet); }
  #m-app-concept .field .data-text { font: 13px/1.55 ui-monospace, Consolas, monospace; resize: vertical; }

<script>
(() => {
  const root = document.getElementById('m-app-concept');
  const app = root.querySelector('.app');
  const shell = root.querySelector('.shell');
  const topbar = shell.querySelector('.topbar');
  const pageTitle = root.querySelector('.top-title');
  const addButton = root.querySelector('#m-app-add');
  const releaseBack = root.querySelector('.release-back');
  const pages = [...root.querySelectorAll('[data-page]')];
  const mainNavigation = root.querySelector('.bottom-nav');
  const tabs = [...mainNavigation.querySelectorAll('[data-tab]')];
  const widgetSlot = root.querySelector('[data-widget-slot]');
  const recentList = root.querySelector('[data-recent-list]');
  const enabledModuleCount = root.querySelector('[data-enabled-module-count]');
  const overlay = root.querySelector('.overlay');
  const sheet = root.querySelector('.sheet');
  const handle = sheet.querySelector('.handle');
  const closeButton = sheet.querySelector('.close');
  const sheetTitle = sheet.querySelector('.sheet-title');
  const sheetContent = sheet.querySelector('.sheet-content');
  const notice = root.querySelector('.notice');
  const status = root.querySelector('.live-status');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const mahjongCalculator = globalThis.MahjongCalculator;
  const mahjongStorageKey = 'm-app-mahjong-v1';
  const cookingModel = globalThis.CookingGuide;
  const cookingModule = globalThis.CookingModule;
  const legacyCookingStorageKey = 'm-app-cooking-v1';
  const pageLabels = { recent: '最近', modules: '模块', settings: '设置', changelog: '版本内容' };
  const modules = {
    cooking: { label: '烹饪指南', item: '菜谱', icon: 'chef-hat' },
    people: { label: '人物卡片', item: '人物卡片', icon: 'user-round', field: '姓名', note: '关系和备注' },
    food: { label: '美食记录', item: '美食记录', icon: 'utensils', field: '店名', note: '推荐菜和口味' },
    parking: { label: '停车备忘', icon: 'square-parking' },
    calculator: { label: '计算器', icon: 'calculator' },
    mahjong: { label: '麻将胡结算', icon: 'mahjong' }
  };
  const persistentKinds = ['cooking', 'people', 'food'];
  const widgetChoices = [
    { key: 'parking', name: '当前停车', meta: '显示当前车位，也可快速记录', symbol: 'square-parking', view: parkingWidgetView },
    { key: 'none', name: '隐藏小组件', symbol: 'circle-minus' }
  ];
  const state = {
    page: 'recent',
    category: 'permanent',
    module: null,
    moduleScreen: 'content',
    modulePreferences: {},
    moduleView: 'grid',
    enabledModules: Object.keys(modules),
    appearance: 'system',
    widget: 'parking',
    mahjong: loadMahjong(),
    parking: { place: '环贸广场', area: 'B2 · C 区', number: '128', time: '14:32' },
    records: [
      ...loadLegacyCooking(),
      { id: 'person-lin', kind: 'people', title: '林然', summary: '朋友 · 生日 5 月 18 日', time: '昨天', detail: '朋友。生日 5 月 18 日，喜欢手冲咖啡。' },
      { id: 'food-wutong', kind: 'food', title: '梧桐面馆', summary: '葱油拌面 · 小馄饨', time: '昨天', detail: '葱油拌面有很香的葱味。小馄饨汤底清淡，适合一起点。' }
    ]
  };
  const cookingStore = globalThis.CookingStore.createStore(state.records.filter((record) => record.kind === 'cooking'));
  const cookingUpdates = typeof BroadcastChannel === 'function' ? new BroadcastChannel('m-app-cooking-updates') : null;
  const drafts = new Map();
  const scrollPositions = new Map();
  let nextId = 1;
  let returnFocus;
  let noticeTimer;
  let dragStart;
  let draggedHandle = false;
  let recentlyCompleted;

  const icon = (name) => name === 'mahjong' ? '<span aria-hidden="true">胡</span>' : `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const findRecord = (key) => state.records.find((record) => record.id === key);
  const timeNow = () => new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
  const cookingWindow = cookingModule.createWindow(root.querySelector('[data-cooking-window]'), shell, saveRecipe, replacementFocus);

  function loadLegacyCooking() {
    try {
      const saved = JSON.parse(localStorage.getItem(legacyCookingStorageKey));
      if (Array.isArray(saved)) return saved.filter((record) => record?.kind === 'cooking'
        && typeof record.title === 'string' && typeof record.id === 'string' && record.id);
    } catch {
      // The sample remains available if browser storage cannot be read.
    }
    return [{ id: 'recipe-scallion', kind: 'cooking', title: '葱油拌面', summary: '20 分钟 · 家常快手', time: '12:18',
      detail: '小火炸香葱段。调入生抽、老抽和一小勺糖，浇在沥干的细面上，拌匀。', recipe: cookingModel.DEMO_RECIPE }];
  }

  function useCookingRecords(recipes) {
    const previous = state.records.filter((record) => record.kind === 'cooking');
    const recipeIds = new Set(recipes.map((record) => record.id));
    const hasCollision = state.records.some((record) => record.kind !== 'cooking' && recipeIds.has(record.id));
    if (!hasCollision && JSON.stringify(previous) === JSON.stringify(recipes)) return;
    const previousIds = new Set(previous.map((record) => record.id));
    const addedCount = recipes.filter((record) => !previousIds.has(record.id)).length;
    const merged = recipes.slice(0, addedCount);
    let index = addedCount;
    for (const record of state.records) {
      if (record.kind === 'cooking') {
        if (index < recipes.length) merged.push(recipes[index++]);
      } else {
        merged.push(recipeIds.has(record.id) ? { ...record, id: nextRecordId(recipeIds) } : record);
      }
    }
    state.records = [...merged, ...recipes.slice(index)];
    render();
  }

  async function refreshCookingRecords() {
    useCookingRecords(await cookingStore.read());
  }

  async function replaceCookingRecords(records, expectedRecipes) {
    await cookingStore.replace(records.filter((record) => record.kind === 'cooking'), expectedRecipes);
    cookingUpdates?.postMessage('changed');
  }

  function nextRecordId(reserved) {
    let id;
    do { id = `record-${nextId++}`; } while (findRecord(id) || reserved?.has(id));
    return id;
  }

  async function saveRecipe({ title, summary, recipe }, previous) {
    const record = { id: previous?.id ?? `recipe-${crypto.randomUUID()}`, kind: 'cooking', title, summary,
      time: previous?.time ?? timeNow(), detail: recipe.steps[0].text.slice(0, 180), recipe };
    useCookingRecords(await cookingStore.save(record, previous));
    cookingUpdates?.postMessage('changed');
    showNotice('菜谱已保存');
    return record;
  }

  function loadMahjong() {
    try {
      const saved = localStorage.getItem(mahjongStorageKey) ?? localStorage.getItem('mahjong_state_v4');
      return mahjongCalculator.normalizeState(JSON.parse(saved));
    } catch {
      return mahjongCalculator.normalizeState();
    }
  }

  function persistMahjong() {
    try {
      localStorage.setItem(mahjongStorageKey, JSON.stringify(state.mahjong));
      return true;
    } catch {
      showNotice('麻将数据未能保存到此浏览器');
      return false;
    }
  }

  function updateIcons() {
    globalThis.lucide?.createIcons({ attrs: { width: 18, height: 18 } });
  }

  function syncHeader() {
    const hasModuleTabs = state.page === 'modules';
    const isChangelog = state.page === 'changelog';
    pageTitle.textContent = pageLabels[state.page];
    pageTitle.hidden = hasModuleTabs;
    addButton.hidden = state.page !== 'recent';
    releaseBack.hidden = !isChangelog;
    mainNavigation.hidden = isChangelog;
    moduleTabs.hidden = !hasModuleTabs;
    syncModuleViewPicker();
    syncModuleWindow();
  }

  function applyAppearance() {
    app.dataset.appearance = state.appearance;
  }

  function setPage(key) {
    if (key !== state.page) stopModuleMotion();
    const previous = pages.find((page) => page.dataset.page === state.page);
    scrollPositions.set(state.page, previous.scrollTop);
    state.page = key;
    syncHeader();
    for (const page of pages) page.hidden = page.dataset.page !== key;
    const tabKey = key === 'changelog' ? 'settings' : key;
    for (const tab of tabs) {
      if (tab.dataset.tab === tabKey) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    }
    pages.find((page) => page.dataset.page === key).scrollTop = scrollPositions.get(key) || 0;
  }

  function parkingTitle(parking) {
    return [parking.area, parking.number].filter(Boolean).join(' · ') || parking.place;
  }

  function parkingWidgetView() {
    return state.parking
      ? { label: '当前停车', title: parkingTitle(state.parking), meta: `${state.parking.place} · ${state.parking.time}`, action: 'record', key: 'parking' }
      : { label: '停车记录', title: '记录停车', meta: '保存楼层、区域和车位号', action: 'create', key: 'parking' };
  }

  function renderWidget() {
    const choice = widgetChoices.find((option) => option.key === state.widget);
    const item = choice?.view?.();
    if (!item) {
      widgetSlot.innerHTML = `<button class="secondary cursor-interaction" type="button" data-action="widget-settings">${icon('plus')}添加小组件</button>`;
      return;
    }
    widgetSlot.innerHTML = `
      <article class="widget">
        <span class="widget-decoration" aria-hidden="true"></span>
        <button class="widget-body cursor-interaction" type="button" data-action="${item.action}" data-key="${item.key}">
          <span class="widget-label">${icon(choice.symbol)}<span></span></span>
          <span class="widget-title"></span>
          <span class="widget-meta"></span>
        </button>
        <button class="widget-config cursor-interaction" type="button" data-action="widget-settings" aria-label="编辑小组件">${icon('sliders-horizontal')}</button>
      </article>`;
    widgetSlot.querySelector('.widget-label span').textContent = item.label;
    widgetSlot.querySelector('.widget-title').textContent = item.title;
    widgetSlot.querySelector('.widget-meta').textContent = item.meta;
  }

  function recordRow(record) {
    const button = document.createElement('button');
    button.className = 'record cursor-interaction';
    button.type = 'button';
    button.dataset.action = 'record';
    button.dataset.key = record.id;
    button.innerHTML = `
      <span class="record-icon" data-kind="${record.kind}">${icon(modules[record.kind].icon)}</span>
      <span class="record-info"><span class="record-name"></span><span class="record-meta"></span></span>
      <span class="record-time"></span>`;
    button.querySelector('.record-name').textContent = record.title;
    button.querySelector('.record-meta').textContent = [modules[record.kind].label, record.summary].filter(Boolean).join(' · ');
    button.querySelector('.record-time').textContent = record.time;
    return button;
  }

  function renderRecent() {
    const rows = state.records.map(recordRow);
    if (state.parking && state.widget !== 'parking') {
      rows.unshift(recordRow({ id: 'parking', kind: 'parking', title: parkingTitle(state.parking), summary: state.parking.place, time: state.parking.time }));
    }
    if (rows.length) recentList.replaceChildren(...rows);
    else recentList.innerHTML = '<p class="empty">还没有最近记录</p>';
  }

  function render() {
    renderWidget();
    renderRecent();
    renderModules();
    syncHeader();
    enabledModuleCount.textContent = `${state.enabledModules.length} 个模块`;
    updateIcons();
  }

  function toggleManagedModule(key) {
    const wasEnabled = state.enabledModules.includes(key);
    state.enabledModules = Object.keys(modules).filter((module) => module === key ? !wasEnabled : state.enabledModules.includes(module));
    if (!state.enabledModules.includes(state.module)) state.module = null;
    render();
  }

  function setSheet(label, html, trigger) {
    if (overlay.dataset.open === 'false' && !overlay.hidden) return;
    sheetTitle.textContent = label;
    sheetContent.innerHTML = html;
    sheet.scrollTop = 0;
    if (overlay.hidden) {
      returnFocus = trigger;
      overlay.hidden = false;
      shell.inert = true;
      notice.inert = true;
      overlay.getBoundingClientRect();
      overlay.dataset.open = 'true';
    }
    closeButton.focus({ preventScroll: true });
    updateIcons();
  }

  function replacementFocus(trigger) {
    const replacement = [...root.querySelectorAll('[data-action]')].find((button) => !button.closest('[hidden], [inert]')
      && button.dataset.action === trigger?.dataset.action && button.dataset.key === trigger?.dataset.key);
    const widgetButton = trigger?.matches('.widget-body') && widgetSlot.querySelector('.widget-body');
    const pageControl = state.page === 'modules'
      ? (state.module ? moduleBack : moduleTabs.querySelector('[aria-selected="true"]'))
      : tabs.find((tab) => tab.dataset.tab === state.page);
    return replacement || widgetButton || pageControl;
  }

  function focusAfterClose() {
    (returnFocus?.isConnected ? returnFocus : replacementFocus(returnFocus))?.focus({ preventScroll: true });
  }

  function closeSheet(afterClose) {
    if (overlay.dataset.open !== 'true') return;
    overlay.dataset.open = 'false';
    sheet.style.removeProperty('--drag');
    const finish = () => {
      overlay.hidden = true;
      shell.inert = false;
      notice.inert = false;
      focusAfterClose();
      afterClose?.();
    };
    if (reducedMotion.matches) finish();
    else setTimeout(finish, 280);
  }

  function showNotice(text, canUndo = false) {
    clearTimeout(noticeTimer);
    notice.innerHTML = `<span></span>${canUndo ? '<button class="notice-action cursor-interaction" type="button" data-action="undo-parking">撤销</button>' : ''}`;
    notice.firstElementChild.textContent = text;
    notice.hidden = false;
    status.textContent = text;
    noticeTimer = setTimeout(() => { notice.hidden = true; }, canUndo ? 5200 : 2300);
  }

  function optionRow({ action, key, name, meta, symbol, selected }) {
    const marker = selected === undefined ? icon('chevron-right') : selected ? icon('check') : '';
    const pressed = selected === undefined ? '' : ` aria-pressed="${selected}"`;
    return `<button class="option cursor-interaction" type="button" data-action="${action}" data-key="${key}"${pressed}>
      ${symbol ? `<span class="record-icon">${icon(symbol)}</span>` : ''}
      <span class="option-text"><span class="option-name">${name}</span>${meta ? `<span class="option-meta">${meta}</span>` : ''}</span>
      <span class="option-marker">${marker}</span>
    </button>`;
  }

  function showWidgetSettings(trigger) {
    const options = widgetChoices.map((item) => optionRow({ ...item, action: 'set-widget', selected: state.widget === item.key }));
    setSheet('编辑小组件', `<div class="rows">${options.join('')}</div>`, trigger);
  }

  function showAdd(trigger) {
    const options = ['parking', ...persistentKinds].map((kind) => optionRow({
      action: 'create', key: kind, name: kind === 'parking' ? (state.parking ? '更新车位' : '记录停车') : `新增${modules[kind].item}`, symbol: modules[kind].icon
    }));
    setSheet('新增记录', `<div class="rows">${options.join('')}</div>`, trigger);
  }

  function showCreate(kind, trigger) {
    if (kind === 'cooking') {
      if (overlay.dataset.open === 'true') {
        const source = returnFocus;
        closeSheet(() => cookingWindow.open(null, source));
      } else if (overlay.hidden) cookingWindow.open(null, trigger);
      return;
    }
    const parking = kind === 'parking';
    const updatingParking = parking && state.parking;
    const module = modules[kind];
    const fields = parking
      ? '<label class="field">停车地点<input name="place" maxlength="28" required placeholder="例如环贸广场"></label><label class="field">楼层和区域<input name="area" maxlength="18" placeholder="例如 B2 · C 区"></label><label class="field">车位号<input name="number" maxlength="12" placeholder="例如 128"></label>'
      : `<label class="field">${module.field}<input name="title" maxlength="30" required></label><label class="field">${module.note}<textarea name="note" rows="2" maxlength="180"></textarea></label>`;
    const label = updatingParking ? '更新车位' : parking ? '记录停车' : `新增${module.item}`;
    setSheet(label, `<form class="form" data-create="${kind}">
      ${fields}<button class="primary cursor-interaction" type="button" data-action="save">${parking ? '保存车位' : '保存记录'}</button></form>`, trigger);
    const draft = drafts.get(kind) || (updatingParking && Object.entries(updatingParking).filter(([name]) => name !== 'time'));
    const form = sheetContent.querySelector('form');
    if (draft) for (const [name, value] of draft) form.elements.namedItem(name).value = value;
  }

  function showRecord(key, trigger) {
    if (key === 'parking') {
      if (!state.parking) {
        showCreate('parking', trigger);
        return;
      }
      setSheet('当前停车', `<div class="detail">
        <strong class="detail-value"></strong><p></p>
        <button class="primary cursor-interaction" type="button" data-action="complete-parking">已取车</button></div>`, trigger);
      sheetContent.querySelector('strong').textContent = parkingTitle(state.parking);
      sheetContent.querySelector('p').textContent = `今天 ${state.parking.time} · ${state.parking.place}`;
      return;
    }
    const record = findRecord(key);
    if (!record) return;
    if (record.kind === 'cooking') {
      cookingWindow.open(record, trigger);
      return;
    }
    setSheet(record.title, '<div class="detail"><p></p></div>', trigger);
    sheetContent.querySelector('p').textContent = record.detail || record.summary;
  }

  function save(form) {
    if (overlay.dataset.open !== 'true') return;
    const required = form.querySelector('input[required]');
    required.value = required.value.trim();
    if (!form.reportValidity()) return;
    const values = new FormData(form);
    const kind = form.dataset.create;
    if (kind === 'parking') {
      recentlyCompleted = undefined;
      state.parking = { place: values.get('place'), area: values.get('area').trim(), number: values.get('number').trim(), time: timeNow() };
    } else {
      const detail = values.get('note').trim();
      const summary = detail ? detail.split('\n', 1)[0] : '刚刚添加';
      state.records.unshift({ id: nextRecordId(), kind, title: values.get('title'), summary, detail, time: timeNow() });

    drafts.delete(kind);
    render();
    closeSheet(() => showNotice(kind === 'parking' ? '车位已保存' : '记录已保存'));

    for (const icon of moduleViewIcons) icon.hidden = icon.dataset.viewIcon !== state.moduleView;

  function selectModuleView(key) {

  function renderCategoryEntries() {
    const keys = moduleCategories[state.category].filter((key) => state.enabledModules.includes(key));
    if (!keys.length) {
      moduleDirectory.innerHTML = `<div class="module-feature">
        <p class="feature-meta">此分类暂无已启用的模块。</p>
        <button class="secondary cursor-interaction" type="button" data-action="settings-item" data-key="modules">模块管理</button>
      </div>`;
      return;
    }

    const entries = keys.map((key) => optionRow({
      action: 'open-module', key, name: modules[key].label, meta: moduleEntryNotes[key], symbol: modules[key].icon
    }));
    moduleDirectory.innerHTML = `<div class="rows module-entries" data-view="${state.moduleView}">${entries.join('')}</div>`;
    if (state.category === 'temporary' && state.parking) {
      moduleDirectory.querySelector('[data-key="parking"] .option-meta').textContent = parkingTitle(state.parking);
    }
  }

  function renderPersistentModule(key) {
    const module = modules[key];
    const entries = state.records.filter((record) => record.kind === key);
    if (modulePreference(key) === 'name') entries.sort((left, right) => left.title.localeCompare(right.title, 'zh-CN'));
    if (key === 'cooking') {
      cookingModule.renderList(modulePane, entries, icon);
      return;
    }
    modulePane.innerHTML = `
      <section class="module-feature">
        <div class="feature-header">
          <span class="feature-icon">${icon(module.icon)}</span>
          <div class="feature-copy">
            <h2 class="feature-title">${module.label}</h2>
            <p class="feature-meta">${entries.length} 条记录</p>
          </div>
        </div>
        <div class="module-content">
          <div class="rows"></div>
          <button class="primary cursor-interaction" type="button" data-action="create" data-key="${key}">${icon('plus')}新增${module.item}</button>
        </div>
      </section>`;

    const list = modulePane.querySelector('.rows');
    if (entries.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = `暂无${module.item}`;
      list.append(empty);
      return;
    }

    for (const record of entries) {
      const row = recordRow(record);
      const summary = row.querySelector('.record-meta');
      summary.textContent = record.summary;
      summary.hidden = key === 'food' && modulePreference(key) === 'hide';
      list.append(row);
    }
  }

  function renderParkingModule() {
    modulePane.innerHTML = `
      <section class="module-feature">
        <div class="feature-header">
          <span class="feature-icon">${icon('square-parking')}</span>
          <div class="feature-copy">
            <h2 class="feature-title">停车备忘</h2>
            <p class="feature-value"></p>
            <p class="feature-meta"></p>
          </div>
        </div>
        <div class="module-actions">
          ${state.parking ? '<button class="primary cursor-interaction" type="button" data-action="complete-parking">已取车</button>' : ''}
          <button class="${state.parking ? 'secondary' : 'primary'} cursor-interaction" type="button" data-action="create" data-key="parking">${state.parking ? '更新车位' : '记录停车'}</button>
        </div>
      </section>`;
    modulePane.querySelector('.feature-value').textContent = state.parking ? parkingTitle(state.parking) : '当前没有停车记录';
    modulePane.querySelector('.feature-meta').textContent = state.parking
      ? [state.parking.place, ...(modulePreference('parking') === 'show' ? [state.parking.time] : [])].join(' · ')
      : '保存地点和车位，取车后结束。';
  }

  function updateCalculatorResult(form) {
    const amount = form.elements.amount.valueAsNumber;
    const people = form.elements.people.valueAsNumber;
    const digits = modulePreference('calculator') === 'whole' ? 0 : 2;
    form.querySelector('output').textContent = form.checkValidity()
      ? `每人 ¥${(amount / people).toFixed(digits)}`
      : '请输入金额和人数';
  }

  function renderCalculatorModule() {
    modulePane.innerHTML = `
      <section class="module-feature">
        <div class="feature-header">
          <span class="feature-icon">${icon('calculator')}</span>
          <div class="feature-copy"><h2 class="feature-title">聚餐分摊</h2></div>
        </div>
        <form class="form module-content" data-calculator>
          <label class="field">总金额<input name="amount" type="number" min="0" step="any" inputmode="decimal" required></label>
          <label class="field">人数<input name="people" type="number" min="1" inputmode="numeric" required></label>
          <output class="feature-value" aria-live="polite"></output>
        </form>
      </section>`;
    const form = modulePane.querySelector('[data-calculator]');
    form.elements.amount.value = calculatorDraft.amount;

    updateCalculatorResult(form);

  function syncModuleWindow() {
    const open = state.page === 'modules' && Boolean(state.module);
    shell.classList.toggle('module-open', open);
    topbar.inert = mainNavigation.inert = modulePage.inert = open;
    moduleWindow.inert = !open;
    moduleWindow.hidden = !open && !moduleMotion;
  }

  function stopModuleMotion() {
    if (!moduleMotion) return;
    moduleMotion.cancel();
    moduleMotion = null;
    shell.classList.remove('module-moving');
    syncModuleWindow();
  }

  function playModuleMotion(iconBounds, closing = false) {
    const paintedBounds = moduleWindow.getBoundingClientRect();
    const style = getComputedStyle(moduleWindow);
    const opacity = Number(style.opacity);
    const borderRadius = style.borderRadius;
    stopModuleMotion();
    if (!iconBounds?.width || reducedMotion.matches || typeof moduleWindow.animate !== 'function') return;
    const bounds = moduleWindow.getBoundingClientRect();
    if (!bounds.width || !bounds.height) return;
    const pageBounds = modulePage.getBoundingClientRect();
    const scale = Math.min(iconBounds.width / bounds.width, iconBounds.height / bounds.height);
    const iconCenterX = iconBounds.left + iconBounds.width / 2;
    const iconCenterY = Math.max(pageBounds.top, Math.min(pageBounds.bottom, iconBounds.top + iconBounds.height / 2));
    const x = iconCenterX - bounds.left;
    const y = iconCenterY - bounds.top;
    const atIcon = (size) => `translate(${x - bounds.width * size / 2}px, ${y - bounds.height * size / 2}px) scale(${size})`;
    const current = {
      transform: `translate(${paintedBounds.left - bounds.left}px, ${paintedBounds.top - bounds.top}px) scale(${paintedBounds.width / bounds.width})`,
      opacity,
      borderRadius
    };
    const frames = closing
      ? [current, { transform: atIcon(0), opacity: 0, borderRadius: '32px' }]
      : [{ transform: atIcon(scale), opacity: .45, borderRadius: '32px' }, { transform: 'none', opacity: 1, borderRadius: '0px' }];
    shell.classList.add('module-moving');
    const animation = moduleWindow.animate(frames, closing ? moduleReturnTiming : moduleMotionTiming);
    moduleMotion = animation;
    animation.onfinish = () => { if (moduleMotion === animation) stopModuleMotion(); };
  }

  function renderModules() {
    stopModuleMotion();
    const calculator = modulePane.querySelector('[data-calculator]');
    if (calculator) {
      calculatorDraft.amount = calculator.elements.amount.value;
      calculatorDraft.people = calculator.elements.people.value;
    }

    if (!state.enabledModules.includes(state.module)) state.module = null;
    renderModuleTabs();
    renderCategoryEntries();
    syncModuleWindow();
    if (!state.module) {
      state.moduleScreen = 'content';
      modulePane.replaceChildren();
      return;
    }

    if (state.moduleScreen === 'settings') renderModuleSettings(state.module);
    else if (state.moduleScreen === 'releases') renderModuleReleases(state.module);
    else if (state.module === 'parking') renderParkingModule();
    else if (state.module === 'calculator') renderCalculatorModule();
    else if (state.module === 'mahjong') globalThis.MahjongModule.render(modulePane, state.mahjong, persistMahjong);
    else renderPersistentModule(state.module);
    const categoryLabel = categoryTabs.find((tab) => tab.dataset.key === state.category).textContent;
    const moduleLabel = modules[state.module].label;
    const backLabel = state.moduleScreen === 'releases' ? '模块设置'
      : state.moduleScreen === 'settings' ? moduleLabel : categoryLabel;
    moduleWindow.setAttribute('aria-label', moduleLabel);
    moduleBack.setAttribute('aria-label', `返回${backLabel}`);
    moduleBack.dataset.action = state.moduleScreen === 'content' ? 'back-to-category' : 'back-in-module';
    moduleSettingsButton.hidden = state.moduleScreen !== 'content';
    moduleSettingsButton.setAttribute('aria-label', `${moduleLabel}设置`);
  }

  function selectCategory(key) {
    if (key === state.category) return;
    stopModuleMotion();
    categoryScrollPositions.set(state.category, modulePage.scrollTop);
    state.category = key;
    renderModuleTabs();
    renderCategoryEntries();
    updateIcons();
    modulePage.scrollTop = categoryScrollPositions.get(key) || 0;
  }

  function openModule(key, button) {
    if (!state.enabledModules.includes(key) || !moduleCategories[state.category].includes(key)) return;
    const iconBounds = button.querySelector('.record-icon').getBoundingClientRect();
    categoryScrollPositions.set(state.category, modulePage.scrollTop);
    state.module = key;
    state.moduleScreen = 'content';
    renderModules();
    updateIcons();
    modulePane.scrollTop = 0;
    playModuleMotion(iconBounds);
    moduleBack.focus({ preventScroll: true });
  }

  function backToModuleCategory() {
    const module = state.module;
    if (!module) return;
    modulePage.scrollTop = categoryScrollPositions.get(state.category) || 0;
    const entry = moduleDirectory.querySelector(`[data-action="open-module"][data-key="${module}"]`);
    playModuleMotion(entry?.querySelector('.record-icon').getBoundingClientRect(), true);
    state.module = null;
    state.moduleScreen = 'content';
    syncModuleWindow();
    entry?.focus({ preventScroll: true });
  }

  function setModuleScreen(screen, focusTarget) {
    moduleScrollPositions.set(`${state.module}:${state.moduleScreen}`, modulePane.scrollTop);
    state.moduleScreen = screen;
    renderModules();
    updateIcons();
    modulePane.scrollTop = moduleScrollPositions.get(`${state.module}:${screen}`) || 0;
    const target = focusTarget ? moduleWindow.querySelector(focusTarget) : moduleBack;
    target?.focus({ preventScroll: true });
  }

  function backInModule() {
    if (state.moduleScreen === 'releases') setModuleScreen('settings', '[data-action="open-module-releases"]');
    else setModuleScreen('content', '[data-action="open-module-settings"]');
  }

  function setModulePreference(key) {
    if (!moduleSettings[state.module].options.some((option) => option.key === key)) return;
    if (state.module === 'mahjong') {
      state.mahjong.colorMode = key;
      persistMahjong();
    } else state.modulePreferences[state.module] = key;
    const scrollTop = modulePane.scrollTop;
    renderModules();
    updateIcons();
    modulePane.scrollTop = scrollTop;
    modulePane.querySelector(`[data-action="module-preference"][data-key="${key}"]`)?.focus({ preventScroll: true });
  }

  const moduleSettings = {
    cooking: {
      preferenceLabel: '菜谱排序',
      defaultPreference: 'recent',
      options: [
        { key: 'recent', label: '最近添加优先', symbol: 'clock-3' },
        { key: 'name', label: '按菜名排序', symbol: 'book-open' }
      ],
      releases: [{
        version: '0.2.0',

  function backupString(value, field, maxLength, required = false) {
    if (typeof value !== 'string' || value.length > maxLength || (required && !value.trim())) {
      throw new Error(`备份中的${field}格式不正确。`);
    }
    return value;
  }

  function parseSettingsBackup(source) {
    if (!source.trim()) throw new Error('请先粘贴 JSON 备份。');
    let json;
    try {
      json = JSON.parse(source);
    } catch {
      throw new Error('没有读到有效的 JSON，请检查备份是否完整。');
    }
    if (json?.format !== backupFormat || json.schema !== 1 || !Array.isArray(json.records)) {
      throw new Error('请选择由这个预览导出的 M_APP 备份。');
    }
    const recordIds = new Set();
    const records = json.records.map((record) => {
      if (!record || !persistentKinds.includes(record.kind) || typeof record.id !== 'string'
        || !backupIdPattern.test(record.id) || ['parking', 'none'].includes(record.id) || recordIds.has(record.id)) {
        throw new Error('备份中的记录类型或编号无效。');
      }
      recordIds.add(record.id);
      const recipe = record.kind === 'cooking' && Object.hasOwn(record, 'recipe')
        ? cookingModel.normalizeRecipe(record.recipe, { strict: true }) : undefined;
      return {
        id: record.id,
        kind: record.kind,
        title: backupString(record.title, '标题', 30, true),
        summary: backupString(record.summary, '摘要', 180),
        time: backupString(record.time, '时间', 32, true),
        detail: backupString(record.detail, '内容', 180),
        ...(recipe && { recipe })
      };
    });
    let parking = null;
    if (json.parking !== null) {
      if (!json.parking || typeof json.parking !== 'object' || Array.isArray(json.parking)) {
        throw new Error('备份中的停车记录格式不正确。');
      }
      parking = {
        place: backupString(json.parking.place, '停车地点', 28, true),
        area: backupString(json.parking.area, '楼层和区域', 18),
        number: backupString(json.parking.number, '车位号', 12),
        time: backupString(json.parking.time, '停车时间', 32, true)
      };
    }
    const mahjong = Object.hasOwn(json, 'mahjong')
      ? mahjongCalculator.normalizeState(json.mahjong, { strict: true })
      : undefined;
    return { records, parking, mahjong, source };
  }

  async function applySettingsImport(_, trigger) {
    if (!pendingBackup || importingBackup) return;
    const backup = pendingBackup;
    const { records, parking, mahjong, cookingBase } = backup;
    const edit = sheetContent.querySelector('[data-action="edit-settings-import"]');
    const message = sheetContent.querySelector('[data-backup-error]');
    importingBackup = true;
    trigger.disabled = true;
    trigger.textContent = '正在导入…';
    edit.disabled = true;
    message.hidden = true;
    try {
      await replaceCookingRecords(records, cookingBase);
    } catch (error) {
      if (backupSheetIsOpen(trigger)) {
        trigger.disabled = false;
        trigger.textContent = '确认导入';
        edit.disabled = false;
        message.hidden = false;
        message.textContent = error.message;
        trigger.focus({ preventScroll: true });
      } else showNotice(error.message);
      return;
    } finally {
      importingBackup = false;
    }
    if (pendingBackup === backup) pendingBackup = undefined;
    state.records = records;
    state.parking = parking;
    recentlyCompleted = undefined;
    drafts.clear();
    cookingWindow.clearDraft();
    notice.hidden = true;
    const previousMahjong = state.mahjong;
    if (mahjong) state.mahjong = mahjong;
    const saved = !mahjong || persistMahjong();
    if (!saved) state.mahjong = previousMahjong;
    render();
    const announce = () => showNotice(saved ? '已导入数据' : '记录和车位已导入，麻将数据未保存');
    if (backupSheetIsOpen(trigger)) closeSheet(announce);
    else announce();
  }

  function showSettingsItem(key, trigger) {
    switch (key) {
      case 'account':
        setSheet('我的账号', `<div class="detail settings-detail">
          <h3>M_APP 预览用户</h3><p>本地示例账号</p></div>`, trigger);
        break;
      case 'modules':
        showManagedModules(trigger);
        break;
      case 'preferences':
        showPreferences(trigger);
        break;
      case 'data':
        showDataSettings(trigger);
        break;
      case 'about':
        setSheet('关于我们', `<div class="detail settings-detail">
          <h3>M_APP</h3><p>在一处整理菜谱、人物、美食和临时停车记录。</p><p>当前原型版本 v${settingsVersion}</p></div>`, trigger);
        break;
      case 'changelog':
        showChangelog();
        break;
    }
  }

  const settingsActions = {
    'settings-item': showSettingsItem,
    'back-from-changelog': backFromChangelog,
    'toggle-managed-module': (key, button) => {
      const scrollTop = sheet.scrollTop;
      toggleManagedModule(key);
      showManagedModules(button);
      sheet.scrollTop = scrollTop;
      sheetContent.querySelector(`[data-key="${key}"]`).focus({ preventScroll: true });
    },
    'settings-appearance': (key, button) => {
      state.appearance = key;
      applyAppearance();
      showPreferences(button);
      sheetContent.querySelector(`[data-key="${key}"]`).focus({ preventScroll: true });
    },
    'settings-backup-view': (key, button) => {
      if (key === 'import') showBackupImport(button);
      else showBackupExport(button);
    },
    'select-settings-backup': () => {
      const output = sheetContent.querySelector('[data-backup-output]');
      output.focus();
      output.select();
    },
    'review-settings-import': (_, button) => reviewSettingsImport(button),
    'edit-settings-import': (_, button) => showBackupImport(button, pendingBackup?.source),
    'apply-settings-import': applySettingsImport
  };

  const actions = {
    ...moduleActions,
    ...settingsActions,
    'widget-settings': (_, button) => showWidgetSettings(button),
    'set-widget': (key) => {
      if (!widgetChoices.some((option) => option.key === key)) return;
      state.widget = key;
      render();
      closeSheet(() => showNotice(key === 'none' ? '小组件已隐藏' : '小组件已更新'));
    },
    add: (_, button) => showAdd(button),
    create: showCreate,
    record: showRecord,
    save: (_, button) => save(button.closest('[data-create]')),
    'complete-parking': () => {
      if (!state.parking) return;
      recentlyCompleted = state.parking;
      state.parking = null;
      drafts.delete('parking');
      render();
      if (overlay.dataset.open === 'true') closeSheet(() => showNotice('停车记录已结束', true));
      else {
        modulePane.querySelector('[data-action="create"][data-key="parking"]')?.focus({ preventScroll: true });
        showNotice('停车记录已结束', true);
      }
    },
    'undo-parking': () => {
      if (state.parking || !recentlyCompleted) return;
      state.parking = recentlyCompleted;
      recentlyCompleted = undefined;
      render();
      const pageControl = state.page === 'changelog' ? releaseBack
        : state.page === 'modules' && state.module ? moduleBack : tabs.find((tab) => tab.dataset.tab === state.page);
      pageControl.focus({ preventScroll: true });
      showNotice('停车记录已恢复');
    }
  };

  root.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (button?.dataset.tab) setPage(button.dataset.tab);
    if (button === handle && draggedHandle && event.detail !== 0) return;
    if (button?.hasAttribute('data-close-sheet') || event.target === overlay) closeSheet();
    if (button?.dataset.action) actions[button.dataset.action]?.(button.dataset.key, button);
  });

  root.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape' || !overlay.hidden || event.defaultPrevented) return;
    if (state.page === 'changelog') {
      event.preventDefault();
      backFromChangelog();
    } else if (state.page === 'modules' && state.module) {
      event.preventDefault();
      if (state.moduleScreen === 'content') backToModuleCategory();
      else backInModule();
    }
  });

  root.addEventListener('input', (event) => {
    const form = event.target.closest('form');
    if (!form) return;
    if (form.dataset.create) drafts.set(form.dataset.create, new FormData(form));
    if (form.hasAttribute('data-calculator')) updateCalculatorResult(form);
  });
  root.addEventListener('submit', (event) => event.preventDefault());

  overlay.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      event.preventDefault();
      closeSheet();
    }
    if (event.key === 'Enter' && event.target.tagName === 'INPUT' && !event.isComposing) {
      const form = event.target.closest('[data-create]');
      if (form) {
        event.preventDefault();
        save(form);
      }
    }
    if (event.key !== 'Tab') return;
    const controls = [...sheet.querySelectorAll('button, input, textarea')].filter((element) => element.getClientRects().length);
    const first = controls[0];
    const last = controls[controls.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  handle.addEventListener('pointerdown', (event) => {
    if (!event.isPrimary || event.button !== 0) return;
    draggedHandle = false;
    dragStart = event.clientY;
    sheet.dataset.dragging = 'true';
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', (event) => {
    if (dragStart === undefined || !event.isPrimary) return;
    const distance = event.clientY - dragStart;
    if (Math.abs(distance) > 6) draggedHandle = true;
    if (!reducedMotion.matches) sheet.style.setProperty('--drag', `${Math.max(0, distance)}px`);
  });
  function finishDrag(event) {
    if (dragStart === undefined || !event.isPrimary) return;
    const distance = event.clientY - dragStart;
    dragStart = undefined;
    sheet.dataset.dragging = 'false';
    if (event.type === 'pointerup' && distance > 54) closeSheet();
    else sheet.style.removeProperty('--drag');
  }
  handle.addEventListener('pointerup', finishDrag);
  handle.addEventListener('pointercancel', finishDrag);

  setPage(state.page);
  applyAppearance();
  root.querySelector('[data-app-version]').textContent = `v${settingsVersion}`;
  renderChangelog();
  render();
  const syncCookingRecords = () => refreshCookingRecords().catch(() => {});
  cookingUpdates?.addEventListener('message', syncCookingRecords);
  window.addEventListener('focus', syncCookingRecords);
  syncCookingRecords();
})();
</script>
