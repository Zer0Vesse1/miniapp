<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniAPP - 生活助手</title>
    <script>
      // apply stored theme & font-size before page paint to prevent flash
      (function () {
        try {
          var theme = localStorage.getItem('miniapp-theme') || 'system';
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          document.documentElement.setAttribute('data-theme', resolved);
          var fontSize = localStorage.getItem('miniapp-font-size') || 'medium';
          document.documentElement.setAttribute('data-font-size', fontSize);
        } catch (e) {
          /* noop */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
