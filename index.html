<script>
(() => {
  'use strict';

  const PLAYERS = Object.freeze(['a', 'b', 'c', 'd']);
  const DEFAULT_NAMES = Object.freeze({ a: '甲', b: '乙', c: '丙', d: '丁' });
  const DEFAULT_RATE = 0.05;
  const DEFAULT_RESTING = 'd';
  const NAME_LIMIT = 6;

  function readNumber(value) {
    if (typeof value === 'number') return value;
    return typeof value === 'string' && value.trim() ? Number(value) : NaN;
  }

  function readRateCents(decimal) {
    const parts = /^(\d*)(?:\.(\d{0,2})0*)?$/.exec(decimal);
    if (!parts) return null;
    const [, yuan, fraction = ''] = parts;
    return BigInt(yuan || '0') * 100n + BigInt(fraction.padEnd(2, '0'));
  }

  function parseRate(value) {
    const rate = readNumber(value);
    if (!(rate > 0 && rate <= Number.MAX_SAFE_INTEGER / 100)) return null;
    const cents = readRateCents(String(rate));
    if (typeof value === 'string' && cents !== readRateCents(value.trim())) return null;
    return cents === null ? null : rate;
  }

  function readRound(hu, resting) {
    if (!PLAYERS.includes(resting)) return null;
    const round = { resting };
    for (const player of PLAYERS) {
      const count = player === resting ? 0 : readNumber(hu?.[player]);
      if (!Number.isSafeInteger(count)) return null;
      round[player] = count;
    }
    return round;
  }

  function createRound(hu, resting) {
    const round = readRound(hu, resting);
    if (!round) throw new Error('请为上场的三位玩家填写整数胡数。');
    return round;
  }

  function normalizeState(value, { strict = false } = {}) {
    const resting = value?.resting;
    const colorMode = value?.colorMode;
    const rate = parseRate(value?.rate);
    const playerNames = {};
    for (const player of PLAYERS) {
      const name = value?.playerNames?.[player];
      const trimmed = typeof name === 'string' ? name.trim() : '';
      if (strict && (!trimmed || trimmed.length > NAME_LIMIT)) {
        throw new Error('备份中的麻将玩家名称格式不正确。');
      }
      const shortened = trimmed.slice(0, NAME_LIMIT).replace(/[\uD800-\uDBFF]$/, '').trimEnd();
      playerNames[player] = shortened || DEFAULT_NAMES[player];
    }

    if (strict && (!PLAYERS.includes(resting) || !['default', 'chinese'].includes(colorMode)
      || rate === null || typeof value.rate !== 'number' || !Array.isArray(value.rounds))) {
      throw new Error('备份中的麻将结算设置格式不正确。');
    }

    const rounds = [];
    for (const source of Array.isArray(value?.rounds) ? value.rounds : []) {
      // Legacy records with three players omit the fourth player's score and rest status.
      const round = readRound(source, strict ? source?.resting : source?.resting ?? DEFAULT_RESTING);
      if (strict && (!round || PLAYERS.some(player => source[player] !== round[player]))) {
        throw new Error(`备份中的麻将第 ${rounds.length + 1} 局记录格式不正确。`);
      }
      if (round) rounds.push(round);
    }

    return {
      rounds,
      resting: PLAYERS.includes(resting) ? resting : DEFAULT_RESTING,
      playerNames,
      colorMode: colorMode === 'chinese' ? 'chinese' : 'default',
      rate: rate ?? DEFAULT_RATE
    };
  }

  function zeroAmounts() {
    return { a: 0n, b: 0n, c: 0n, d: 0n };
  }

  function toRateCents(rate) {
    const validRate = parseRate(rate);
    if (validRate === null) throw new Error('每胡金额须为大于 0 的金额，最多保留两位小数。');
    return readRateCents(String(validRate));
  }

  function settleInCents(round, rateCents) {
    const amounts = zeroAmounts();
    const active = PLAYERS.filter(player => player !== round.resting);
    for (const [index, left] of active.entries()) {
      for (const right of active.slice(index + 1)) {
        const difference = (BigInt(round[left]) - BigInt(round[right])) * rateCents;
        amounts[left] += difference;
        amounts[right] -= difference;
      }
    }
    return amounts;
  }

  function settleRound(round, rate) {
    return settleInCents(round, toRateCents(rate));
  }

  function summarize(rounds, rate) {
    const rateCents = toRateCents(rate);
    const totals = zeroAmounts();
    const results = rounds.map(round => {
      const amounts = settleInCents(round, rateCents);
      for (const player of PLAYERS) totals[player] += amounts[player];
      return amounts;
    });
    return { results, totals };
  }

  function formatMoney(cents) {
    const absolute = cents < 0n ? -cents : cents;
    const sign = cents < 0n ? '-' : cents > 0n ? '+' : '';
    return `${sign}${absolute / 100n}.${String(absolute % 100n).padStart(2, '0')}`;
  }

  globalThis.MahjongCalculator = Object.freeze({
    PLAYERS, DEFAULT_NAMES, DEFAULT_RATE, parseRate, normalizeState,
    createRound, settleRound, summarize, formatMoney
  });
})();
</script>

  function amount(cents) {
    const outcome = cents > 0n ? 'win' : cents < 0n ? 'loss' : 'even';
    return `<span class="mahjong-money" data-outcome="${outcome}">${formatMoney(cents)}</span>`;
  }

  function playerResults(totals, round) {
    return `<dl class="mahjong-results">${PLAYERS.map((player) => `
      <div class="mahjong-result">
        <dt data-player-name="${player}"></dt>
        <dd>${round?.resting === player ? '<span class="mahjong-muted">轮休</span>' : amount(totals[player])}</dd>
      </div>`).join('')}</dl>`;
  }

  function render(pane, model, onChange) {
    const scores = drafts.get(model) ?? {};
    drafts.set(model, scores);

    pane.innerHTML = `<div class="mahjong-view" data-mahjong-module data-color-mode="${model.colorMode}">
      <section class="module-feature">
        <div class="feature-header">
          <span class="feature-icon" aria-hidden="true">胡</span>
          <div class="feature-copy">
            <h2 class="feature-title">麻将胡结算</h2>
            <p class="feature-meta">每胡 ¥${model.rate.toFixed(2)} · 每局一人轮休</p>
          </div>
        </div>
        <fieldset class="mahjong-fieldset">
          <legend>玩家名称</legend>
          <div class="mahjong-grid">
            ${PLAYERS.map((player) => `<label class="field">${DEFAULT_NAMES[player]}<input type="text" name="name-${player}" aria-label="玩家${DEFAULT_NAMES[player]}名称" maxlength="6"></label>`).join('')}
          </div>
        </fieldset>
        <form class="form" data-mahjong-round>
          <fieldset class="mahjong-fieldset">
            <legend>本局轮休</legend>
            <div class="mahjong-rest">
              ${PLAYERS.map((player) => `<label>
                <input type="radio" name="resting" value="${player}">
                <span data-player-name="${player}"></span>
              </label>`).join('')}
            </div>
          </fieldset>
          <fieldset class="mahjong-fieldset">
            <legend>本局胡数</legend>
            <div class="mahjong-grid">
              ${PLAYERS.map((player) => `<label class="field">
                <span><span data-player-name="${player}"></span><span data-score-rest="${player}"></span></span>
                <input name="${player}" type="number" step="1" inputmode="numeric" required placeholder="0">
              </label>`).join('')}
            </div>
          </fieldset>
          <p class="mahjong-error" role="alert" hidden></p>
          <button class="primary cursor-interaction" type="submit">记录本局</button>
        </form>
      </section>
      <div data-mahjong-summary></div>
      <section class="module-feature mahjong-history" aria-labelledby="m-app-mahjong-history">
        <div class="mahjong-section-header">
          <h3 id="m-app-mahjong-history" tabindex="-1">历史记录</h3>
          <button class="cursor-interaction mahjong-delete" type="button" data-mahjong-clear hidden>全部清除</button>
        </div>
        <div class="mahjong-history-list"></div>
      </section>
      <p class="live-status" data-mahjong-status role="status"></p>
    </div>`;

    const view = pane.querySelector('[data-mahjong-module]');
    const form = view.querySelector('[data-mahjong-round]');
    const error = form.querySelector('[role="alert"]');
    const summary = view.querySelector('[data-mahjong-summary]');
    const history = view.querySelector('.mahjong-history-list');
    const historyHeading = view.querySelector('#m-app-mahjong-history');
    const clear = view.querySelector('[data-mahjong-clear]');
    const status = view.querySelector('[data-mahjong-status]');

    function showNames() {
      for (const element of view.querySelectorAll('[data-player-name]')) {
        element.textContent = model.playerNames[element.dataset.playerName];
      }
    }

    function showResting() {
      form.elements.resting.value = model.resting;
      for (const player of PLAYERS) {
        const resting = player === model.resting;
        const input = form.elements[player];
        input.disabled = resting;
        input.placeholder = resting ? '轮休' : '0';
        input.value = resting ? '' : scores[player] ?? '';
        view.querySelector(`[data-score-rest="${player}"]`).textContent = resting ? '（轮休）' : '';
      }
    }

    function showResults() {
      const { rounds, rate } = model;
      const { results, totals } = summarize(rounds, rate);
      const latest = rounds.at(-1);
      summary.innerHTML = latest ? `<section class="module-feature mahjong-summary">
        <div><h3>本局结果</h3>${playerResults(results.at(-1), latest)}</div>
        <div><h3>累计输赢 <span class="mahjong-muted">共 ${rounds.length} 局</span></h3>${playerResults(totals)}</div>
      </section>` : '';
      summary.hidden = !latest;
      clear.hidden = !latest;
      history.innerHTML = latest ? rounds.map((round, index) => `<article class="mahjong-history-round">
        <div class="mahjong-section-header">
          <h4>第 ${index + 1} 局</h4>
          <button class="cursor-interaction mahjong-delete" type="button" data-remove-round="${index}" aria-label="删除第 ${index + 1} 局">删除</button>
        </div>
        <dl class="mahjong-results">${PLAYERS.map((player) => `<div class="mahjong-result">
          <dt data-player-name="${player}"></dt>
          <dd class="mahjong-muted">${player === round.resting ? '轮休' : `${round[player]} 胡`}</dd>
          ${player === round.resting ? '' : `<dd>${amount(results[index][player])}</dd>`}
        </div>`).join('')}</dl>
      </article>`).join('') : '<p class="mahjong-muted">暂无对局记录</p>';
      showNames();
    }

    for (const player of PLAYERS) {
      const name = view.querySelector(`[name="name-${player}"]`);
      name.value = model.playerNames[player];
      name.addEventListener('change', () => {
        model.playerNames[player] = name.value.trim() || model.playerNames[player];
        name.value = model.playerNames[player];
        showNames();
        onChange();
      });
      form.elements[player].addEventListener('input', (event) => {
        scores[player] = event.target.value;
        error.hidden = true;
      });
    }

    form.addEventListener('change', (event) => {
      if (event.target.name !== 'resting') return;
      model.resting = event.target.value;
      delete scores[model.resting];
      showResting();
      error.hidden = true;
      onChange();
    });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      let round;
      try {
        round = createRound(scores, model.resting);
      } catch (failure) {
        error.textContent = failure.message;
        error.hidden = false;
        return;
      }
      model.rounds.push(round);
      for (const player of PLAYERS) delete scores[player];
      error.hidden = true;
      showResting();
      showResults();
      onChange();
      status.textContent = `已记录第 ${model.rounds.length} 局`;
      form.elements[PLAYERS.find((player) => player !== model.resting)].focus({ preventScroll: true });
    });
    history.addEventListener('click', (event) => {
      const button = event.target.closest('[data-remove-round]');
      if (!button) return;
      const index = Number(button.dataset.removeRound);
      model.rounds.splice(index, 1);
      showResults();
      onChange();
      status.textContent = '已删除该局记录';
      const next = history.querySelector(`[data-remove-round="${Math.min(index, model.rounds.length - 1)}"]`);
      (next || historyHeading).focus({ preventScroll: true });
    });
    clear.addEventListener('click', () => {
      if (!confirm('确定清除全部麻将对局记录？')) return;
      model.rounds.length = 0;
      showResults();
      onChange();
      status.textContent = '已清除全部对局记录';
      historyHeading.focus({ preventScroll: true });
    });

    showResting();
    showResults();
  }

  globalThis.MahjongModule = Object.freeze({ render });
})();
</script>
<script>
  (() => {
    if (!globalThis.Tweak) return;
    const app = document.getElementById('m-app-concept').querySelector('.app');
    const appearance = { radius: 20 };
    const tweak = new Tweak({ container: app, onChange: () => app.style.setProperty('--radius', `${appearance.radius}px`) });
    tweak.addSlider(appearance, 'radius', { label: '卡片圆角', min: 12, max: 32, unit: 'px', reference: '--radius' });
  })();
</script>

<script>
(() => {
  const root = document.getElementById('m-app-concept');
  const app = root.querySelector('.app');
  const shell = root.querySelector('.shell');
  const pageTitle = root.querySelector('.top-title');
  const addButton = root.querySelector('#m-app-add');
  const releaseBack = root.querySelector('.release-back');
  const pages = [...root.querySelectorAll('[data-page]')];
  const mainNavigation = root.querySelector('.bottom-nav');
  const tabs = [...mainNavigation.querySelectorAll('[data-tab]')];
  const widgetSlot = root.querySelector('[data-widget-slot]');
  const recentList = root.querySelector('[data-recent-list]');
  const enabledModuleCount = root.querySelector('[data-enabled-module-count]');
  const overlay = root.querySelector('.overlay');
  const sheet = root.querySelector('.sheet');
  const handle = sheet.querySelector('.handle');
  const closeButton = sheet.querySelector('.close');
  const sheetTitle = sheet.querySelector('.sheet-title');
  const sheetContent = sheet.querySelector('.sheet-content');
  const notice = root.querySelector('.notice');
  const status = root.querySelector('.live-status');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const mahjongCalculator = globalThis.MahjongCalculator;
  const mahjongStorageKey = 'm-app-mahjong-v1';
  const pageLabels = { recent: '最近', modules: '模块', settings: '设置', changelog: '版本内容' };
  const modules = {
    cooking: { label: '烹饪指南', item: '菜谱', icon: 'chef-hat', field: '菜名', note: '食材和做法' },
    people: { label: '人物卡片', item: '人物卡片', icon: 'user-round', field: '姓名', note: '关系和备注' },
    food: { label: '美食记录', item: '美食记录', icon: 'utensils', field: '店名', note: '推荐菜和口味' },
    parking: { label: '停车备忘', icon: 'square-parking' },
    calculator: { label: '计算器', icon: 'calculator' },
    mahjong: { label: '麻将胡结算', icon: 'mahjong' }
  };
  const persistentKinds = ['cooking', 'people', 'food'];
  const state = {
    page: 'recent',
    category: 'permanent',
    module: null,
    moduleScreen: 'content',
    modulePreferences: {},
    moduleView: 'grid',
    enabledModules: Object.keys(modules),
    appearance: 'system',
    widget: 'parking',
    mahjong: loadMahjong(),
    parking: { place: '环贸广场', area: 'B2 · C 区', number: '128', time: '14:32' },
    records: [
      { id: 'recipe-scallion', kind: 'cooking', title: '葱油拌面', summary: '20 分钟 · 家常快手', time: '12:18', detail: '小火炸香葱段。调入生抽、老抽和一小勺糖，浇在沥干的细面上，拌匀。' },
      { id: 'person-lin', kind: 'people', title: '林然', summary: '朋友 · 生日 5 月 18 日', time: '昨天', detail: '朋友。生日 5 月 18 日，喜欢手冲咖啡。' },
      { id: 'food-wutong', kind: 'food', title: '梧桐面馆', summary: '葱油拌面 · 小馄饨', time: '昨天', detail: '葱油拌面有很香的葱味。小馄饨汤底清淡，适合一起点。' }
    ]
  };
  const drafts = new Map();
  const scrollPositions = new Map();
  let nextId = 1;
  let returnFocus;
  let noticeTimer;
  let dragStart;
  let draggedHandle = false;
  let recentlyCompleted;

  const icon = (name) => name === 'mahjong' ? '<span aria-hidden="true">胡</span>' : `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const findRecord = (key) => state.records.find((record) => record.id === key);
  const timeNow = () => new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());

  function loadMahjong() {
    try {
      const saved = localStorage.getItem(mahjongStorageKey) ?? localStorage.getItem('mahjong_state_v4');
      return mahjongCalculator.normalizeState(JSON.parse(saved));
    } catch {
      return mahjongCalculator.normalizeState();
    }
  }

  function persistMahjong() {
    try {
      localStorage.setItem(mahjongStorageKey, JSON.stringify(state.mahjong));
      return true;
    } catch {
      showNotice('麻将数据未能保存到此浏览器');
      return false;
    }
  }

  function updateIcons() {
    globalThis.lucide?.createIcons({ attrs: { width: 18, height: 18 } });
  }

  function syncHeader() {
    const hasModuleTabs = state.page === 'modules';
    const isChangelog = state.page === 'changelog';
    pageTitle.textContent = pageLabels[state.page];
    pageTitle.hidden = hasModuleTabs;
    addButton.hidden = state.page !== 'recent';
    releaseBack.hidden = !isChangelog;
    mainNavigation.hidden = isChangelog;
    moduleTabs.hidden = !hasModuleTabs;
    syncModuleViewPicker();
  }

  function applyAppearance() {
    app.dataset.appearance = state.appearance;
  }

  function setPage(key) {
    const previous = pages.find((page) => page.dataset.page === state.page);
    scrollPositions.set(state.page, previous.scrollTop);
    state.page = key;
    syncHeader();
    for (const page of pages) page.hidden = page.dataset.page !== key;
    const tabKey = key === 'changelog' ? 'settings' : key;
    for (const tab of tabs) {
      if (tab.dataset.tab === tabKey) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    }
    pages.find((page) => page.dataset.page === key).scrollTop = scrollPositions.get(key) || 0;
  }

  function parkingTitle(parking) {
    return [parking.area, parking.number].filter(Boolean).join(' · ') || parking.place;
  }

  function widgetView() {
    if (state.widget === 'none') return null;
    if (state.widget === 'parking') {
      return state.parking
        ? { kind: 'parking', label: '当前停车', title: parkingTitle(state.parking), meta: `${state.parking.place} · ${state.parking.time}`, action: 'record', key: 'parking' }
        : { kind: 'empty', label: '停车记录', title: '记录停车', meta: '保存楼层、区域和车位号', action: 'create', key: 'parking' };
    }
    const record = findRecord(state.widget);
    return { kind: record.kind, label: modules[record.kind].label, title: record.title, meta: record.summary, action: 'record', key: record.id };
  }

  function renderWidget() {
    const item = widgetView();
    if (!item) {
      widgetSlot.innerHTML = `<button class="secondary cursor-interaction" type="button" data-action="widget-settings">${icon('plus')}添加小组件</button>`;
      return;
    }
    widgetSlot.innerHTML = `
      <article class="widget" data-widget-kind="${item.kind}">
        <span class="widget-decoration" aria-hidden="true"></span>
        <button class="widget-body cursor-interaction" type="button" data-action="${item.action}" data-key="${item.key}">
          <span class="widget-label">${icon(item.kind === 'empty' ? 'square-parking' : modules[item.kind].icon)}<span></span></span>
          <span class="widget-title"></span>
          <span class="widget-meta"></span>
        </button>
        <button class="widget-config cursor-interaction" type="button" data-action="widget-settings" aria-label="编辑小组件">${icon('sliders-horizontal')}</button>
      </article>`;
    widgetSlot.querySelector('.widget-label span').textContent = item.label;
    widgetSlot.querySelector('.widget-title').textContent = item.title;
    widgetSlot.querySelector('.widget-meta').textContent = item.meta;
  }

  function recordRow(record) {
    const button = document.createElement('button');
    button.className = 'record cursor-interaction';
    button.type = 'button';
    button.dataset.action = 'record';
    button.dataset.key = record.id;
    button.innerHTML = `
      <span class="record-icon" data-kind="${record.kind}">${icon(modules[record.kind].icon)}</span>
      <span class="record-info"><span class="record-name"></span><span class="record-meta"></span></span>
      <span class="record-time"></span>`;
    button.querySelector('.record-name').textContent = record.title;
    button.querySelector('.record-meta').textContent = `${modules[record.kind].label} · ${record.summary}`;
    button.querySelector('.record-time').textContent = record.time;
    return button;
  }

  function renderRecent() {
    const rows = state.records.map(recordRow);
    if (state.parking && state.widget !== 'parking') {
      rows.unshift(recordRow({ id: 'parking', kind: 'parking', title: parkingTitle(state.parking), summary: state.parking.place, time: state.parking.time }));
    }
    if (rows.length) recentList.replaceChildren(...rows);
    else recentList.innerHTML = '<p class="empty">还没有最近记录</p>';
  }

  function render() {
    renderWidget();
    renderRecent();
    renderModules();
    syncHeader();
    enabledModuleCount.textContent = `${state.enabledModules.length} 个模块`;
    updateIcons();
  }

  function toggleManagedModule(key) {
    const wasEnabled = state.enabledModules.includes(key);
    state.enabledModules = Object.keys(modules).filter((module) => module === key ? !wasEnabled : state.enabledModules.includes(module));
    if (!state.enabledModules.includes(state.module)) state.module = null;
    render();
  }

  function setSheet(label, html, trigger) {
    if (overlay.dataset.open === 'false' && !overlay.hidden) return;
    sheetTitle.textContent = label;
    sheetContent.innerHTML = html;
    sheet.scrollTop = 0;
    if (overlay.hidden) {
      returnFocus = trigger;
      overlay.hidden = false;
      shell.inert = true;
      notice.inert = true;
      overlay.getBoundingClientRect();
      overlay.dataset.open = 'true';
    }
    closeButton.focus({ preventScroll: true });
    updateIcons();
  }

  function focusAfterClose() {
    if (returnFocus?.isConnected) {
      returnFocus.focus({ preventScroll: true });
      return;
    }
    const replacement = [...root.querySelectorAll('[data-action]')].find((button) => !button.closest('[hidden]')
      && button.dataset.action === returnFocus?.dataset.action && button.dataset.key === returnFocus?.dataset.key);
    const widgetButton = returnFocus?.matches('.widget-body') && widgetSlot.querySelector('.widget-body');
    const selectedCategory = state.page === 'modules' && moduleTabs.querySelector('[aria-selected="true"]');
    (replacement || widgetButton || selectedCategory || tabs.find((tab) => tab.dataset.tab === state.page)).focus({ preventScroll: true });
  }

  function closeSheet(afterClose) {
    if (overlay.dataset.open !== 'true') return;
    overlay.dataset.open = 'false';
    sheet.style.removeProperty('--drag');
    const finish = () => {
      overlay.hidden = true;
      shell.inert = false;
      notice.inert = false;
      focusAfterClose();
      afterClose?.();
    };
    if (reducedMotion.matches) finish();
    else setTimeout(finish, 280);
  }

  function showNotice(text, canUndo = false) {
    clearTimeout(noticeTimer);
    notice.innerHTML = `<span></span>${canUndo ? '<button class="notice-action cursor-interaction" type="button" data-action="undo-parking">撤销</button>' : ''}`;
    notice.firstElementChild.textContent = text;
    notice.hidden = false;
    status.textContent = text;
    noticeTimer = setTimeout(() => { notice.hidden = true; }, canUndo ? 5200 : 2300);
  }

  function optionRow({ action, key, name, meta, symbol, selected }) {
    const marker = selected === undefined ? icon('chevron-right') : selected ? icon('check') : '';
    const pressed = selected === undefined ? '' : ` aria-pressed="${selected}"`;
    return `<button class="option cursor-interaction" type="button" data-action="${action}" data-key="${key}"${pressed}>
      ${symbol ? `<span class="record-icon">${icon(symbol)}</span>` : ''}
      <span class="option-text"><span class="option-name">${name}</span>${meta ? `<span class="option-meta">${meta}</span>` : ''}</span>
      <span class="option-marker">${marker}</span>
    </button>`;
  }

  function showWidgetSettings(trigger) {
    const choices = [
      { key: 'parking', name: '当前停车', meta: '显示当前车位，也可快速记录', symbol: 'square-parking' },
      ...state.records.map((record) => ({ key: record.id, name: '', meta: modules[record.kind].label, symbol: modules[record.kind].icon, title: record.title })),
      { key: 'none', name: '隐藏小组件', symbol: 'circle-minus' }
    ];
    const options = choices.map((item) => optionRow({ ...item, action: 'set-widget', selected: state.widget === item.key }));
    setSheet('编辑小组件', `<div class="rows">${options.join('')}</div>`, trigger);
    const labels = sheetContent.querySelectorAll('.option-name');
    choices.forEach((item, index) => { if (item.title) labels[index].textContent = item.title; });
  }

  function showAdd(trigger) {
    const options = ['parking', ...persistentKinds].map((kind) => optionRow({
      action: 'create', key: kind, name: kind === 'parking' ? (state.parking ? '更新车位' : '记录停车') : `新增${modules[kind].item}`, symbol: modules[kind].icon
    }));
    setSheet('新增记录', `<div class="rows">${options.join('')}</div>`, trigger);
  }

  function showCreate(kind, trigger) {
    const parking = kind === 'parking';
    const updatingParking = parking && state.parking;
    const module = modules[kind];
    const fields = parking
      ? '<label class="field">停车地点<input name="place" maxlength="28" required placeholder="例如环贸广场"></label><label class="field">楼层和区域<input name="area" maxlength="18" placeholder="例如 B2 · C 区"></label><label class="field">车位号<input name="number" maxlength="12" placeholder="例如 128"></label>'
      : `<label class="field">${module.field}<input name="title" maxlength="30" required></label><label class="field">${module.note}<textarea name="note" rows="2" maxlength="180"></textarea></label>`;
    const label = updatingParking ? '更新车位' : parking ? '记录停车' : `新增${module.item}`;
    setSheet(label, `<form class="form" data-create="${kind}">
      ${fields}<button class="primary cursor-interaction" type="button" data-action="save">${parking ? '保存车位' : '保存记录'}</button></form>`, trigger);
    const draft = drafts.get(kind) || (updatingParking && Object.entries(updatingParking).filter(([name]) => name !== 'time'));
    const form = sheetContent.querySelector('form');
    if (draft) for (const [name, value] of draft) form.elements.namedItem(name).value = value;
  }

  function showRecord(key, trigger) {
    if (key === 'parking') {
      if (!state.parking) {
        showCreate('parking', trigger);
        return;
      }
      setSheet('当前停车', `<div class="detail">
        <strong class="detail-value"></strong><p></p>
        <button class="primary cursor-interaction" type="button" data-action="complete-parking">已取车</button></div>`, trigger);
      sheetContent.querySelector('strong').textContent = parkingTitle(state.parking);
      sheetContent.querySelector('p').textContent = `今天 ${state.parking.time} · ${state.parking.place}`;
      return;
    }
    const record = findRecord(key);
    setSheet(record.title, '<div class="detail"><p></p></div>', trigger);
    sheetContent.querySelector('p').textContent = record.detail || record.summary;
  }

  function save(form) {
    if (overlay.dataset.open !== 'true') return;
    const required = form.querySelector('input[required]');
    required.value = required.value.trim();
    if (!form.reportValidity()) return;
    const values = new FormData(form);
    const kind = form.dataset.create;
    if (kind === 'parking') {
      recentlyCompleted = undefined;
      state.parking = { place: values.get('place'), area: values.get('area').trim(), number: values.get('number').trim(), time: timeNow() };
    } else {

    const order = moduleViewOptions.indexOf(event.target);
    const isArrowKey = event.key === 'ArrowDown' || event.key === 'ArrowUp';
    if (isArrowKey && event.target === moduleViewTrigger) {

      </section>`;
    });
    setSheet('模块管理', `<p class="settings-meta">选择在各分类内显示的功能入口。移除入口后，原有记录仍会保留。</p>
      <div class="managed-groups">${groups.join('')}</div>`, trigger);
  }

  function renderReleaseCards(notes, currentVersion, prefix) {
    return notes.map(({ version, date, groups }) => {
      const headingId = `${prefix}-${version}`;
      const currentBadge = version === currentVersion ? '<span class="release-current">当前版本</span>' : '';
      const releaseDate = date
        ? `<time class="release-date" datetime="${date}">${date}</time>`
        : '<span class="release-date">日期未记录</span>';
      const revisions = groups.map(([label, items]) => `<section class="release-group">
        <h3>${label}</h3><ul>${items.map((item) => `<li>${item}</li>`).join('')}</ul>
      </section>`);
      return `<article class="release-card" aria-labelledby="${headingId}">
        <header class="release-header">
          <div class="release-heading"><h2 id="${headingId}">v${version}</h2>${currentBadge}</div>
          ${releaseDate}
        </header>
        <div class="release-revisions">${revisions.join('')}</div>
      </article>`;
    }).join('');
  }

  function renderChangelog() {
    root.querySelector('[data-release-list]').innerHTML = renderReleaseCards(releaseNotes, settingsVersion, 'm-app-release');
  }

  function showChangelog() {
    setPage('changelog');
    releaseBack.focus({ preventScroll: true });
  }

  function backFromChangelog() {
    setPage('settings');
    root.querySelector('.settings-row[data-key="changelog"]').focus({ preventScroll: true });
  }

  function showPreferences(trigger) {
    const widgetOption = optionRow({
      action: 'widget-settings', key: 'recent-widget', name: '最近页小组件',
      meta: '选择固定在上方的内容', symbol: 'layout-grid'
    });
    const appearanceOptions = Object.entries(appearanceLabels).map(([key, name]) => optionRow({
      action: 'settings-appearance', key, name, symbol: { system: 'monitor', light: 'sun', dark: 'moon' }[key],
      selected: state.appearance === key
    }));
    setSheet('偏好设置', `<div class="rows">${widgetOption}</div>
      <h3 class="settings-meta">界面外观</h3><div class="rows">${appearanceOptions.join('')}</div>`, trigger);
  }

  function showDataSettings(trigger) {
    pendingBackup = undefined;
    const options = [
      optionRow({ action: 'settings-backup-view', key: 'import', name: '导入数据', meta: '从 JSON 备份恢复记录', symbol: 'upload' }),
      optionRow({ action: 'settings-backup-view', key: 'export', name: '导出数据', meta: '生成可复制的 JSON 备份', symbol: 'download' })
    ];
    setSheet('数据导入／导出', `<div class="rows">${options.join('')}</div>`, trigger);
  }

  function showBackupImport(trigger, source = '') {
    pendingBackup = undefined;
    setSheet('导入数据', `<label class="field">粘贴 M_APP 的 JSON 备份
      <textarea class="data-text" data-backup-input rows="7" maxlength="${backupTextLimit}" spellcheck="false"></textarea></label>
      <p class="settings-meta" data-backup-error role="alert" hidden></p>
      <button class="primary cursor-interaction" type="button" data-action="review-settings-import">检查备份</button>`, trigger);
    sheetContent.querySelector('[data-backup-input]').value = source;
  }

  function showBackupExport(trigger) {
    setSheet('导出数据', `<p class="settings-meta">备份包含长期记录、车位和麻将结算数据。选中后可复制到本地文件。</p>
      <label class="field">JSON 备份<textarea class="data-text" data-backup-output rows="7" readonly spellcheck="false"></textarea></label>
      <button class="primary cursor-interaction" type="button" data-action="select-settings-backup">选中全部 JSON</button>`, trigger);
    sheetContent.querySelector('[data-backup-output]').value = JSON.stringify({
      format: backupFormat,
      schema: 1,
      records: state.records,
      parking: state.parking,
      mahjong: state.mahjong
    }, null, 2);
  }

  function backupString(value, field, maxLength, required = false) {
    if (typeof value !== 'string' || value.length > maxLength || (required && !value.trim())) {
      throw new Error(`备份中的${field}格式不正确。`);
    }
    return value;
  }

  function parseSettingsBackup(source) {
    if (!source.trim()) throw new Error('请先粘贴 JSON 备份。');
    if (source.length > backupTextLimit) throw new Error('这份备份超出预览可导入的大小。');
    let json;
    try {
      json = JSON.parse(source);
    } catch {
      throw new Error('没有读到有效的 JSON，请检查备份是否完整。');
    }
    if (json?.format !== backupFormat || json.schema !== 1 || !Array.isArray(json.records)) {
      throw new Error('请选择由这个预览导出的 M_APP 备份。');
    }
    if (json.records.length > 500) throw new Error('这个预览一次可导入最多 500 条记录。');
    const recordIds = new Set();
    const records = json.records.map((record) => {
      if (!record || !persistentKinds.includes(record.kind) || typeof record.id !== 'string'
        || !backupIdPattern.test(record.id) || ['parking', 'none'].includes(record.id) || recordIds.has(record.id)) {
        throw new Error('备份中的记录类型或编号无效。');
      }
      recordIds.add(record.id);
      return {
        id: record.id,
        kind: record.kind,
        title: backupString(record.title, '标题', 30, true),
        summary: backupString(record.summary, '摘要', 180),
        time: backupString(record.time, '时间', 32, true),
        detail: backupString(record.detail, '内容', 180)
      };
    });
    let parking = null;
    if (json.parking !== null) {
      if (!json.parking || typeof json.parking !== 'object' || Array.isArray(json.parking)) {
        throw new Error('备份中的停车记录格式不正确。');
      }
      parking = {
        place: backupString(json.parking.place, '停车地点', 28, true),
        area: backupString(json.parking.area, '楼层和区域', 18),
        number: backupString(json.parking.number, '车位号', 12),
        time: backupString(json.parking.time, '停车时间', 32, true)
      };
    }
    const mahjong = Object.hasOwn(json, 'mahjong')
      ? mahjongCalculator.normalizeState(json.mahjong, { strict: true })
      : undefined;
    return { records, parking, mahjong, recordIds, source };
  }

  function reviewSettingsImport(trigger) {
    const source = sheetContent.querySelector('[data-backup-input]').value;
    try {
      pendingBackup = parseSettingsBackup(source);
    } catch (error) {
      const message = sheetContent.querySelector('[data-backup-error]');
      message.hidden = false;
      message.textContent = error.message;
      return;
    }
    const { records, parking, mahjong } = pendingBackup;
    setSheet('确认导入', `<div class="detail settings-detail">
      <strong>${records.length} 条长期记录 · ${parking ? '1 条车位记录' : '无车位记录'}${mahjong ? ` · ${mahjong.rounds.length} 局麻将` : ''}</strong>
      <p>确认后，备份将替换当前预览中的记录和车位${mahjong ? '，以及麻将结算数据' : ''}。</p></div>
      <button class="primary cursor-interaction" type="button" data-action="apply-settings-import">确认导入</button>
      <button class="secondary cursor-interaction" type="button" data-action="edit-settings-import">返回修改</button>`, trigger);
  }

  function applySettingsImport() {
    if (!pendingBackup) return;
    const { records, parking, mahjong, recordIds } = pendingBackup;
    pendingBackup = undefined;
    state.records = records;
    state.parking = parking;
    if (!['parking', 'none'].includes(state.widget) && !recordIds.has(state.widget)) state.widget = 'parking';
    recentlyCompleted = undefined;
    drafts.clear();
    notice.hidden = true;
    if (mahjong) state.mahjong = mahjong;
    const saved = !mahjong || persistMahjong();
    render();
    closeSheet(saved ? () => showNotice('已导入数据') : undefined);
  }

  function showSettingsItem(key, trigger) {
    switch (key) {
      case 'account':
        setSheet('我的账号', `<div class="detail settings-detail">
          <h3>M_APP 预览用户</h3><p>本地示例账号</p></div>`, trigger);
        break;
      case 'modules':
        showManagedModules(trigger);
        break;
      case 'preferences':
        showPreferences(trigger);
        break;
      case 'data':
        showDataSettings(trigger);
        break;
      case 'about':
        setSheet('关于我们', `<div class="detail settings-detail">
          <h3>M_APP</h3><p>在一处整理菜谱、人物、美食和临时停车记录。</p><p>当前原型版本 v${settingsVersion}</p></div>`, trigger);
        break;
      case 'changelog':
        showChangelog();
        break;
    }
  }

  const settingsActions = {
    'settings-item': showSettingsItem,
    'back-from-changelog': backFromChangelog,
    'toggle-managed-module': (key, button) => {
      const scrollTop = sheet.scrollTop;
      toggleManagedModule(key);
      showManagedModules(button);
      sheet.scrollTop = scrollTop;
      sheetContent.querySelector(`[data-key="${key}"]`).focus({ preventScroll: true });
    },
    'settings-appearance': (key, button) => {
      state.appearance = key;
      applyAppearance();
      showPreferences(button);
      sheetContent.querySelector(`[data-key="${key}"]`).focus({ preventScroll: true });
    },
    'settings-backup-view': (key, button) => {
      if (key === 'import') showBackupImport(button);
      else showBackupExport(button);
    },
    'select-settings-backup': () => {
      const output = sheetContent.querySelector('[data-backup-output]');
      output.focus();
      output.select();
    },
    'review-settings-import': (_, button) => reviewSettingsImport(button),
    'edit-settings-import': (_, button) => showBackupImport(button, pendingBackup?.source),
    'apply-settings-import': applySettingsImport
  };

  const actions = {
    ...moduleActions,
    ...settingsActions,
    'widget-settings': (_, button) => showWidgetSettings(button),
    'set-widget': (key) => {
      state.widget = key;
      render();
      closeSheet(() => showNotice(key === 'none' ? '小组件已隐藏' : '小组件已更新'));
    },
    add: (_, button) => showAdd(button),
    create: showCreate,
    record: showRecord,
    save: (_, button) => save(button.closest('[data-create]')),
    'complete-parking': () => {
      if (!state.parking) return;
      recentlyCompleted = state.parking;
      state.parking = null;
      drafts.delete('parking');
      render();
      if (overlay.dataset.open === 'true') closeSheet(() => showNotice('停车记录已结束', true));
      else {
        root.querySelector('[data-module-pane] [data-action="create"][data-key="parking"]')?.focus({ preventScroll: true });
        showNotice('停车记录已结束', true);
      }
    },
    'undo-parking': () => {
      if (state.parking || !recentlyCompleted) return;
      state.parking = recentlyCompleted;
      recentlyCompleted = undefined;
      render();
      const pageControl = state.page === 'changelog' ? releaseBack : tabs.find((tab) => tab.dataset.tab === state.page);
      pageControl.focus({ preventScroll: true });
      showNotice('停车记录已恢复');
    }
  };

  root.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (button?.dataset.tab) setPage(button.dataset.tab);
    if (button === handle && draggedHandle && event.detail !== 0) return;
    if (button?.hasAttribute('data-close-sheet') || event.target === overlay) closeSheet();
    if (button?.dataset.action) actions[button.dataset.action]?.(button.dataset.key, button);
  });

  root.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape' || !overlay.hidden || event.defaultPrevented) return;
    if (state.page === 'changelog') {
      event.preventDefault();
      backFromChangelog();
    } else if (state.page === 'modules' && state.module && state.moduleScreen !== 'content') {
      event.preventDefault();
      backInModule();
    }
  });

  root.addEventListener('input', (event) => {
    const form = event.target.closest('form');
    if (!form) return;
    if (form.dataset.create) drafts.set(form.dataset.create, new FormData(form));
    if (form.hasAttribute('data-calculator')) updateCalculatorResult(form);
  });
  root.addEventListener('submit', (event) => event.preventDefault());

  overlay.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      event.preventDefault();
      closeSheet();
    }
    if (event.key === 'Enter' && event.target.tagName === 'INPUT' && !event.isComposing) {
      const form = event.target.closest('[data-create]');
      if (form) {
        event.preventDefault();
        save(form);
      }
    }
    if (event.key !== 'Tab') return;
    const controls = [...sheet.querySelectorAll('button, input, textarea')].filter((element) => element.getClientRects().length);
    const first = controls[0];
    const last = controls[controls.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  handle.addEventListener('pointerdown', (event) => {
    if (!event.isPrimary || event.button !== 0) return;
    draggedHandle = false;
    dragStart = event.clientY;
    sheet.dataset.dragging = 'true';
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', (event) => {
    if (dragStart === undefined || !event.isPrimary) return;
    const distance = event.clientY - dragStart;
    if (Math.abs(distance) > 6) draggedHandle = true;
    if (!reducedMotion.matches) sheet.style.setProperty('--drag', `${Math.max(0, distance)}px`);
  });
  function finishDrag(event) {
    if (dragStart === undefined || !event.isPrimary) return;
    const distance = event.clientY - dragStart;
    dragStart = undefined;
    sheet.dataset.dragging = 'false';
    if (event.type === 'pointerup' && distance > 54) closeSheet();
    else sheet.style.removeProperty('--drag');
  }
  handle.addEventListener('pointerup', finishDrag);
  handle.addEventListener('pointercancel', finishDrag);

  setPage(state.page);
  applyAppearance();
  root.querySelector('[data-app-version]').textContent = `v${settingsVersion}`;
  renderChangelog();
  render();
})();
</script>
</body>
</html>
