<script>
(() => {
  'use strict';

  const PLAYERS = Object.freeze(['a', 'b', 'c', 'd']);
  const DEFAULT_NAMES = Object.freeze({ a: '甲', b: '乙', c: '丙', d: '丁' });
  const DEFAULT_RATE = 0.05;
  const DEFAULT_RESTING = 'd';
  const NAME_LIMIT = 6;

  function readNumber(value) {
    if (typeof value === 'number') return value;
    return typeof value === 'string' && value.trim() ? Number(value) : NaN;
  }

  function readRateCents(decimal) {
    const parts = /^(\d*)(?:\.(\d{0,2})0*)?$/.exec(decimal);
    if (!parts) return null;
    const [, yuan, fraction = ''] = parts;
    return BigInt(yuan || '0') * 100n + BigInt(fraction.padEnd(2, '0'));
  }

  function parseRate(value) {
    const rate = readNumber(value);
    if (!(rate > 0 && rate <= Number.MAX_SAFE_INTEGER / 100)) return null;
    const cents = readRateCents(String(rate));
    if (typeof value === 'string' && cents !== readRateCents(value.trim())) return null;
    return cents === null ? null : rate;
  }

  function readRound(hu, resting) {
    if (!PLAYERS.includes(resting)) return null;
    const round = { resting };
    for (const player of PLAYERS) {
      const count = player === resting ? 0 : readNumber(hu?.[player]);
      if (!Number.isSafeInteger(count)) return null;
      round[player] = count;
    }
    return round;
  }

  function createRound(hu, resting) {
    const round = readRound(hu, resting);
    if (!round) throw new Error('请为上场的三位玩家填写整数胡数。');
    return round;
  }

  function normalizeState(value, { strict = false } = {}) {
    const resting = value?.resting;
    const colorMode = value?.colorMode;
    const rate = parseRate(value?.rate);
    const playerNames = {};
    for (const player of PLAYERS) {
      const name = value?.playerNames?.[player];
      const trimmed = typeof name === 'string' ? name.trim() : '';
      if (strict && (!trimmed || trimmed.length > NAME_LIMIT)) {
        throw new Error('备份中的麻将玩家名称格式不正确。');
      }
      const shortened = trimmed.slice(0, NAME_LIMIT).replace(/[\uD800-\uDBFF]$/, '').trimEnd();
      playerNames[player] = shortened || DEFAULT_NAMES[player];
    }

    if (strict && (!PLAYERS.includes(resting) || !['default', 'chinese'].includes(colorMode)
      || rate === null || typeof value.rate !== 'number' || !Array.isArray(value.rounds))) {
      throw new Error('备份中的麻将结算设置格式不正确。');
    }

    const rounds = [];
    for (const source of Array.isArray(value?.rounds) ? value.rounds : []) {
      // Legacy records with three players omit the fourth player's score and rest status.
      const round = readRound(source, strict ? source?.resting : source?.resting ?? DEFAULT_RESTING);
      if (strict && (!round || PLAYERS.some(player => source[player] !== round[player]))) {
        throw new Error(`备份中的麻将第 ${rounds.length + 1} 局记录格式不正确。`);
      }
      if (round) rounds.push(round);
    }

    return {
      rounds,
      resting: PLAYERS.includes(resting) ? resting : DEFAULT_RESTING,
      playerNames,
      colorMode: colorMode === 'chinese' ? 'chinese' : 'default',
      rate: rate ?? DEFAULT_RATE
    };
  }

  function zeroAmounts() {
    return { a: 0n, b: 0n, c: 0n, d: 0n };
  }

  function toRateCents(rate) {
    const validRate = parseRate(rate);
    if (validRate === null) throw new Error('每胡金额须为大于 0 的金额，最多保留两位小数。');
    return readRateCents(String(validRate));
  }

  function settleInCents(round, rateCents) {
    const amounts = zeroAmounts();
    const active = PLAYERS.filter(player => player !== round.resting);
    for (const [index, left] of active.entries()) {
      for (const right of active.slice(index + 1)) {
        const difference = (BigInt(round[left]) - BigInt(round[right])) * rateCents;
        amounts[left] += difference;
        amounts[right] -= difference;
      }
    }
    return amounts;
  }

  function settleRound(round, rate) {
    return settleInCents(round, toRateCents(rate));
  }

  function summarize(rounds, rate) {
    const rateCents = toRateCents(rate);
    const totals = zeroAmounts();
    const results = rounds.map(round => {
      const amounts = settleInCents(round, rateCents);
      for (const player of PLAYERS) totals[player] += amounts[player];
      return amounts;
    });
    return { results, totals };
  }

  function formatMoney(cents) {
    const absolute = cents < 0n ? -cents : cents;
    const sign = cents < 0n ? '-' : cents > 0n ? '+' : '';
    return `${sign}${absolute / 100n}.${String(absolute % 100n).padStart(2, '0')}`;
  }

  globalThis.MahjongCalculator = Object.freeze({
    PLAYERS, DEFAULT_NAMES, DEFAULT_RATE, parseRate, normalizeState,
    createRound, settleRound, summarize, formatMoney
  });
})();
</script>
<script>
(() => {
  'use strict';

  const { PLAYERS, DEFAULT_NAMES, createRound, summarize, formatMoney } = globalThis.MahjongCalculator;
  const drafts = new WeakMap();

  function amount(cents) {
    const outcome = cents > 0n ? 'win' : cents < 0n ? 'loss' : 'even';
    return `<span class="mahjong-money" data-outcome="${outcome}">${formatMoney(cents)}</span>`;
  }

  function playerResults(totals, round) {
    return `<dl class="mahjong-results">${PLAYERS.map((player) => `
      <div class="mahjong-result">
        <dt data-player-name="${player}"></dt>
        <dd>${round?.resting === player ? '<span class="mahjong-muted">轮休</span>' : amount(totals[player])}</dd>
      </div>`).join('')}</dl>`;
  }

  function render(pane, model, onChange) {
    const scores = drafts.get(model) ?? {};
    drafts.set(model, scores);

    pane.innerHTML = `<div class="mahjong-view" data-mahjong-module data-color-mode="${model.colorMode}">
      <section class="module-feature">
        <p class="feature-meta">每胡 ¥${model.rate.toFixed(2)} · 每局一人轮休</p>
        <fieldset class="mahjong-fieldset">
          <legend>玩家名称</legend>
          <div class="mahjong-grid">
            ${PLAYERS.map((player) => `<label class="field">${DEFAULT_NAMES[player]}<input type="text" name="name-${player}" aria-label="玩家${DEFAULT_NAMES[player]}名称" maxlength="6"></label>`).join('')}
          </div>
        </fieldset>
        <form class="form" data-mahjong-round>
          <fieldset class="mahjong-fieldset">
            <legend>本局轮休</legend>
            <div class="mahjong-rest">
              ${PLAYERS.map((player) => `<label>
                <input type="radio" name="resting" value="${player}">
                <span data-player-name="${player}"></span>
              </label>`).join('')}
            </div>
          </fieldset>
          <fieldset class="mahjong-fieldset">
            <legend>本局胡数</legend>
            <div class="mahjong-grid">
              ${PLAYERS.map((player) => `<label class="field">
                <span><span data-player-name="${player}"></span><span data-score-rest="${player}"></span></span>
                <input name="${player}" type="number" step="1" inputmode="numeric" required placeholder="0">
              </label>`).join('')}
            </div>
          </fieldset>
          <p class="mahjong-error" role="alert" hidden></p>
          <button class="primary cursor-interaction" type="submit">记录本局</button>
        </form>
      </section>
      <div data-mahjong-summary></div>
      <section class="module-feature mahjong-history" aria-labelledby="m-app-mahjong-history">
        <div class="mahjong-section-header">
          <h3 id="m-app-mahjong-history" tabindex="-1">历史记录</h3>
          <button class="cursor-interaction mahjong-delete" type="button" data-mahjong-clear hidden>全部清除</button>
        </div>
        <div class="mahjong-history-list"></div>
      </section>
      <p class="live-status" data-mahjong-status role="status"></p>
    </div>`;

    const view = pane.querySelector('[data-mahjong-module]');
    const form = view.querySelector('[data-mahjong-round]');
    const error = form.querySelector('[role="alert"]');
    const summary = view.querySelector('[data-mahjong-summary]');
    const history = view.querySelector('.mahjong-history-list');
    const historyHeading = view.querySelector('#m-app-mahjong-history');
    const clear = view.querySelector('[data-mahjong-clear]');
    const status = view.querySelector('[data-mahjong-status]');
    let latestSave = Promise.resolve();
    const submit = form.querySelector('[type="submit"]');

    function save(changes) {
      const pending = latestSave.then(() => onChange({ ...model, ...changes() }));
      latestSave = pending.catch(() => false);
      return pending;
    }

    function showNames() {
      for (const element of view.querySelectorAll('[data-player-name]')) {
        element.textContent = model.playerNames[element.dataset.playerName];
      }
    }

    function showResting() {
      form.elements.resting.value = model.resting;
      for (const player of PLAYERS) {
        const resting = player === model.resting;
        const input = form.elements[player];
        input.disabled = resting;
        input.placeholder = resting ? '轮休' : '0';
        input.value = resting ? '' : scores[player] ?? '';
        view.querySelector(`[data-score-rest="${player}"]`).textContent = resting ? '（轮休）' : '';
      }
    }

    function showResults() {
      const { rounds, rate } = model;
      const { results, totals } = summarize(rounds, rate);
      const latest = rounds.at(-1);
      summary.innerHTML = latest ? `<section class="module-feature mahjong-summary">
        <div><h3>本局结果</h3>${playerResults(results.at(-1), latest)}</div>
        <div><h3>累计输赢 <span class="mahjong-muted">共 ${rounds.length} 局</span></h3>${playerResults(totals)}</div>
      </section>` : '';
      summary.hidden = !latest;
      clear.hidden = !latest;
      history.innerHTML = latest ? rounds.map((round, index) => `<article class="mahjong-history-round">
        <div class="mahjong-section-header">
          <h4>第 ${index + 1} 局</h4>
          <button class="cursor-interaction mahjong-delete" type="button" data-remove-round="${index}" aria-label="删除第 ${index + 1} 局">删除</button>
        </div>
        <dl class="mahjong-results">${PLAYERS.map((player) => `<div class="mahjong-result">
          <dt data-player-name="${player}"></dt>
          <dd class="mahjong-muted">${player === round.resting ? '轮休' : `${round[player]} 胡`}</dd>
          ${player === round.resting ? '' : `<dd>${amount(results[index][player])}</dd>`}
        </div>`).join('')}</dl>
      </article>`).join('') : '<p class="mahjong-muted">暂无对局记录</p>';
      showNames();
    }

    for (const player of PLAYERS) {
      const name = view.querySelector(`[name="name-${player}"]`);
      name.value = model.playerNames[player];
      name.addEventListener('change', async () => {
        const value = name.value.trim() || model.playerNames[player];
        if (value !== model.playerNames[player]) await save(() => ({ playerNames: { ...model.playerNames, [player]: value } }));
        name.value = model.playerNames[player];
        showNames();
      });
      form.elements[player].addEventListener('input', (event) => {
        scores[player] = event.target.value;
        error.hidden = true;
      });
    }

    form.addEventListener('change', async (event) => {
      if (event.target.name !== 'resting') return;
      const resting = event.target.value;
      if (await save(() => ({ resting }))) delete scores[model.resting];
      showResting();
      error.hidden = true;
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (submit.disabled) return;
      submit.disabled = true;
      let saved;
      try {
        const input = { ...scores };
        saved = await save(() => ({ rounds: [...model.rounds, createRound(input, model.resting)] }));
      } catch (failure) {
        error.textContent = failure.message;
        error.hidden = false;
        return;
      } finally {
        submit.disabled = false;
      }
      if (!saved) return;
      for (const player of PLAYERS) delete scores[player];
      error.hidden = true;
      showResting();
      showResults();
      status.textContent = `已记录第 ${model.rounds.length} 局`;
      form.elements[PLAYERS.find((player) => player !== model.resting)].focus({ preventScroll: true });
    });
    history.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-remove-round]');
      if (!button) return;
      const round = model.rounds[Number(button.dataset.removeRound)];
      if (!await save(() => ({ rounds: model.rounds.filter((entry) => entry !== round) }))) return;
      showResults();
      status.textContent = '已删除该局记录';
      const next = history.querySelector(`[data-remove-round="${Math.min(Number(button.dataset.removeRound), model.rounds.length - 1)}"]`);
      (next || historyHeading).focus({ preventScroll: true });
    });
    clear.addEventListener('click', async () => {
      if (!confirm('确定清除全部麻将对局记录？')) return;
      if (!await save(() => ({ rounds: [] }))) return;
      showResults();
      status.textContent = '已清除全部对局记录';
      historyHeading.focus({ preventScroll: true });
    });

    showResting();
    showResults();
  }

  globalThis.MahjongModule = Object.freeze({ render });
})();
</script>
<script>
(() => {
  const MIN_SERVINGS = 1;
  const MAX_SERVINGS = 99;
  const MAX_ROWS = 100;
  const DEMO_IMAGE = 'demo:scallion-noodles';
  const DEMO_RECIPE = {
    servings: 2,
    coverImage: DEMO_IMAGE,
    ingredients: [
      { name: '细面条', quantity: '200', unit: '克' },
      { name: '小葱', quantity: '60', unit: '克' },
      { name: '食用油', quantity: '3', unit: '汤匙' },
      { name: '生抽', quantity: '2', unit: '汤匙' },
      { name: '老抽', quantity: '1/2', unit: '汤匙' },
      { name: '白糖', quantity: '1', unit: '茶匙' },
      { name: '煮面用水', quantity: '适量', unit: '' },
    ],
    steps: [
      { heat: '无需加热', text: '小葱洗净擦干，切成约 5 厘米的长段，葱白和葱绿分开。把生抽、老抽和白糖调匀。', image: '' },
      { heat: '小火', text: '锅里倒入油，先放葱白慢炸。葱白边缘变黄时加入葱绿，继续炸到葱段干脆、呈深金黄色，捞出葱段。', image: '' },
      { heat: '关火，利用余温', text: '关火后让葱油稍微降温，再倒入调好的料汁，搅拌到白糖溶解。', image: '' },
      { heat: '大火煮沸', text: '另起一锅水，大火烧开后下面，按包装时间煮到喜欢的软硬程度。捞出沥干。', image: '' },
      { heat: '无需加热', text: '把面条趁热拌入葱油酱汁，先加一半，尝过再补。最后放上炸好的葱段。', image: DEMO_IMAGE },
    ],
    tips: '小葱擦干再下锅更不容易溅油。小火慢炸，葱段变成深金黄色即可捞出。'
  };

  function normalizeRecipe(value, { strict = false } = {}) {
    function invalid(label) {
      if (strict) throw new Error('菜谱中的' + label + '格式不正确。');
    }

    function object(value, label) {
      if (value && typeof value === 'object' && !Array.isArray(value)) return value;
      invalid(label);
      return {};
    }

    function text(value, label, limit, required = false) {
      if (value === undefined && !required) return '';
      if (typeof value === 'string' && value.length <= limit && (!required || value.trim())) return value.trim();
      invalid(label);
      return '';
    }

    function list(value, label) {
      if (Array.isArray(value) && value.length <= MAX_ROWS) return value;
      invalid(label);
      return [];
    }

    function image(value, label) {
      const url = text(value, label, 2048);
      if (!url || url === DEMO_IMAGE) return url;
      try {
        const parsed = new URL(url);
        if (parsed.protocol === 'https:' && !parsed.username && !parsed.password) return url;
      } catch {
        // Invalid URLs are rejected below.
      }
      if (strict) throw new Error(label + '需要使用有效的 HTTPS 链接。');
      return '';
    }

    const recipe = object(value, '菜谱');
    const validServings = Number.isInteger(recipe.servings) && recipe.servings >= MIN_SERVINGS && recipe.servings <= MAX_SERVINGS;
    if (!validServings) invalid('原始份数');
    const ingredients = list(recipe.ingredients, '用料清单').map((value) => {
      const item = object(value, '用料');
      return {
        name: text(item.name, '食材', 60, true),
        quantity: text(item.quantity, '用量', 40),
        unit: text(item.unit, '单位', 20),
      };
    }).filter((item) => item.name);
    const steps = list(recipe.steps, '步骤清单').map((value) => {
      const step = object(value, '步骤');
      return {
        heat: text(step.heat, '火候', 60, true),
        text: text(step.text, '做法', 2000, true),
        image: image(step.image, '步骤图片'),
      };
    }).filter((step) => step.text);
    if (!steps.length) invalid('步骤清单');
    return {
      servings: validServings ? recipe.servings : 2,
      ingredients, steps,
      tips: text(recipe.tips, '小贴士', 2000),
      coverImage: image(recipe.coverImage, '成品图片'),
    };
  }

  function readRecipe(record) {
    if (record.recipe) return normalizeRecipe(record.recipe);
    return {
      servings: 2,
      ingredients: [],
      steps: record.detail?.trim() ? [{ text: record.detail, heat: '', image: '' }] : [],
      tips: '',
      coverImage: '',
    };
  }

  function normalizeDuration(value) {
    if (value === null || (Number.isSafeInteger(value) && value >= 0)) return value;
    throw new Error('烹饪时间请输入有效的整数分钟。');
  }

  function readRecipeMeta(record) {
    const summary = record.summary ?? '';
    if (Object.hasOwn(record, 'durationMinutes')) return { durationMinutes: record.durationMinutes, summary };
    const legacy = /^\s*([0-9]+)\s*分钟(?:\s*[·丨｜|]\s*(.*?))?\s*$/s.exec(summary);
    const minutes = Number(legacy?.[1]);
    if (Number.isSafeInteger(minutes)) return { durationMinutes: minutes, summary: legacy[2] ?? '' };
    return { durationMinutes: null, summary };
  }

  function formatRecipeMeta(record) {
    const { durationMinutes, summary } = readRecipeMeta(record);
    return [durationMinutes === null ? '' : `${durationMinutes}分钟`, summary].filter(Boolean).join(' 丨 ');
  }

  function parseQuantity(value) {
    const fraction = /^(?:(\d+)\s+)?(\d+)\s*\/\s*(\d+)$/.exec(value);
    if (fraction && Number(fraction[3])) return Number(fraction[1] || 0) + Number(fraction[2]) / Number(fraction[3]);
    if (/^(?:\d+(?:\.\d+)?|\.\d+)$/.test(value)) return Number(value);
    return NaN;
  }

  const quantityFormat = new Intl.NumberFormat('zh-CN', { maximumSignificantDigits: 5, useGrouping: false });

  function formatIngredientAmount({ quantity, unit }, servings, baseServings) {
    const parts = quantity.normalize('NFKC').split(/\s*[-–—~至]\s*/);
    const amounts = parts.map(parseQuantity);
    const scaled = parts.length <= 2 && amounts.every(Number.isFinite) && servings !== baseServings
      ? amounts.map((amount) => quantityFormat.format(amount * servings / baseServings)).join('–')
      : quantity;
    return [scaled, unit].filter(Boolean).join(' ') || '—';
  }

  globalThis.CookingGuide = { MIN_SERVINGS, MAX_SERVINGS, MAX_ROWS, DEMO_RECIPE, normalizeRecipe, readRecipe,
    normalizeDuration, readRecipeMeta, formatRecipeMeta, formatIngredientAmount };
})();
</script>
<script>
(() => {
  const storeName = 'recipes';

  function createStore(initialRecords) {
    const ready = new Promise((resolve, reject) => {
      if (!globalThis.indexedDB) {
        reject(new Error('当前环境无法打开菜谱存储，请使用支持浏览器存储的页面。'));
        return;
      }
      const request = indexedDB.open('m-app-cooking', 1);
      request.onupgradeneeded = () => {
        const store = request.result.createObjectStore(storeName, { keyPath: 'record.id' });
        initialRecords.forEach((record, index) => store.put({ record, order: initialRecords.length - index }));
      };
      request.onsuccess = () => {
        const db = request.result;
        db.onversionchange = () => db.close();
        resolve(db);
      };
      request.onerror = () => reject(new Error('浏览器未能打开菜谱存储，请检查存储设置。'));
    });

    async function run(mode, apply) {
      const db = await ready;
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(storeName, mode);
        const store = transaction.objectStore(storeName);
        let result;
        let failure;
        transaction.oncomplete = () => resolve(result);
        transaction.onabort = () => reject(failure ?? new Error('浏览器未能完成菜谱读写，请检查存储设置或可用空间。'));
        const request = store.getAll();
        request.onsuccess = () => {
          try {
            const rows = request.result.sort((left, right) => right.order - left.order);
            result = apply(store, rows);
          } catch (error) {
            failure = error;
            transaction.abort();
          }
        };
      });
    }

    function read() {
      return run('readonly', (_, rows) => rows.map(({ record }) => record));
    }

    function save(record, previous) {
      return run('readwrite', (store, rows) => {
        if (!previous) {
          store.add({ record, order: (rows[0]?.order ?? 0) + 1 });
          return [record, ...rows.map((row) => row.record)];
        }

        const index = rows.findIndex((row) => row.record.id === previous.id);
        if (index < 0 || JSON.stringify(rows[index].record) !== JSON.stringify(previous)) {
          throw new Error('这份菜谱已在另一个页面被修改或移除。请保留当前编辑内容，重新打开菜谱后再保存。');
        }
        rows[index] = { record, order: rows[index].order };
        store.put(rows[index]);
        return rows.map((row) => row.record);
      });
    }

    function remove(previous) {
      return run('readwrite', (store, rows) => {
        const index = rows.findIndex((row) => row.record.id === previous?.id);
        if (index < 0 || JSON.stringify(rows[index].record) !== JSON.stringify(previous)) {
          throw new Error('这份菜谱已在另一个页面被修改或移除。请重新打开菜谱后再删除。');
        }
        store.delete(previous.id);
        rows.splice(index, 1);
        return rows.map((row) => row.record);
      });
    }

    function replace(records, expectedRecords) {
      return run('readwrite', (store, rows) => {
        if (JSON.stringify(rows.map(({ record }) => record)) !== JSON.stringify(expectedRecords)) {
          throw new Error('其他页面更新了菜谱。请重新检查备份后再确认导入。');
        }
        store.clear();
        records.forEach((record, index) => store.add({ record, order: records.length - index }));
      });
    }

    return { read, save, remove, replace };
  }

  globalThis.CookingStore = { createStore };
})();
</script>
