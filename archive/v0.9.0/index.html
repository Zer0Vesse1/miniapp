(() => {
  const { MIN_SERVINGS, MAX_SERVINGS, MAX_ROWS, readRecipe, normalizeRecipe, normalizeDuration,
    readRecipeMeta, formatRecipeMeta, formatIngredientAmount } = globalThis.CookingGuide;
  const demoCover = document.currentScript.dataset.demoCover;
  const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (character) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
  const recipeImage = (source, className, alt = '') => {
    if (!source) return '';
    const url = source === 'demo:scallion-noodles' ? demoCover : source;
    return `<img class="${className}" src="${escapeHtml(url)}" alt="${escapeHtml(alt)}" decoding="async" referrerpolicy="no-referrer">`;
  };

  function renderList(pane, entries, icon) {
    const cards = entries.map((record) => {
      const recipe = readRecipe(record);
      const meta = [formatRecipeMeta(record), `${recipe.steps.length} 个步骤`].filter(Boolean).join(' · ');
      const thumbnail = recipeImage(recipe.coverImage, 'module-record-image') || escapeHtml(Array.from(record.title.trim())[0] ?? '·');
      return `<button class="module-record-card cursor-interaction" type="button" data-action="record" data-key="${escapeHtml(record.id)}">
        <span class="module-record-thumbnail" aria-hidden="true">${thumbnail}</span>
        <span class="record-info"><span class="record-name">${escapeHtml(record.title)}</span><span class="record-meta">${escapeHtml(meta)}</span></span>
        <span class="module-record-end" aria-hidden="true">${icon('chevron-right')}</span>
      </button>`;
    }).join('');
    pane.innerHTML = cards ? `<div class="module-record-list">${cards}</div>` : '<p class="module-record-empty">还没有菜谱</p>';
  }

  function createWindow(windowElement, shell, saveRecord, fallbackFocus, recordActions, deleteRecord, saveExperiences) {
    const experienceView = globalThis.RecordExperienceView;
    let session;
    let screen;
    let draft;
    let overlayTrigger;
    let saving = false;
    let experiences;

    const button = (action, label, className = '', attributes = '') =>
      `<button class="cooking-button ${className} cursor-interaction" type="button" data-cooking-action="${action}" ${attributes}>${label}</button>`;
    const backButton = (label) =>
      `<button class="page-back cursor-interaction" type="button" data-cooking-action="back" aria-label="${label}"></button>`;
    const scroll = () => windowElement.querySelector('.cooking-scroll');

    function renderIngredients() {
      const { ingredients, servings } = session.recipe;
      if (!ingredients.length) return '<p class="cooking-empty">还没有用料记录</p>';
      const rows = ingredients.map((ingredient, index) => `<li class="cooking-ingredient">
        <span>${escapeHtml(ingredient.name)}</span>
        <span data-cooking-amount="${index}">${escapeHtml(formatIngredientAmount(ingredient, session.servings, servings))}</span>
      </li>`).join('');
      return `<div class="cooking-servings" aria-label="调整份数">
        ${button('less', '−', '', 'aria-label="减少份数"')}
        <output data-cooking-servings aria-live="polite">${session.servings} 人份</output>
        ${button('more', '+', '', 'aria-label="增加份数"')}
      </div><ul class="cooking-ingredients">${rows}</ul>`;
    }

    function renderSteps(withTotal = false) {
      const { steps } = session.recipe;
      if (!steps.length) return '<p class="cooking-empty">还没有步骤记录</p>';
      return `<ol class="cooking-steps">${steps.map((step, index) => `<li class="cooking-step">
        <div class="cooking-step-number">步骤 ${index + 1}${withTotal ? `<span> / ${steps.length}</span>` : ''}</div>
        <p class="cooking-heat">${step.heat ? `火候 · ${escapeHtml(step.heat)}` : '火候 · 未记录'}</p>
        ${recipeImage(step.image, 'cooking-step-image', `步骤 ${index + 1} 配图`)}
        <p class="cooking-step-copy">${escapeHtml(step.text)}</p>
      </li>`).join('')}</ol>`;
    }

    function renderTips() {
      return session.recipe.tips ? `<p class="cooking-tips">${escapeHtml(session.recipe.tips)}</p>`
        : '<p class="cooking-empty">还没有小贴士</p>';
    }

    function detailView() {
      const { record, recipe } = session;
      const meta = formatRecipeMeta(record);
      const returnTarget = session.trigger?.closest('[data-module-detail]') ? '烹饪指南' : '最近记录';
      return `<header class="cooking-bar">${backButton(`返回${returnTarget}`)}
        <span class="cooking-bar-title">烹饪指南</span>
        <div class="cooking-bar-actions">${recordActions.markup('cooking')}</div>
      </header>
      <div class="cooking-scroll" tabindex="0" aria-label="菜谱内容">
        <section class="cooking-hero">
          ${recipeImage(recipe.coverImage, 'cooking-cover', `${record.title}成品`)}
          <div class="cooking-hero-content"><h2 id="cooking-title" tabindex="-1">${escapeHtml(record.title)}</h2>
            ${meta ? `<p class="cooking-meta">${escapeHtml(meta)}</p>` : ''}
            ${experienceView.entry('cooking')}
          </div>
        </section>
        <section class="cooking-section">
          <div class="cooking-section-header"><h3>用料</h3></div>
          ${renderIngredients()}
        </section>
        <section class="cooking-section">
          <div class="cooking-section-header"><h3>步骤</h3>
            ${recipe.steps.length ? button('mode', '进入烹饪模式', 'cooking-button-primary') : ''}
          </div>
          ${renderSteps()}
        </section>
        <section class="cooking-section"><div class="cooking-section-header"><h3>小贴士</h3></div>${renderTips()}</section>
      </div>`;
    }

    function modeView() {
      return `<header class="cooking-bar">${backButton('退出烹饪模式')}
        <h2 id="cooking-title" class="cooking-bar-title" tabindex="-1">烹饪模式</h2>
        <div class="cooking-bar-actions">
          ${button('ingredients', '用料', '', 'aria-expanded="false" aria-controls="cooking-panel"')}
          ${button('tips', '小贴士', '', 'aria-expanded="false" aria-controls="cooking-panel"')}
        </div>
      </header>
      <div class="cooking-scroll" tabindex="0" aria-label="烹饪步骤">
        <h3 class="cooking-mode-title">${escapeHtml(session.record.title)}</h3>
        ${renderSteps(true)}
      </div>
      <div class="cooking-panel-overlay" hidden>
        <section class="cooking-panel" id="cooking-panel" role="dialog" aria-modal="true" aria-labelledby="cooking-panel-title"></section>
      </div>`;
    }

    function field(label, name, value = '', attributes = '') {
      return `<label class="field">${label}<input name="${name}" value="${escapeHtml(value)}" ${attributes}></label>`;
    }

    function textarea(label, name, value = '', attributes = '') {
      return `<label class="field">${label}<textarea name="${name}" ${attributes}>${escapeHtml(value)}</textarea></label>`;
    }

    function durationField(value) {
      return `<div class="field">
        <label for="cooking-duration">烹饪时间（选填）</label>
        <div class="cooking-duration-control">
          ${button('duration-less', '−', '', 'aria-label="减少烹饪时间"')}
          <div class="cooking-duration-input">
            <input id="cooking-duration" name="durationMinutes" type="text" inputmode="numeric" pattern="[0-9]+"
              maxlength="${String(Number.MAX_SAFE_INTEGER).length}" value="${escapeHtml(value ?? '')}" aria-describedby="cooking-duration-unit">
            <span id="cooking-duration-unit">分钟</span>
          </div>
          ${button('duration-more', '+', '', 'aria-label="增加烹饪时间"')}
        </div>
      </div>`;
    }

    function imageField(label, name, value) {
      const demo = value === 'demo:scallion-noodles';
      const attributes = `type="url" maxlength="2048" placeholder="https://…"${demo ? ' data-demo-image="demo:scallion-noodles"' : ''}`;
      return field(label, name, demo ? '' : value, attributes)
        + (demo ? '<p class="cooking-muted">已使用示例图片。填写图片链接可替换。</p>' : '');
    }

    function editorRow(kind, index, value = {}) {
      const step = kind === 'step';
      const label = step ? '步骤' : '用料';
      const fields = step ? [
        field('火候', 'heat', value.heat, 'maxlength="60" placeholder="例如小火、煮沸后转中火、无需加热" required'),
        textarea('做法', 'text', value.text, 'maxlength="2000" rows="3" required'),
        imageField('步骤图片链接（选填）', 'image', value.image)
      ] : [
        field('食材', 'name', value.name, 'maxlength="60" required'),
        field('用量', 'quantity', value.quantity, 'maxlength="40" placeholder="例如 1/2、1–2、适量"'),
        field('单位', 'unit', value.unit, 'maxlength="20" placeholder="例如 汤匙"')
      ];
      return `<div class="cooking-editor-row" data-cooking-row="${kind}">
        <div class="cooking-editor-row-header"><strong data-row-title>${label} ${index + 1}</strong>
          ${button('remove', '移除', '', `aria-label="移除${label} ${index + 1}"`)}
        </div>
        <div class="cooking-editor-fields">${fields.join('')}</div>
      </div>`;
    }

    function editorGroup(kind, items, open) {
      const step = kind === 'step';
      const label = step ? '步骤' : '用料';
      return `<details class="cooking-section cooking-editor-group"${open ? ' open' : ''}>
        <summary>
          <span class="cooking-editor-group-title">${label}</span>
          <span class="cooking-editor-group-count"><span data-editor-count>${items.length}</span> ${step ? '步' : '项'}</span>
        </summary>
        <div class="cooking-editor-group-body">
          <div data-editor-rows="${kind}">${items.map((item, index) => editorRow(kind, index, item)).join('')}</div>
          ${button(`add-${kind}`, '<span aria-hidden="true">+</span>', 'cooking-editor-add',
            `aria-label="添加${label}"${items.length >= MAX_ROWS ? ' disabled' : ''}`)}
        </div>
      </details>`;
    }

    function editorView() {
      const { record, recipe } = session;
      const value = !record && draft ? draft : { title: record?.title, ...(record && readRecipeMeta(record)), recipe };
      const editRecipe = value.recipe;
      return `<header class="cooking-bar">${backButton('取消编辑')}
        <h2 id="cooking-title" class="cooking-bar-title" tabindex="-1">${record ? '编辑菜谱' : '新增菜谱'}</h2>
      </header>
      <div class="cooking-scroll">
        <form class="cooking-editor">
          <section class="cooking-section">
            ${field('菜名', 'title', value.title, 'maxlength="30" required')}
            ${durationField(value.durationMinutes)}
            ${textarea('简介（选填）', 'summary', value.summary, 'maxlength="180" rows="2" placeholder="例如 家常快手"')}
            ${field('原始份数', 'servings', editRecipe.servings, `type="number" min="${MIN_SERVINGS}" max="${MAX_SERVINGS}" step="1" inputmode="numeric" required`)}
            ${imageField('成品图片链接（选填）', 'coverImage', editRecipe.coverImage)}
          </section>
          ${editorGroup('ingredient', editRecipe.ingredients, !record)}
          ${editorGroup('step', editRecipe.steps, !record)}
          <section class="cooking-section">${textarea('小贴士（选填）', 'tips', editRecipe.tips, 'maxlength="2000" rows="3"')}</section>
          <p class="cooking-form-error" role="alert" hidden></p>
          <button class="cooking-button cooking-button-primary cursor-interaction" type="submit">保存菜谱</button>
        </form>
      </div>`;
    }

    function syncServings() {
      const { servings, recipe } = session;
      windowElement.querySelectorAll('[data-cooking-servings]').forEach((element) => { element.textContent = `${servings} 人份`; });
      windowElement.querySelectorAll('[data-cooking-amount]').forEach((element) => {
        element.textContent = formatIngredientAmount(recipe.ingredients[Number(element.dataset.cookingAmount)], servings, recipe.servings);
      });
      windowElement.querySelectorAll('[data-cooking-action="less"]').forEach((control) => { control.disabled = servings <= MIN_SERVINGS; });
      windowElement.querySelectorAll('[data-cooking-action="more"]').forEach((control) => { control.disabled = servings >= MAX_SERVINGS; });
    }

    function syncDuration(input) {
      const value = Number(input.value);
      const control = input.closest('.cooking-duration-control');
      input.dataset.lastValue = input.value;
      control.querySelector('[data-cooking-action="duration-less"]').disabled = value === 0;
      control.querySelector('[data-cooking-action="duration-more"]').disabled = value === Number.MAX_SAFE_INTEGER;
    }

    function changeDuration(input, delta) {
      const value = Number(input.value) + delta;
      if (!Number.isSafeInteger(value) || value < 0) return;
      input.value = String(value);
      syncDuration(input);
    }

    function checkDurationInput(event) {
      const input = event.target;
      if (input.id !== 'cooking-duration' || event.isComposing) return;
      const digits = input.value.normalize('NFKC');
      if (!/^\d*$/.test(digits) || !Number.isSafeInteger(Number(digits))) input.value = input.dataset.lastValue;
      else if (digits !== input.value) input.value = digits;
      syncDuration(input);
    }

    function render(nextScreen, focusSelector) {
      recordActions.dismiss(windowElement);
      screen = nextScreen;
      windowElement.dataset.screen = screen;
      if (screen === 'experiences') {
        const { record } = session;
        windowElement.innerHTML = `<header class="cooking-bar">${backButton('返回菜谱详情')}
          <h2 id="cooking-title" class="cooking-bar-title">${escapeHtml(record.title)}</h2></header>
          <div class="cooking-scroll"><section class="experience-page" data-experience-page></section></div>`;
        experiences = experienceView.mount(windowElement.querySelector('[data-experience-page]'), record, {
          save: saveExperiences,
          backButton: windowElement.querySelector('[data-cooking-action="back"]'),
          onBack: (latest) => {
            session.record = latest;
            render('detail', '[data-open-experiences]');
          }
        });
        return;
      }
      experiences = undefined;
      windowElement.innerHTML = screen === 'mode' ? modeView() : screen === 'editor' ? editorView() : detailView();
      if (screen === 'detail') {
        scroll().scrollTop = session.detailScroll;
        const { record } = session;
        recordActions.bind(windowElement, {
          onEdit: () => {
            session.detailScroll = scroll().scrollTop;
            render('editor');
          },
          onDelete: () => deleteRecord(record),
          record,
          owner: windowElement,
          onDeleted: close
        });
      }
      if (screen === 'editor') syncDuration(windowElement.querySelector('#cooking-duration'));
      syncServings();
      const focusTarget = focusSelector && windowElement.querySelector(focusSelector);
      (focusTarget || windowElement.querySelector('#cooking-title')).focus({ preventScroll: true });
    }

    function open(record, trigger) {
      const recipe = record ? readRecipe(record) : { servings: 2, ingredients: [{ name: '', quantity: '', unit: '' }], steps: [{}], coverImage: '', tips: '' };
      session = { record, recipe, servings: recipe.servings, trigger, detailScroll: 0 };
      shell.inert = true;
      windowElement.hidden = false;
      render(record ? 'detail' : 'editor');
    }

    function close() {
      const { trigger } = session;
      recordActions.dismiss(windowElement);
      windowElement.hidden = true;
      windowElement.replaceChildren();
      shell.inert = false;
      session = undefined;
      (trigger?.isConnected && !trigger.closest('[hidden], [inert]') ? trigger : fallbackFocus(trigger))?.focus({ preventScroll: true });
    }

    function showPanel(action, trigger) {
      const overlay = windowElement.querySelector('.cooking-panel-overlay');
      const ingredients = action === 'ingredients';
      const title = ingredients ? '用料' : '小贴士';
      overlay.firstElementChild.innerHTML = `<header class="cooking-panel-header"><h3 id="cooking-panel-title">${title}</h3>
        ${button('close-panel', '关闭', '', `aria-label="关闭${title}"`)}</header>${ingredients ? renderIngredients() : renderTips()}`;
      overlayTrigger = trigger;
      overlayTrigger.setAttribute('aria-expanded', 'true');
      overlay.hidden = false;
      windowElement.querySelector('.cooking-bar').inert = true;
      scroll().inert = true;
      syncServings();
      overlay.querySelector('button').focus();
    }

    function closePanel() {
      const overlay = windowElement.querySelector('.cooking-panel-overlay:not([hidden])');
      if (!overlay) return false;
      overlay.hidden = true;
      windowElement.querySelector('.cooking-bar').inert = false;
      scroll().inert = false;
      overlayTrigger.setAttribute('aria-expanded', 'false');
      overlayTrigger.focus({ preventScroll: true });
      overlayTrigger = undefined;
      return true;
    }

    function readEditor(form) {
      const values = new FormData(form);
      const text = (name) => values.get(name).trim();
      const readField = (container, name) => {
        const input = container.querySelector(`[name="${name}"]`);
        return input.value.trim() || input.dataset.demoImage || '';
      };
      const rows = (kind, names) => [...form.querySelectorAll(`[data-cooking-row="${kind}"]`)].map((row) =>
        Object.fromEntries(names.map((name) => [name, readField(row, name)])));
      return {
        title: text('title'), summary: text('summary'), durationMinutes: text('durationMinutes'),
        recipe: {
          servings: values.get('servings'), tips: text('tips'),
          coverImage: readField(form, 'coverImage'),
          ingredients: rows('ingredient', ['name', 'quantity', 'unit']),
          steps: rows('step', ['heat', 'text', 'image'])
        }
      };
    }

    function goBack() {
      if (saving) return;
      if (screen === 'experiences') return experiences.back();
      if (screen === 'mode') return render('detail', '[data-cooking-action="mode"]');
      if (screen === 'editor' && session.record) return render('detail', '[data-record-action="toggle"]');
      if (screen === 'editor') draft = readEditor(windowElement.querySelector('form'));
      close();
    }

    function syncEditorCount(list) {
      const group = list.closest('.cooking-editor-group');
      group.querySelector('[data-editor-count]').textContent = list.children.length;
      group.querySelector('.cooking-editor-add').disabled = list.children.length >= MAX_ROWS;
    }

    function addRow(kind, trigger) {
      const list = trigger.parentElement.querySelector('[data-editor-rows]');
      if (list.children.length >= MAX_ROWS) return;
      list.insertAdjacentHTML('beforeend', editorRow(kind, list.children.length));
      list.lastElementChild.querySelector('input').focus();
      syncEditorCount(list);
    }

    function removeRow(trigger) {
      const row = trigger.closest('[data-cooking-row]');
      const kind = row.dataset.cookingRow;
      const list = row.parentElement;
      const label = kind === 'step' ? '步骤' : '用料';
      const add = windowElement.querySelector(`[data-cooking-action="add-${kind}"]`);
      const focusTarget = row.nextElementSibling?.querySelector('button') ?? row.previousElementSibling?.querySelector('button') ?? add;
      row.remove();
      [...list.children].forEach((remaining, index) => {
        remaining.querySelector('[data-row-title]').textContent = `${label} ${index + 1}`;
        remaining.querySelector('button').setAttribute('aria-label', `移除${label} ${index + 1}`);
      });
      syncEditorCount(list);
      focusTarget.focus();
    }

    windowElement.addEventListener('click', (event) => {
      if (saving) {
        event.preventDefault();
        return;
      }
      if (event.target.matches('.cooking-panel-overlay')) closePanel();
      if (event.target.closest('[data-open-experiences]')) {
        session.detailScroll = scroll().scrollTop;
        render('experiences');
        return;
      }
      const trigger = event.target.closest('[data-cooking-action]');
      switch (trigger?.dataset.cookingAction) {
        case 'back': goBack(); break;
        case 'mode':
          session.detailScroll = scroll().scrollTop;
          render('mode');
          break;
        case 'less':
        case 'more': {
          const delta = trigger.dataset.cookingAction === 'less' ? -1 : 1;
          session.servings = Math.max(MIN_SERVINGS, Math.min(MAX_SERVINGS, session.servings + delta));
          syncServings();
          if (trigger.disabled) {
            trigger.parentElement.querySelector('button:not([disabled])').focus({ preventScroll: true });
          }
          break;
        }
        case 'ingredients':
        case 'tips': showPanel(trigger.dataset.cookingAction, trigger); break;
        case 'close-panel': closePanel(); break;
        case 'add-ingredient': addRow('ingredient', trigger); break;
        case 'add-step': addRow('step', trigger); break;
        case 'remove': removeRow(trigger); break;
        case 'duration-less':
        case 'duration-more': {
          const input = windowElement.querySelector('#cooking-duration');
          changeDuration(input, trigger.dataset.cookingAction === 'duration-less' ? -1 : 1);
          if (trigger.disabled) input.focus({ preventScroll: true });
          break;
        }
      }
    });
    windowElement.addEventListener('input', checkDurationInput);
    windowElement.addEventListener('compositionend', checkDurationInput);

    windowElement.addEventListener('invalid', (event) => {
      const group = event.target.closest('.cooking-editor-group');
      if (group) group.open = true;
    }, true);

    async function saveEditor(form, value) {
      const submit = form.querySelector('button[type="submit"]');
      const label = submit.textContent;
      const buttons = windowElement.querySelectorAll('button:not([disabled], [aria-disabled])');
      const fields = form.querySelectorAll('input:not([readonly]), textarea:not([readonly])');
      saving = true;
      form.setAttribute('aria-busy', 'true');
      submit.textContent = '正在保存…';
      for (const button of buttons) button.setAttribute('aria-disabled', 'true');
      for (const field of fields) field.readOnly = true;
      try {
        return await saveRecord(value, session.record);
      } finally {
        saving = false;
        form.removeAttribute('aria-busy');
        submit.textContent = label;
        for (const button of buttons) button.removeAttribute('aria-disabled');
        for (const field of fields) field.readOnly = false;
      }
    }

    windowElement.addEventListener('submit', async (event) => {
      if (screen !== 'editor') return;
      event.preventDefault();
      if (saving) return;
      const form = event.target;
      const error = form.querySelector('.cooking-form-error');
      error.hidden = true;
      try {
        const value = readEditor(form);
        if (!value.title) throw new Error('请填写菜名。');
        if (!value.recipe.steps.length) {
          const add = form.querySelector('[data-cooking-action="add-step"]');
          add.closest('.cooking-editor-group').open = true;
          add.focus();
          throw new Error('请至少添加一个步骤。');
        }
        value.durationMinutes = normalizeDuration(value.durationMinutes === '' ? null : Number(value.durationMinutes));
        value.recipe.servings = Number(value.recipe.servings);
        value.recipe = normalizeRecipe(value.recipe, { strict: true });
        const record = await saveEditor(form, value);
        if (!session.record) draft = undefined;
        session.record = record;
        session.recipe = value.recipe;
        session.servings = value.recipe.servings;
        session.detailScroll = 0;
        render('detail');
      } catch (problem) {
        error.textContent = problem?.message || '未能保存菜谱，请重试。';
        error.hidden = false;
        error.scrollIntoView({ block: 'nearest' });
      }
    });

    windowElement.addEventListener('keydown', (event) => {
      if (!saving && !event.isComposing && event.target.id === 'cooking-duration'
        && (event.key === 'ArrowUp' || event.key === 'ArrowDown')) {
        event.preventDefault();
        changeDuration(event.target, event.key === 'ArrowUp' ? 1 : -1);
      }
      if (event.key === 'Escape') {
        event.stopPropagation();
        if (event.isComposing) return;
        event.preventDefault();
        if (!closePanel()) goBack();
      }
      if (event.key !== 'Tab') return;
      const region = windowElement.querySelector('.cooking-panel-overlay:not([hidden])') ?? windowElement;
      const controls = [...region.querySelectorAll('button, input, textarea, select, summary, [tabindex="0"]')]
        .filter((element) => !element.disabled && !element.closest('[hidden], [inert], details:not([open]) > :not(summary)'));
      if (event.shiftKey && (document.activeElement === controls[0] || !controls.includes(document.activeElement))) {
        event.preventDefault();
        controls.at(-1)?.focus();
      } else if (!event.shiftKey && document.activeElement === controls.at(-1)) {
        event.preventDefault();
        controls[0]?.focus();
      }
    });

    return { open, clearDraft: () => { draft = undefined; } };
  }

  globalThis.CookingModule = { renderList, createWindow };
})();
</script>
<script>
(() => {
  const storageKey = 'm-app-people-v1';
  const limits = {
    title: 30, name: 80, label: 30, value: 180, notes: 1000, relationships: 40,
    contacts: 20, custom: 32, customTotal: 256, avatar: 90000, id: 64, summary: 180, time: 32, age: 150
  };
  const fields = [
    ['avatar', '头像'], ['nickname', '昵称／称呼'], ['birthday', '生日和年龄'], ['location', '所在地'],
    ['relationships', '关系'], ['contacts', '联系方式'], ['notes', '备注']
  ];
  const fieldKeys = fields.map(([key]) => key);
  const defaultRelationships = ['家人', '朋友', '同学', '同事', '其他'];
  const recordIdPattern = /^[A-Za-z0-9_-]{1,64}$/;
  const fieldIdPattern = /^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$/;

  function invalid(label, strict) {
    if (strict) throw new Error(`人物卡片的${label}格式不正确。`);
  }

  function objectValue(value, label, strict) {
    if (value !== null && typeof value === 'object' && !Array.isArray(value)) return value;
    if (value !== undefined) invalid(label, strict);
    return {};
  }

  function textValue(value, maxLength, label, strict) {
    if (typeof value === 'string' && value.length <= maxLength) return value.trim();
    if (value !== undefined) invalid(label, strict);
    return typeof value === 'string' ? value.trim().slice(0, maxLength) : '';
  }

  function listValue(value, maxLength, label, strict) {
    if (Array.isArray(value)) {
      if (value.length > maxLength) invalid(label, strict);
      return value.slice(0, maxLength);
    }
    if (value !== undefined) invalid(label, strict);
    return [];
  }

  function relationshipList(value, strict) {
    const labels = [];
    for (const item of listValue(value, limits.relationships, '关系列表', strict)) {
      const label = textValue(item, limits.label, '关系名称', strict);
      if (label && !labels.includes(label)) labels.push(label);
      else invalid('关系列表', strict);
    }
    return labels;
  }

  function validFieldId(id) {
    return typeof id === 'string' && fieldIdPattern.test(id) && !Object.hasOwn(Object.prototype, id);
  }

  function normalizeSettings(value, { strict = false } = {}) {
    const settings = objectValue(value, '设置', strict);
    const visible = settings.fields === undefined ? fieldKeys : listValue(settings.fields, fields.length, '内置属性设置', strict);
    if (visible.some((key) => !fieldKeys.includes(key)) || new Set(visible).size !== visible.length) {
      invalid('内置属性设置', strict);
    }

    const custom = [];
    const ids = new Set();
    let activeCount = 0;
    for (const item of listValue(settings.custom, limits.customTotal, '自定义属性设置', strict)) {
      const field = objectValue(item, '自定义属性', strict);
      const label = textValue(field.label, limits.label, '自定义属性名称', strict);
      if (!validFieldId(field.id) || !label || ids.has(field.id)) {
        invalid('自定义属性', strict);
        continue;
      }
      if (field.visible !== undefined && typeof field.visible !== 'boolean') invalid('自定义属性显示设置', strict);
      if (field.archived !== undefined && typeof field.archived !== 'boolean') invalid('自定义属性移除状态', strict);
      const archived = field.archived === true;
      if (!archived && activeCount >= limits.custom) {
        invalid('自定义属性数量', strict);
        continue;
      }
      if (!archived) activeCount++;
      ids.add(field.id);
      custom.push({ id: field.id, label, visible: field.visible !== false, ...(archived && { archived }) });
    }

    return {
      fields: fieldKeys.filter((key) => visible.includes(key)),
      relationships: settings.relationships === undefined ? [...defaultRelationships] : relationshipList(settings.relationships, strict),
      custom
    };
  }

  function birthdayValue(year = '', month = '', day = '', now = new Date()) {
    year = String(year).trim();
    month = String(month).trim();
    day = String(day).trim();
    if (!year && !month && !day) return '';
    if ((year && !/^\d{4}$/.test(year)) || !/^\d{1,2}$/.test(month) || !/^\d{1,2}$/.test(day)) return null;

    const birthYear = Number(year);
    const birthMonth = Number(month);
    const birthDay = Number(day);
    if (year && birthYear < 1) return null;
    const calendarYear = year ? birthYear : 2000;
    const leap = calendarYear % 4 === 0 && (calendarYear % 100 !== 0 || calendarYear % 400 === 0);
    const daysInMonth = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    if (birthDay < 1 || birthDay > (daysInMonth[birthMonth - 1] ?? 0)) return null;

    const monthDay = `${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
    if (!year) return `--${monthDay}`;
    const birthDate = `${year}-${monthDay}`;
    const today = [now.getFullYear(), now.getMonth() + 1, now.getDate()].map((part, index) =>
      String(part).padStart(index === 0 ? 4 : 2, '0')).join('-');
    return birthDate <= today ? birthDate : null;
  }

  function birthdayParts(value) {
    const match = /^(?:(\d{4})-|--)(\d{2})-(\d{2})$/.exec(value);
    const [, year = '', month = '', day = ''] = match ?? [];
    return { year, month, day };
  }

  function birthdayLabel(value) {
    const { year, month, day } = birthdayParts(value);
    if (!month) return '';
    return `${year ? `${Number(year)}年` : ''}${Number(month)}月${Number(day)}日`;
  }

  function age(value, now = new Date()) {
    const { year, month, day } = birthdayParts(value);
    if (!year || birthdayValue(year, month, day, now) !== value) return null;
    const beforeBirthday = now.getMonth() + 1 < Number(month)
      || (now.getMonth() + 1 === Number(month) && now.getDate() < Number(day));
    const years = now.getFullYear() - Number(year) - Number(beforeBirthday);
    return years >= 0 ? years : null;
  }

  function normalizePerson(value, { strict = false } = {}) {
    const person = objectValue(value, '属性', strict);
    let avatar = textValue(person.avatar, limits.avatar, '头像', strict);
    if (avatar && (!/^data:image\/jpeg;base64,\/9j\/[A-Za-z0-9+/]*={0,2}$/.test(avatar)
      || (avatar.length - 'data:image/jpeg;base64,'.length) % 4 !== 0)) {
      invalid('头像', strict);
      avatar = '';
    }
    let birthday = textValue(person.birthday, 10, '生日', strict);
    if (birthday) {
      const { year, month, day } = birthdayParts(birthday);
      if (birthdayValue(year, month, day) !== birthday) {
        invalid('生日', strict);
        birthday = '';
      }
    }
    const validManualAge = Number.isInteger(person.manualAge) && person.manualAge >= 0 && person.manualAge <= limits.age;
    if (person.manualAge != null && !validManualAge) invalid('年龄', strict);

    const contacts = [];
    for (const item of listValue(person.contacts, limits.contacts, '联系方式列表', strict)) {
      const contact = objectValue(item, '联系方式', strict);
      const label = textValue(contact.label, limits.label, '联系方式名称', strict);
      const value = textValue(contact.value, limits.value, '联系方式内容', strict);
      if (label && value) contacts.push({ label, value });
      else invalid('联系方式', strict);
    }

    const custom = [];
    const customEntries = Object.entries(objectValue(person.custom, '自定义属性', strict));
    for (const [id, rawValue] of listValue(customEntries, limits.customTotal, '自定义属性', strict)) {
      if (validFieldId(id)) {
        const value = textValue(rawValue, limits.value, '自定义属性内容', strict);
        if (value) custom.push([id, value]);
      } else invalid('自定义属性编号', strict);
    }

    return {
      avatar,
      nickname: textValue(person.nickname, limits.name, '昵称／称呼', strict),
      birthday,
      manualAge: validManualAge ? person.manualAge : null,
      location: textValue(person.location, limits.name, '所在地', strict),
      relationships: relationshipList(person.relationships, strict),
      contacts,
      notes: textValue(person.notes, limits.notes, '备注', strict),
      custom: Object.fromEntries(custom)
    };
  }

  function personFor(record) {
    return record?.person ? normalizePerson(record.person) : normalizePerson({ notes: record?.detail || record?.summary });
  }

  function initial(title) {
    return [...title.trim()][0] || '人';
  }

  function summary(person, settings) {
    const { fields: visible } = settings;
    const birthdayOrAge = birthdayLabel(person.birthday) || (person.manualAge === null ? '' : `${person.manualAge} 岁`);
    const values = [
      visible.includes('relationships') && person.relationships.join('、'),
      visible.includes('nickname') && person.nickname,
      visible.includes('location') && person.location,
      visible.includes('birthday') && birthdayOrAge
    ];
    return values.filter(Boolean).join(' · ').slice(0, limits.summary);
  }

  function readStore() {
    try {
      const raw = globalThis.localStorage.getItem(storageKey);
      if (!raw) return null;
      const { records, settings, sort } = JSON.parse(raw);
      if (!Array.isArray(records)) return null;
      const ids = new Set();
      const normalizedRecords = records.map((record) => {
        if (record?.kind !== 'people' || typeof record.id !== 'string' || !recordIdPattern.test(record.id)
          || ['parking', 'none'].includes(record.id) || ids.has(record.id)) invalid('记录编号', true);
        ids.add(record.id);
        const title = textValue(record.title, limits.title, '姓名', true);
        const time = textValue(record.time, limits.time, '时间', true);
        if (!title || !time) invalid('记录', true);
        const person = record.person === undefined ? personFor(record) : normalizePerson(record.person, { strict: true });
        return {
          id: record.id, kind: 'people', title, time, person,
          summary: textValue(record.summary, limits.summary, '摘要', true),
          detail: textValue(record.detail, limits.notes, '内容', true),
          ...(Object.hasOwn(record, 'experiences') && {
            experiences: globalThis.RecordExperiences.normalize(record.experiences, 'people')
          })
        };
      });
      return { records: normalizedRecords, settings: normalizeSettings(settings, { strict: true }), sort: sort === 'name' ? 'name' : 'recent' };
    } catch {
      return null;
    }
  }

  function writeStore(bundle) {
    globalThis.localStorage.setItem(storageKey, JSON.stringify(bundle));
  }

  function withStoreLock(callback) {
    const locks = globalThis.navigator?.locks;
    return locks ? locks.request(storageKey, callback) : Promise.resolve().then(callback);
  }

  globalThis.PeopleCards = {
    fields, limits, storageKey, normalizeSettings, normalizePerson, personFor, birthdayValue, birthdayParts,
    birthdayLabel, age, initial, summary, readStore, writeStore, withStoreLock
  };
})();
</script>
<script>
(() => {
  const model = globalThis.PeopleCards;
  const { fields, limits } = model;
  const escape = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);

  function avatarMarkup(avatar, title) {
    return avatar ? `<span class="person-avatar" aria-hidden="true"><img src="${escape(avatar)}" alt=""></span>`
      : `<span class="person-avatar person-avatar-fallback" aria-hidden="true">${escape(model.initial(title))}</span>`;
  }

  function detailRow(label, content, kind = '') {
    return content ? `<div class="person-row"><dt>${escape(label)}</dt><dd class="${kind}">${content}</dd></div>` : '';
  }

  function section(rows) {
    const content = rows.join('');
    return content ? `<dl class="person-group">${content}</dl>` : '';
  }

  function contactDetail({ label, value }) {
    const text = escape(value);
    if (/^[+\d][\d ().-]{3,28}$/.test(value)) {
      return detailRow(label, `<a href="tel:${value.replace(/[ ().-]/g, '')}">${text}</a>`);
    }
    if (/^[A-Z0-9.!$'_*+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i.test(value)) {
      return detailRow(label, `<a href="mailto:${text}">${text}</a>`);
    }
    return detailRow(label, text);
  }

  function textField(label, name, value, limit, required = false) {
    return `<label class="person-input-row"><span>${escape(label)}</span>
      <input name="${name}" value="${escape(value)}" maxlength="${limit}"${required ? ' required' : ''}></label>`;
  }

  function birthdayForm({ year, month, day }) {
    return `<fieldset class="person-birthday"><legend>生日</legend>
      <div class="person-birthday-fields">
        <label><span>年（选填）</span><input type="number" name="birth-year" inputmode="numeric" min="1" max="${new Date().getFullYear()}" value="${escape(year)}"></label>
        <label><span>月</span><input type="number" name="birth-month" inputmode="numeric" min="1" max="12" value="${escape(month)}"></label>
        <label><span>日</span><input type="number" name="birth-day" inputmode="numeric" min="1" max="31" value="${escape(day)}"></label>
      </div></fieldset>`;
  }

  function ageForm(manualAge) {
    return `<div class="person-input-row">
      <span>年龄</span>
      <input name="manual-age" aria-label="年龄" type="number" min="0" max="${limits.age}" step="1"
        inputmode="numeric" placeholder="可选填" value="${escape(manualAge)}">
      <output class="person-age-output" aria-label="按生日计算的年龄" hidden></output>
    </div>`;
  }

  function checkbox(name, value, label, checked) {
    return `<label class="person-check"><input type="checkbox" name="${name}" value="${escape(value)}"${checked ? ' checked' : ''}>
      <span>${escape(label)}</span></label>`;
  }

  function contactRow({ label = '', value = '' } = {}) {
    return `<div class="person-contact-row">
      <input name="contact-label" aria-label="联系方式类型" list="m-app-contact-labels" placeholder="类型" maxlength="${limits.label}" value="${escape(label)}">
      <input name="contact-value" aria-label="联系方式内容" placeholder="联系方式" maxlength="${limits.value}" value="${escape(value)}">
      <button class="person-row-remove cursor-interaction" type="button" data-person-remove-row aria-label="移除此联系方式">−</button>
    </div>`;
  }

  async function prepareAvatar(file) {
    if (!file.type.startsWith('image/') || file.size > 20 * 1024 * 1024) {
      throw new Error('请选择小于 20 MB 的图片。');
    }
    const url = URL.createObjectURL(file);
    try {
      const image = new Image();
      image.src = url;
      await image.decode();
      const size = Math.min(image.naturalWidth, image.naturalHeight);
      if (!size) throw new Error();
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = Math.min(size, 256);
      const context = canvas.getContext('2d');
      context.fillStyle = '#f0eef8';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, (image.naturalWidth - size) / 2, (image.naturalHeight - size) / 2, size, size,
        0, 0, canvas.width, canvas.height);
      const avatar = canvas.toDataURL('image/jpeg', 0.82);
      if (avatar.length > limits.avatar) throw new Error();
      return avatar;
    } catch {
      throw new Error('无法读取这张图片，请试试 JPG 或 PNG。');
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function settingRow(kind, { id = '', label = '', visible = true, previous = '' } = {}) {
    const custom = kind === 'custom';
    return `<div class="person-setting-row" data-person-setting-row="${kind}" data-id="${escape(id)}" data-previous="${escape(previous)}">
      ${custom ? checkbox('custom-visible', id, '显示', visible) : ''}
      <input aria-label="${custom ? '自定义属性名称' : '关系名称'}" placeholder="${custom ? '例如 常去的球场' : '例如 邻居'}"
        type="text" name="${kind}-label" maxlength="${limits.label}" value="${escape(label)}" required>
      ${custom ? '<button class="person-inline-button person-archive-button cursor-interaction" type="button" data-person-archive-field>移除</button>'
        : '<button class="person-row-remove cursor-interaction" type="button" data-person-remove-row aria-label="移除此关系选项">−</button>'}
    </div>`;
  }

  function setError(form, message = '') {
    const error = form.querySelector('.person-form-error');
    error.textContent = message;
    error.hidden = !message;
    if (message) {
      error.tabIndex = -1;
      error.focus();
    }
  }

  function appendRow(list, markup, input) {
    list.insertAdjacentHTML('beforeend', markup);
    list.lastElementChild.querySelector(input).focus();
  }

  function removeRow(button, fallback) {
    const row = button.parentElement;
    const next = row.nextElementSibling ?? row.previousElementSibling;
    row.remove();
    (next?.querySelector('input[type="text"], input[name="contact-label"]') ?? fallback).focus();
  }

  function create({ setSheet, sheetContent, sheetBack, closeSheet, showNotice, savePerson, savePeopleSettings,
    saveExperiences, icon, findRecord, getSettings, isOpen }) {
    const drafts = new Map();
    const experienceView = globalThis.RecordExperienceView;

    function showDetails(record, trigger, focusMore = false) {
      const person = model.personFor(record);
      const settings = getSettings();
      const has = (key) => settings.fields.includes(key);
      const years = has('birthday') ? (model.age(person.birthday) ?? person.manualAge) : null;
      const tags = person.relationships.length
        ? `<span class="person-tags">${person.relationships.map((value) => `<span class="person-tag">${escape(value)}</span>`).join('')}</span>` : '';
      const groups = [
        section([
          has('birthday') ? detailRow('生日', escape(model.birthdayLabel(person.birthday))) : '',
          years !== null ? detailRow('年龄', `${years} 岁`) : '',
          has('location') ? detailRow('所在地', escape(person.location)) : '',
          has('relationships') ? detailRow('关系', tags) : '',
        ]),
        has('contacts') ? section(person.contacts.map(contactDetail)) : '',
        section(settings.custom.filter((field) => field.visible && !field.archived)
          .map(({ id, label }) => detailRow(label, escape(person.custom[id])))),
        has('notes') ? section([detailRow('备注', escape(person.notes), 'person-notes')]) : ''
      ].join('');
      if (!setSheet('人物卡片', `<article class="person-card">
        <header class="person-hero">
          ${has('avatar') ? avatarMarkup(person.avatar, record.title) : ''}
          <h3 class="person-name">${escape(record.title)}</h3>
          ${has('nickname') && person.nickname ? `<p class="person-nickname">${escape(person.nickname)}</p>` : ''}
        </header>
        ${experienceView.entry('people')}
        <div class="person-groups">${groups || '<p class="person-empty">打开编辑可补充人物资料。</p>'}</div>
      </article>`, trigger, { record, onBack: closeSheet, onEdit: () => showEditor(record), focusMore })) return;
      sheetContent.querySelector('[data-open-experiences]').onclick = () => showExperiences(record);
    }

    function showExperiences(record) {
      let screen;
      if (!setSheet(record.title, '<section class="experience-page" data-experience-page></section>', undefined, {
        onBack: () => screen.back(), backLabel: `返回${record.title}详情`
      })) return;
      screen = experienceView.mount(sheetContent.querySelector('[data-experience-page]'), record, {
        save: saveExperiences,
        backButton: sheetBack,
        onBack: (latest) => {
          showDetails(latest);
          sheetContent.querySelector('[data-open-experiences]')?.focus({ preventScroll: true });
        }
      });
    }

    function showEditor(record, trigger) {
      const key = record?.id ?? 'new';
      const person = model.personFor(record);
      const source = record ? JSON.stringify([record.title, record.time, person]) : '';
      const remembered = drafts.get(key);
      const draft = remembered?.source === source ? remembered.values
        : { ...person, title: record?.title ?? '', birth: model.birthdayParts(person.birthday) };
      if (remembered && remembered.source !== source) drafts.delete(key);
      const settings = getSettings();
      const has = (field) => settings.fields.includes(field);
      const relationships = [...new Set([...settings.relationships, ...draft.relationships])];
      const customFields = settings.custom.filter((field) => field.visible && !field.archived);
      let saving = false;
      const goBack = () => {
        if (saving) return;
        const current = record && findRecord(record.id);
        if (current) showDetails(current, undefined, true);
        else closeSheet();
      };
      if (!setSheet(record ? '编辑人物卡片' : '新增人物卡片', `<form class="person-form">
        ${has('avatar') ? `<div class="person-hero">
          <div data-person-avatar-preview>${avatarMarkup(draft.avatar, draft.title)}</div>
          <div class="person-avatar-actions">
            <button type="button" class="person-inline-button cursor-interaction" data-person-pick>选择头像</button>
            <button type="button" class="person-inline-button cursor-interaction" data-person-clear${draft.avatar ? '' : ' hidden'}>移除头像</button>
            <input type="file" accept="image/*" class="person-avatar-input" aria-label="选择头像文件" hidden>
          </div>
        </div>` : ''}
        <div class="person-group">
          ${textField('姓名', 'title', draft.title, limits.title, true)}
          ${has('nickname') ? textField('昵称／称呼', 'nickname', draft.nickname, limits.name) : ''}
          ${has('birthday') ? birthdayForm(draft.birth) + ageForm(draft.manualAge) : ''}
          ${has('location') ? textField('所在地', 'location', draft.location, limits.name) : ''}
        </div>
        ${has('relationships') ? `<fieldset class="person-group person-field-toggles">
          <legend>关系（可多选）</legend>
          ${relationships.length ? relationships.map((label) => checkbox('relationship', label, label, draft.relationships.includes(label))).join('')
            : '<p class="person-empty">可在人物卡片设置添加关系选项。</p>'}
        </fieldset>` : ''}
        ${has('contacts') ? `<fieldset class="person-group">
          <legend>联系方式</legend>
          <div class="person-contact-list">${draft.contacts.map(contactRow).join('')}</div>
          <datalist id="m-app-contact-labels"><option value="手机"><option value="微信"><option value="邮箱"><option value="其他"></datalist>
          <button class="person-inline-button cursor-interaction" type="button" data-person-add-contact>${icon('plus')}添加联系方式</button>
        </fieldset>` : ''}
        ${customFields.length ? `<div class="person-group">${customFields.map(({ id, label }) => textField(label, `custom-${id}`, draft.custom[id], limits.value)).join('')}</div>` : ''}
        ${has('notes') ? `<label class="person-group person-input-row person-notes"><span>备注</span>
          <textarea name="notes" rows="4" maxlength="${limits.notes}">${escape(draft.notes)}</textarea></label>` : ''}
        <p class="person-form-error" role="alert" hidden></p>
        <div class="person-form-actions">
          <button class="primary cursor-interaction" type="submit">保存</button>
          <button class="secondary cursor-interaction" type="button" data-person-cancel>取消</button>
        </div>
      </form>`, trigger, { onBack: goBack, backLabel: record ? '返回人物详情' : undefined })) return;

      const form = sheetContent.querySelector('.person-form');
      const title = form.elements.title;
      const submit = form.querySelector('[type="submit"]');
      const addContact = form.querySelector('[data-person-add-contact]');
      const contactList = form.querySelector('.person-contact-list');
      const photo = form.querySelector('.person-avatar-input');
      const pickPhoto = form.querySelector('[data-person-pick]');
      const clearPhoto = form.querySelector('[data-person-clear]');
      const birthFields = form.querySelector('.person-birthday');
      const ageInput = form.elements['manual-age'];
      const ageOutput = form.querySelector('.person-age-output');
      let avatar = draft.avatar;
      let photoLoading = false;
      const active = () => form.isConnected && isOpen();

      function readBirth() {
        return {
          year: form.elements['birth-year'].value,
          month: form.elements['birth-month'].value,
          day: form.elements['birth-day'].value
        };
      }

      function updateAge() {
        const { year, month, day } = readBirth();
        const calculated = model.age(model.birthdayValue(year, month, day));
        ageInput.hidden = ageInput.disabled = calculated !== null;
        ageOutput.hidden = calculated === null;
        ageOutput.textContent = calculated === null ? '' : `${calculated} 岁（按生日计算）`;
      }

      function capture() {
        const values = new FormData(form);
        const contactLabels = values.getAll('contact-label');
        return {
          title: title.value,
          avatar,
          nickname: values.get('nickname') ?? draft.nickname,
          birth: birthFields ? readBirth() : draft.birth,
          manualAge: ageInput?.value ?? draft.manualAge,
          location: values.get('location') ?? draft.location,
          relationships: has('relationships') ? values.getAll('relationship') : draft.relationships,
          contacts: has('contacts') ? values.getAll('contact-value').map((value, index) => ({ label: contactLabels[index], value })) : draft.contacts,
          notes: values.get('notes') ?? draft.notes,
          custom: { ...draft.custom, ...Object.fromEntries(customFields.map(({ id }) => [id, values.get(`custom-${id}`)])) }
        };
      }

      function updateAvatar() {
        if (!photo) return;
        form.querySelector('[data-person-avatar-preview]').innerHTML = avatarMarkup(avatar, title.value);
        clearPhoto.hidden = !avatar;
      }

      function remember() {
        drafts.set(key, { source, values: capture() });
      }

      if (birthFields) {
        updateAge();
        birthFields.addEventListener('input', updateAge);
      }

      form.addEventListener('input', (event) => {
        title.setCustomValidity('');
        form.elements['birth-day']?.setCustomValidity('');
        remember();
        if (!avatar && event.target === title) updateAvatar();
      });

      form.querySelector('[data-person-cancel]').addEventListener('click', () => {
        if (saving) return;
        drafts.delete(key);
        goBack();
      });

      addContact?.addEventListener('click', () => {
        if (contactList.children.length >= limits.contacts) return setError(form, `最多可以填写 ${limits.contacts} 条联系方式。`);
        appendRow(contactList, contactRow(), 'input');
        remember();
        setError(form);
      });
      contactList?.addEventListener('click', (event) => {
        const remove = event.target.closest('[data-person-remove-row]');
        if (!remove) return;
        removeRow(remove, addContact);
        remember();
        setError(form);
      });

      pickPhoto?.addEventListener('click', () => photo.click());
      clearPhoto?.addEventListener('click', () => {
        avatar = '';
        updateAvatar();
        remember();
        pickPhoto.focus();
      });
      photo?.addEventListener('change', async () => {
        const file = photo.files[0];
        if (!file) return;
        photoLoading = true;
        submit.disabled = pickPhoto.disabled = clearPhoto.disabled = true;
        setError(form);
        try {
          const prepared = await prepareAvatar(file);
          if (!active()) return;
          avatar = prepared;
          updateAvatar();
          remember();
        } catch (error) {
          if (active()) setError(form, error.message);
        } finally {
          photoLoading = false;
          photo.value = '';
          submit.disabled = pickPhoto.disabled = clearPhoto.disabled = false;
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (saving || photoLoading) return;
        title.value = title.value.trim();
        if (!form.reportValidity()) return;
        const { title: name, birth, manualAge, ...values } = capture();
        const birthday = has('birthday') ? model.birthdayValue(birth.year, birth.month, birth.day) : person.birthday;
        if (birthday === null) {
          form.elements['birth-day'].setCustomValidity('请输入有效的生日。年份可留空。');
          form.elements['birth-day'].reportValidity();
          return;
        }
        if (values.relationships.length > limits.relationships) {
          return setError(form, `最多可以选择 ${limits.relationships} 项关系。`);
        }
        values.contacts = values.contacts.filter(({ value }) => value.trim()).map(({ label, value }) => ({
          label: label.trim() || '联系方式', value
        }));
        setError(form);
        saving = submit.disabled = true;
        try {
          const enteredAge = manualAge === '' || manualAge === null ? null : Number(manualAge);
          const saved = await savePerson(name, model.normalizePerson({ ...values, birthday, manualAge: enteredAge }), record);
          drafts.delete(key);
          if (active()) showDetails(saved, undefined, Boolean(record));
          showNotice('人物卡片已保存');
        } catch (error) {
          if (active()) setError(form, error.message);
          else showNotice(error.message);
        } finally {
          saving = submit.disabled = false;
        }
      });
    }

    function mountSettings(container) {
      const settings = getSettings();
      container.innerHTML = `<form class="person-settings">
        <fieldset class="person-group person-field-toggles"><legend>显示的属性</legend>
          ${fields.map(([key, label]) => checkbox('field', key, label, settings.fields.includes(key))).join('')}
        </fieldset>
        <fieldset class="person-group">
          <legend>自定义属性</legend>
          <div class="person-settings-list" data-person-settings-list="custom">
            ${settings.custom.filter(({ archived }) => !archived).map((field) => settingRow('custom', field)).join('')}
          </div>
          <button class="person-inline-button cursor-interaction" type="button" data-person-add-setting="custom">${icon('plus')}添加属性</button>
          <details class="person-custom-archive" hidden>
            <summary>已移除的属性</summary>
            <p class="person-empty">恢复属性时也会找回已填内容。</p>
            <div class="person-settings-list" data-person-settings-list="archived"></div>
          </details>
        </fieldset>
        <fieldset class="person-group">
          <legend>关系选项</legend>
          <div class="person-settings-list" data-person-settings-list="relation">
            ${settings.relationships.map((label) => settingRow('relation', { label, previous: label })).join('')}
          </div>
          <button class="person-inline-button cursor-interaction" type="button" data-person-add-setting="relation">${icon('plus')}添加关系</button>
        </fieldset>
        <p class="person-form-error" role="alert" hidden></p>
        <button class="primary cursor-interaction" type="submit">保存人物属性设置</button>
      </form>`;
      const form = container.querySelector('form');
      const submit = form.querySelector('[type="submit"]');
      const settingsList = (kind) => form.querySelector(`[data-person-settings-list="${kind}"]`);
      const customList = settingsList('custom');
      const archiveList = settingsList('archived');
      const archive = archiveList.closest('details');
      const addCustom = form.querySelector('[data-person-add-setting="custom"]');
      const archivedFields = new Map(settings.custom.filter(({ archived }) => archived).map((field) => [field.id, field]));
      let base = settings;

      function renderArchive() {
        archive.hidden = !archivedFields.size;
        archiveList.innerHTML = [...archivedFields.values()].map(({ id, label }) => `<div class="person-setting-row">
          <span class="person-archived-label">${escape(label)}</span>
          <button class="person-inline-button cursor-interaction" type="button" data-person-restore-field="${escape(id)}">恢复</button>
        </div>`).join('');
      }

      customList.addEventListener('click', (event) => {
        const button = event.target.closest('[data-person-archive-field]');
        if (!button) return;
        const { id } = button.parentElement.dataset;
        const saved = base.custom.find((field) => field.id === id);
        if (saved) archivedFields.set(id, { ...saved, archived: true });
        removeRow(button, addCustom);
        renderArchive();
        setError(form);
      });

      archiveList.addEventListener('click', (event) => {
        const button = event.target.closest('[data-person-restore-field]');
        if (!button) return;
        if (customList.children.length >= limits.custom) {
          return setError(form, `最多可使用 ${limits.custom} 个自定义属性。`);
        }
        const field = archivedFields.get(button.dataset.personRestoreField);
        archivedFields.delete(field.id);
        renderArchive();
        appendRow(customList, settingRow('custom', { ...field, visible: true }), 'input[type="text"]');
        setError(form);
      });
      renderArchive();

      form.addEventListener('click', (event) => {
        const add = event.target.closest('[data-person-add-setting]');
        const remove = event.target.closest('[data-person-remove-row]');
        if (add) {
          const kind = add.dataset.personAddSetting;
          const list = settingsList(kind);
          const cap = kind === 'custom' ? limits.custom : limits.relationships;
          if (list.children.length >= cap) return setError(form, `最多可以添加 ${cap} 项。`);
          if (kind === 'custom' && list.children.length + archivedFields.size >= limits.customTotal) {
            return setError(form, '自定义属性已达上限，可以恢复并重命名已移除的属性。');
          }
          const id = kind === 'custom' ? `field-${crypto.randomUUID()}` : '';
          appendRow(list, settingRow(kind, { id }), 'input[type="text"]');
        } else if (remove) {
          const kind = remove.parentElement.dataset.personSettingRow;
          removeRow(remove, form.querySelector(`[data-person-add-setting="${kind}"]`));
        } else return;
        setError(form);
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (submit.disabled) return;
        const values = new FormData(form);
        const custom = [...customList.children].map((row) => ({
          id: row.dataset.id,
          label: row.querySelector('[name="custom-label"]').value.trim(),
          visible: row.querySelector('[name="custom-visible"]').checked
        }));
        const relations = [...settingsList('relation').children].map((row) => ({
          label: row.querySelector('[name="relation-label"]').value.trim(),
          previous: row.dataset.previous
        }));
        const builtInLabels = new Set(['姓名', ...fields.map(([, label]) => label)]);
        const hasDuplicates = (labels) => new Set(labels.map((label) => label.toLocaleLowerCase())).size !== labels.length;
        const labels = custom.map(({ label }) => label);
        const relationships = relations.map(({ label }) => label);
        const archived = [...archivedFields.values()];
        const archivedLabels = new Set(archived.map(({ label }) => label.toLocaleLowerCase()));
        if ([...labels, ...relationships].some((label) => !label)) return setError(form, '请输入属性和关系的名称。');
        if (hasDuplicates(labels) || labels.some((label) => builtInLabels.has(label))) return setError(form, '请为自定义属性使用不同的名称。');
        if (labels.some((label) => archivedLabels.has(label.toLocaleLowerCase()))) {
          return setError(form, '该名称已用于已移除的属性。可以恢复原属性，或给新属性换个名称。');
        }
        if (hasDuplicates(relationships)) return setError(form, '请为关系选项使用不同的名称。');

        setError(form);
        submit.disabled = true;
        for (const group of form.querySelectorAll('fieldset')) group.disabled = true;
        try {
          const renames = new Map(relations.filter(({ previous, label }) => previous && previous !== label)
            .map(({ previous, label }) => [previous, label]));
          base = await savePeopleSettings({
            fields: values.getAll('field'), relationships, custom: [...custom, ...archived]
          }, base, renames);
          [...settingsList('relation').children].forEach((row, index) => { row.dataset.previous = relationships[index]; });
          showNotice('人物属性设置已保存');
        } catch (error) {
          setError(form, error.message);
        } finally {
          for (const group of form.querySelectorAll('fieldset')) group.disabled = false;
          submit.disabled = false;
          if (form.isConnected && document.activeElement === document.body) submit.focus({ preventScroll: true });
        }
      });
    }

    return { showDetails, showEditor, mountSettings, clearDrafts: () => drafts.clear() };
  }

  globalThis.PeopleCardView = { create };
})();
</script>
<script>
(() => {
  function createStore(applyRemote) {
    const revisions = new Map();
    let loaded = false;
    let reading;
    let writing = false;

    async function request(path, method = 'GET', body) {
      let response;
      try {
        response = await fetch(path, {
          method, cache: 'no-store', redirect: 'error',
          ...(body && { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        });
      } catch {
        throw new Error('无法连接云端。请检查网络后重试。');
      }
      if (response.status === 401) throw new Error('登录已过期。请保留当前输入，重新打开网站登录。');
      if (response.status === 409) throw new Error('数据已在另一台设备更新。请保留当前输入，关闭编辑后重新同步再试。');
      if (response.status === 413) throw new Error('数据超过单次同步大小限制。');
      if (!response.ok) throw new Error('云端操作未完成，请稍后重试。');
      if (response.status === 204) return;
      return response.json();
    }

    function revision(scope) {
      return revisions.get(scope) ?? 0;
    }

    function refresh() {
      if (reading) return reading;
      if (writing) return Promise.reject(new Error('正在保存云端数据，请稍后再同步。'));
      reading = request('/api/data').then(({ scopes }) => {
        const changes = Object.fromEntries(Object.entries(scopes).filter(([scope, entry]) => entry.revision > revision(scope)));
        if (Object.keys(changes).length) applyRemote(changes);
        for (const [scope, entry] of Object.entries(changes)) revisions.set(scope, entry.revision);
        loaded = true;
      }).finally(() => { reading = undefined; });
      return reading;
    }

    async function write(payload, send) {
      if (writing) throw new Error('正在保存云端数据，请稍后再试。');
      if (reading) await reading;
      if (!loaded) throw new Error('云端记录还未读取，请先重试同步。');
      if (writing) throw new Error('正在保存云端数据，请稍后再试。');
      for (const [scope, entry] of Object.entries(payload)) {
        if (entry.revision !== revision(scope)) {
          throw new Error('数据已更新。请关闭编辑，查看最新记录后再试。');
        }
      }
      writing = true;
      try {
        const scopes = await send();
        for (const [scope, entry] of Object.entries(scopes)) revisions.set(scope, entry.revision);
        return scopes;
      } finally {
        writing = false;
      }
    }

    async function save(scope, data, expected = revision(scope)) {
      const entry = { revision: expected, data };
      await write({ [scope]: entry }, async () => ({
        [scope]: await request(`/api/data/${scope}`, 'PUT', entry)
      }));
    }

    function replace(data, expected) {
      const scopes = Object.fromEntries(Object.entries(data).map(([scope, value]) => [
        scope, { revision: expected[scope] ?? 0, data: value }
      ]));
      return write(scopes, async () => (await request('/api/data', 'PUT', { scopes })).scopes);
    }

    return {
      get loaded() { return loaded; },
      refresh, revision, save, replace,
      revisions: () => Object.fromEntries(revisions),
      logout: () => request('/api/auth/logout', 'POST', {})
    };
  }

  globalThis.MAppCloud = { createStore };
})();
</script>
<script>
(() => {
  const kinds = {
    cooking: ['做了一次', '重要烹饪'],
    people: ['见面', '初识', '纪念日', '其他经历']
  };
  const noteLimit = 300;
  const exact = /^\d{4}-\d{2}-\d{2}$/;
  const approximate = /^([1-9]\d{3})\s*年(?:\s*(春天|夏天|秋天|冬天|(?:1[0-2]|[1-9])\s*月))?$/;

  function dateValue(input, kind) {
    const value = input.trim();
    if (exact.test(value)) {
      const date = new Date(value);
      if (value.slice(0, 4) !== '0000' && Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === value) return value;
    }
    if (kind === 'people') {
      const parts = approximate.exec(value);
      if (parts) return parts[1] + ' 年' + (parts[2] ? parts[2].replace(/\s*月$/, ' 月') : '');
    }
    throw new Error(kind === 'people' ? '请输入日期，例如 2022 年秋天。' : '请选择有效的烹饪日期。');
  }

  function normalize(entries, kind) {
    const types = kinds[kind];
    if (!types || !Array.isArray(entries)) throw new Error('经历记录格式不正确。');
    const ids = new Set();
    return entries.map((entry) => {
      if (!entry || typeof entry.id !== 'string' || !/^[a-zA-Z0-9_-]{1,64}$/.test(entry.id) || ids.has(entry.id)
        || typeof entry.date !== 'string' || entry.date.length > 24 || !types.includes(entry.type)
        || typeof entry.note !== 'string' || entry.note.length > noteLimit || typeof entry.quick !== 'boolean'
        || (entry.quick && (entry.type !== types[0] || entry.note || !exact.test(entry.date)))) {
        throw new Error('经历记录格式不正确。');
      }
      ids.add(entry.id);
      const date = dateValue(entry.date, kind);
      return { id: entry.id, date, type: entry.type, note: entry.note, quick: entry.quick };
    });
  }

  function dateLabel(value, showYear = true) {
    if (!exact.test(value)) return value;
    const [year, month, day] = value.split('-').map(Number);
    return (showYear ? year + ' 年 ' : '') + month + ' 月 ' + day + ' 日';
  }

  function sortKey(date) {
    if (exact.test(date)) return date;
    const parts = approximate.exec(date);
    if (!parts) return '';
    const season = { 春天: '03', 夏天: '06', 秋天: '09', 冬天: '12' };
    const detail = parts[2] || '';
    const month = season[detail] ?? String(parseInt(detail, 10) || 0).padStart(2, '0');
    return parts[1] + '-' + month + '-00';
  }

  globalThis.RecordExperiences = { kinds, exact, noteLimit, dateValue, normalize, dateLabel, sortKey };
})();
</script>
<script>
(() => {
  const model = globalThis.RecordExperiences;
  const copy = {
    cooking: { title: '我的烹饪', quick: '次数 +1', action: '记重要烹饪', undo: '撤回最近一次快速计数', note: '心得', added: '已记下这次烹饪' },
    people: { title: '我们的交集', quick: '记一次见面', action: '记重要经历', undo: '撤回最近一次快速见面记录', note: '经历', added: '已记下今天的见面' }
  };
  const escape = (value) => String(value).replace(/[&<>"']/g, (character) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);

  function today() {
    const now = new Date();
    const pad = (value) => String(value).padStart(2, '0');
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }

  function entry(kind) {
    return `<button class="experience-entry cursor-interaction" type="button" data-open-experiences>
      ${copy[kind].title}<span class="experience-chevron" aria-hidden="true"></span>
    </button>`;
  }

  function mount(container, initialRecord, { save, backButton, onBack }) {
    let record = initialRecord;
    const { kind } = record;
    const words = copy[kind];
    const [quickType, importantType] = model.kinds[kind];
    const cooking = kind === 'cooking';
    let editor;
    let pending = false;
    const entries = () => record.experiences ?? [];
    const sorted = () => [...entries()].reverse().sort((a, b) => model.sortKey(b.date).localeCompare(model.sortKey(a.date)));
    const lastQuick = () => entries().findLast((item) => item.quick);
    const openRows = () => [...container.querySelectorAll('details[open]')].map((row) => row.dataset.experienceId);
    const quickSelector = '[data-experience-action="quick"]';
    const rowSelector = (id) => `[data-experience-id="${CSS.escape(id)}"] summary`;

    function summary(ordered) {
      const latest = ordered[0];
      if (cooking) return latest ? `做过 ${ordered.length} 次 · 上次 ${model.dateLabel(latest.date, false)}` : '还没有烹饪记录';
      const first = ordered.findLast((item) => item.type === '初识');
      const meetings = ordered.filter((item) => item.type === quickType);
      const parts = [];
      if (first) parts.push(`${model.dateLabel(first.date)}相识`);
      if (meetings.length) parts.push(`已记 ${meetings.length} 次见面`, `上次 ${model.dateLabel(meetings[0].date, false)}`);
      return parts.join(' · ') || (latest ? '还没有见面记录' : '还没有交集记录');
    }

    function rows(ordered, expanded) {
      return ordered.map((item) => {
        const date = model.dateLabel(item.date);
        const label = cooking ? date : item.type;
        const meta = cooking ? (item.type === importantType ? importantType : item.note ? '有心得' : '') : date;
        return `<li><details data-experience-id="${escape(item.id)}"${expanded.includes(item.id) ? ' open' : ''}>
          <summary class="cursor-interaction"><span>${escape(label)}</span><small>${escape(meta)}</small>
            <span class="experience-chevron" aria-hidden="true"></span></summary>
          <div class="experience-note">${item.note ? `<p>${escape(item.note)}</p>` : ''}
            <button class="experience-text cursor-interaction" type="button" data-experience-action="edit">
              ${item.note ? '编辑' : '补充'}${words.note}</button></div>
        </details></li>`;
      }).join('');
    }

    function updateTimeline(expanded, message = '') {
      const ordered = sorted();
      container.querySelector('.experience-summary').textContent = summary(ordered);
      container.querySelector('.experience-events').innerHTML = rows(ordered, expanded);
      const undo = container.querySelector('[data-experience-action="undo"]');
      if (!lastQuick() && document.activeElement === undo) container.querySelector(quickSelector).focus();
      undo.disabled = !lastQuick();
      container.querySelector('[role="status"]').textContent = message;
    }

    function showTimeline({ expanded = [], focus = quickSelector, message = '' } = {}) {
      editor = undefined;
      backButton.setAttribute('aria-label', `返回${record.title}详情`);
      container.innerHTML = `<h3 class="experience-title">${words.title}</h3>
        <p class="experience-summary"></p>
        <div class="experience-controls">
          <button class="experience-quick cursor-interaction" type="button" data-experience-action="quick">${words.quick}</button>
          <button class="experience-important cursor-interaction" type="button" data-experience-action="important">${words.action}</button>
          <button class="experience-undo cursor-interaction" type="button" data-experience-action="undo"
            aria-label="${words.undo}" title="${words.undo}"><span aria-hidden="true">↶</span></button>
        </div>
        <p class="experience-status" role="status"></p>
        <p class="experience-error" role="alert" hidden></p>
        <ol class="experience-events"></ol>`;
      updateTimeline(expanded, message);
      container.querySelector(focus)?.focus({ preventScroll: true });
    }

    function showEditor(item) {
      const date = item?.date ?? today();
      const approximate = !model.exact.test(date);
      const type = item?.type ?? (cooking ? importantType : quickType);
      editor = { item, id: item?.id ?? crypto.randomUUID(), expanded: openRows() };
      backButton.setAttribute('aria-label', `返回${words.title}`);
      container.innerHTML = `<form class="experience-form">
        <h3 class="experience-title">${item ? `编辑${words.note}` : words.action}</h3>
        <label class="field" data-experience-exact${approximate ? ' hidden' : ''}>日期
          <input name="date" type="date" value="${approximate ? today() : escape(date)}" required${approximate ? ' disabled' : ''}>
        </label>
        ${cooking ? '' : `<label class="experience-precision">
          <input type="checkbox" name="approximate"${approximate ? ' checked' : ''}>只记得大概日期
        </label>
        <label class="field" data-experience-approximate${approximate ? '' : ' hidden'}>大概日期
          <input type="text" name="date" maxlength="24" placeholder="例如 2022 年秋天" required
            value="${approximate ? escape(date) : ''}"${approximate ? '' : ' disabled'}>
        </label>
        <div class="field"><label for="m-app-experience-type">类型</label>
          <select id="m-app-experience-type" name="type">${model.kinds.people.map((option) =>
            `<option${option === type ? ' selected' : ''}>${option}</option>`).join('')}</select></div>`}
        <div class="field"><label for="m-app-experience-note">${cooking ? '心得' : '经历内容'}（选填）</label>
          <textarea id="m-app-experience-note" name="note" rows="4" maxlength="${model.noteLimit}">${escape(item?.note ?? '')}</textarea>
        </div>
        <p class="experience-error" role="alert" hidden></p>
        <button class="primary cursor-interaction" type="submit">保存</button>
      </form>`;
      container.querySelector('[name="date"]:enabled').focus({ preventScroll: true });
    }

    function back() {
      if (pending) return;
      if (!editor) {
        onBack(record);
        return;
      }
      const { item, expanded } = editor;
      showTimeline({ expanded, focus: item ? rowSelector(item.id) : '[data-experience-action="important"]' });
    }

    function showError(error) {
      const message = container.querySelector('[role="alert"]');
      message.textContent = error.message;
      message.hidden = false;
    }

    async function commit(next, after) {
      const controls = [...container.querySelectorAll('button:not(:disabled)')];
      pending = true;
      backButton.setAttribute('aria-disabled', 'true');
      for (const control of controls) control.setAttribute('aria-disabled', 'true');
      container.querySelector('[role="alert"]').hidden = true;
      try {
        record = await save(record, next);
      } catch (error) {
        showError(error);
        return;
      } finally {
        pending = false;
        backButton.removeAttribute('aria-disabled');
        for (const control of controls) control.removeAttribute('aria-disabled');
      }
      after();
    }

    container.addEventListener('click', (event) => {
      const button = event.target.closest('[data-experience-action]');
      if (!button || pending) return;
      const action = button.dataset.experienceAction;
      if (action === 'important' || action === 'edit') {
        const id = button.closest('details')?.dataset.experienceId;
        showEditor(entries().find((item) => item.id === id));
        return;
      }
      const expanded = openRows();
      if (action === 'quick') {
        const item = { id: crypto.randomUUID(), date: today(), type: quickType, note: '', quick: true };
        commit([...entries(), item], () => updateTimeline(expanded, words.added));
      } else if (action === 'undo') {
        const recent = lastQuick();
        if (!recent) return;
        commit(entries().filter((item) => item.id !== recent.id), () => updateTimeline(expanded, '已撤回最近一次快速记录'));
      }
    });

    container.addEventListener('change', (event) => {
      if (event.target.name !== 'approximate') return;
      const approximate = event.target.checked;
      const exact = container.querySelector('[data-experience-exact]');
      const estimate = container.querySelector('[data-experience-approximate]');
      exact.hidden = exact.querySelector('input').disabled = approximate;
      estimate.hidden = estimate.querySelector('input').disabled = !approximate;
    });

    container.addEventListener('submit', (event) => {
      event.preventDefault();
      if (pending || !editor) return;
      const fields = new FormData(event.target);
      const { item, id, expanded } = editor;
      let date;
      try {
        date = model.dateValue(fields.get('date'), kind);
      } catch (error) {
        showError(error);
        return;
      }
      const saved = { id, date, type: cooking ? item?.type ?? importantType : fields.get('type'), note: fields.get('note').trim(), quick: false };
      const next = item ? entries().map((existing) => existing.id === id ? saved : existing) : [...entries(), saved];
      commit(next, () => showTimeline({ expanded: [...expanded, id], focus: rowSelector(id), message: '经历已保存' }));
    });

    showTimeline();
    return { back };
  }

  globalThis.RecordExperienceView = { entry, mount };
})();
</script>
