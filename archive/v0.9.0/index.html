    setSheet, sheetContent, sheetBack, closeSheet, showNotice, savePerson, savePeopleSettings, saveExperiences,
    icon, findRecord, getSettings: () => state.peopleSettings, isOpen: () => overlay.dataset.open === 'true'
  });

  function loadLegacyCooking() {
    try {
      const saved = JSON.parse(localStorage.getItem(legacyCookingStorageKey));
      if (Array.isArray(saved)) return saved.filter((record) => record?.kind === 'cooking'
        && typeof record.title === 'string' && typeof record.id === 'string' && record.id);
    } catch {
      // The sample remains available if browser storage cannot be read.
    }
    return [{ id: 'recipe-scallion', kind: 'cooking', title: '葱油拌面', durationMinutes: 20, summary: '家常快手', time: '12:18',
      detail: '小火炸香葱段。调入生抽、老抽和一小勺糖，浇在沥干的细面上，拌匀。', recipe: cookingModel.DEMO_RECIPE }];
  }

  function useCookingRecords(recipes) {
    const previous = state.records.filter((record) => record.kind === 'cooking');
    const recipeIds = new Set(recipes.map((record) => record.id));
    const hasCollision = state.records.some((record) => record.kind !== 'cooking' && recipeIds.has(record.id));
    if (!hasCollision && JSON.stringify(previous) === JSON.stringify(recipes)) return;
    const previousIds = new Set(previous.map((record) => record.id));
    const addedCount = recipes.filter((record) => !previousIds.has(record.id)).length;
    const merged = recipes.slice(0, addedCount);
    let index = addedCount;
    for (const record of state.records) {
      if (record.kind === 'cooking') {
        if (index < recipes.length) merged.push(recipes[index++]);
      } else {
        merged.push(recipeIds.has(record.id) ? { ...record, id: nextRecordId(recipeIds) } : record);
      }
    }
    state.records = [...merged, ...recipes.slice(index)];
    render();
  }

  async function refreshCookingRecords() {
    useCookingRecords(await cookingStore.read());
  }

  function replaceRecordKind(kind, records) {
    const previousIds = new Set(state.records.filter((record) => record.kind === kind).map((record) => record.id));
    const incoming = new Map(records.map((record) => [record.id, record]));
    const additions = records.filter((record) => !previousIds.has(record.id));
    state.records = [...additions, ...state.records.flatMap((record) =>
      record.kind === kind ? incoming.has(record.id) ? [incoming.get(record.id)] : [] : [record]
    )];
  }

  function applyCloudRecords(scopes) {
    if (scopes.cooking) replaceRecordKind('cooking', scopes.cooking.data);
    if (scopes.food) replaceRecordKind('food', scopes.food.data);
    if (scopes.people) {
      const { records, settings, sort } = scopes.people.data;
      replaceRecordKind('people', records);
      state.peopleSettings = settings;
      state.peopleSort = sort;
    }
    if (scopes.parking) {
      state.parking = scopes.parking.data;
      recentlyCompleted = undefined;
    }
    if (scopes.mahjong) Object.assign(state.mahjong, mahjongCalculator.normalizeState(scopes.mahjong.data));
    render();
  }

  function cloudReadyForEdit() {
    if (!cloud || cloud.loaded) return true;
    cloud.refresh().catch((error) => showNotice(error.message));
    showNotice('正在读取云端记录，请稍候再试');
    return false;
  }

  function refreshWhenAvailable() {
    if (!cloud || document.hidden || !overlay.hidden || !cookingPanel.hidden) return;
    const active = document.activeElement;
    if (state.module === 'mahjong' && !modulePane.hidden
      && (modulePane.contains(active) && active.matches('input, select, textarea'))) return;
    if (state.module === 'people' && state.moduleScreen === 'settings') return;
    cloud.refresh().catch((error) => { if (!cloud.loaded) showNotice(error.message); });
  }

  async function replaceCookingRecords(records, expectedRecipes) {
    await cookingStore.replace(records.filter((record) => record.kind === 'cooking'), expectedRecipes);
    cookingUpdates?.postMessage('changed');
  }

  function nextRecordId(reserved) {
    let id;
    do { id = `record-${nextId++}`; } while (findRecord(id) || reserved?.has(id));
    return id;
  }

  function readFoodRecords() {
    try {
      const raw = localStorage.getItem(foodStorageKey);
      if (raw === null) return null;
      const records = JSON.parse(raw);
      if (Array.isArray(records) && records.every((record) => record?.kind === 'food'
        && ['id', 'title', 'summary', 'time', 'detail'].every((key) => typeof record[key] === 'string'))) return records;
    } catch {
      // Keep unreadable storage in place so a subsequent write cannot overwrite it.
    }
    throw new Error('无法读取本地美食记录，请检查浏览器存储设置。');
  }

  function loadFoodRecords() {
    try {
      return readFoodRecords() ?? [sampleFood];
    } catch {
      return [sampleFood];
    }
  }

  function writeFoodRecords(records) {
    try {
      localStorage.setItem(foodStorageKey, JSON.stringify(records));
    } catch {
      throw new Error('无法保存美食记录到此浏览器。请检查存储设置或可用空间后再试。');
    }
  }

  async function changeFood(makeChanges) {
    const current = () => state.records.filter((record) => record.kind === 'food');
    if (cloud) {
      const next = makeChanges(current());
      await cloud.save('food', next);
      replaceRecordKind('food', next);
    } else await peopleModel.withStoreLock(() => {
      const next = makeChanges(readFoodRecords() ?? current());
      writeFoodRecords(next);
      replaceRecordKind('food', next);
    });
  }

  function peopleSnapshot() {
    return { records: state.records.filter((record) => record.kind === 'people'), settings: state.peopleSettings, sort: state.peopleSort };
  }

  function personSummary(person, settings) {
    return peopleModel.summary(person, settings) || (settings.fields.includes('notes')
      ? person.notes.split('\n', 1)[0].slice(0, peopleModel.limits.summary) : '');
  }

  function updatePeopleRecords({ records, settings, sort }) {
    const previousIds = new Set(state.records.filter((record) => record.kind === 'people').map((record) => record.id));
    const incoming = new Map(records.map((record) => [record.id, record]));
    const additions = records.filter((record) => !previousIds.has(record.id));
    state.records = [...additions, ...state.records.flatMap((record) => {
      if (record.kind === 'people') return incoming.has(record.id) ? [incoming.get(record.id)] : [];
      return [incoming.has(record.id) ? { ...record, id: nextRecordId(incoming) } : record];
    })];
    state.peopleSettings = settings;
    state.peopleSort = sort;
    renderRecent();
    if (state.module === 'people' && state.moduleScreen === 'content') renderModules();
    updateIcons();
  }

  function writePeopleStore(bundle) {
    try {
      peopleModel.writeStore(bundle);
    } catch {
      throw new Error('无法保存人物卡片到此浏览器。请检查可用存储空间后再试。');
    }
  }

  async function changePeople(makeChanges) {
    if (cloud) {
      const next = makeChanges(peopleSnapshot());
      await cloud.save('people', next);
      updatePeopleRecords(next);
      return next;
    }
    return peopleModel.withStoreLock(() => {
      const next = makeChanges(peopleModel.readStore() ?? peopleSnapshot());
      writePeopleStore(next);
      updatePeopleRecords(next);
      return next;
    });
  }

  async function savePerson(title, person, previous) {
    let saved;
    await changePeople((bundle) => {
      const current = previous && bundle.records.find((record) => record.id === previous.id);
      if (previous && (!current || current.title !== previous.title || current.time !== previous.time
        || JSON.stringify(peopleModel.personFor(current)) !== JSON.stringify(peopleModel.personFor(previous)))) {
        throw new Error('这张人物卡片已在其他页面更新，请重新打开后再编辑。');
      }
      saved = {
        id: previous?.id ?? `person-${crypto.randomUUID()}`, kind: 'people', title,
        time: previous?.time ?? timeNow(), person, summary: personSummary(person, bundle.settings),
        detail: person.notes.slice(0, peopleModel.limits.summary),
        ...(current?.experiences && { experiences: current.experiences }),
        ...cloudRecordTime(previous)
      };
      const records = previous ? bundle.records.map((record) => record.id === previous.id ? saved : record)
        : [saved, ...bundle.records];
      return { ...bundle, records };
    });
    return saved;
  }

  async function savePeopleSettings(settings, previous, renames) {
    const normalized = peopleModel.normalizeSettings(settings, { strict: true });
    const updated = await changePeople((bundle) => {
      if (JSON.stringify(bundle.settings) !== JSON.stringify(previous)) {
        throw new Error('人物设置已在其他页面更新，请重新打开设置后再修改。');
      }
      const records = bundle.records.map((record) => {
        const person = peopleModel.personFor(record);
        person.relationships = [...new Set(person.relationships.map((label) => renames.get(label) ?? label))];
        return { ...record, person, summary: personSummary(person, normalized) };
      });
      return { ...bundle, records, settings: normalized };
    });
    return updated.settings;
  }

  async function saveRecipe({ title, summary, durationMinutes, recipe }, previous) {
    const record = { id: previous?.id ?? `recipe-${crypto.randomUUID()}`, kind: 'cooking', title, summary, durationMinutes,
      time: previous?.time ?? timeNow(), detail: recipe.steps[0].text.slice(0, 180), recipe,
      ...(previous?.experiences && { experiences: previous.experiences }), ...cloudRecordTime(previous) };
    await persistRecipe(record, previous);
    showNotice('菜谱已保存');
    return record;
  }

  async function persistRecipe(record, previous) {
    if (cloud) {
      const recipes = state.records.filter((item) => item.kind === 'cooking');
      const current = previous && recipes.find((item) => item.id === previous.id);
      if (previous && JSON.stringify(current) !== JSON.stringify(previous)) {
        throw new Error('这份菜谱已更新。请保留当前输入，重新打开菜谱后再编辑。');
      }
      const next = previous ? recipes.map((item) => item.id === previous.id ? record : item) : [record, ...recipes];
      await cloud.save('cooking', next);
      useCookingRecords(next);
    } else {
      useCookingRecords(await cookingStore.save(record, previous));
      cookingUpdates?.postMessage('changed');
    }
  }

  async function saveExperiences(previous, entries) {
    const experiences = globalThis.RecordExperiences.normalize(entries, previous.kind);
    if (previous.kind === 'cooking') {
      const saved = { ...previous, experiences };
      await persistRecipe(saved, previous);
      return saved;
    }
    let saved;
    await changePeople((bundle) => {
      const current = bundle.records.find((record) => record.id === previous.id);
      if (!current || JSON.stringify(current.experiences ?? []) !== JSON.stringify(previous.experiences ?? [])) {
        throw new Error('这张人物卡片的经历已更新，请重新打开后再记录。');
      }
      saved = { ...current, experiences };
      return { ...bundle, records: bundle.records.map((record) => record.id === saved.id ? saved : record) };
    });
    return saved;
  }

  async function deleteRecord(record) {
    const { id, kind } = record;
    const stale = () => new Error('这条记录已被修改或删除。请返回列表并查看最新记录。');
    const withoutRecord = (records) => {
      if (JSON.stringify(records.find((item) => item.id === id)) !== JSON.stringify(record)) throw stale();
      return records.filter((item) => item.id !== id);
    };

    if (kind === 'people') {
      await changePeople((bundle) => {
        const current = bundle.records.find((item) => item.id === id);
        if (!current || current.title !== record.title || current.time !== record.time
          || JSON.stringify(peopleModel.personFor(current)) !== JSON.stringify(peopleModel.personFor(record))
          || JSON.stringify(current.experiences ?? []) !== JSON.stringify(record.experiences ?? [])) throw stale();
        return { ...bundle, records: bundle.records.filter((item) => item.id !== id) };
      });
    } else if (kind === 'cooking') {
      if (cloud) {
        const next = withoutRecord(state.records.filter((item) => item.kind === 'cooking'));
        await cloud.save('cooking', next);
        replaceRecordKind('cooking', next);
        render();
      } else {
        useCookingRecords(await cookingStore.remove(record));
        cookingUpdates?.postMessage('changed');
      }
    } else if (kind === 'food') {
      await changeFood(withoutRecord);
      render();
    }
  }

  function loadMahjong() {
    try {
      const saved = localStorage.getItem(mahjongStorageKey) ?? localStorage.getItem('mahjong_state_v4');
      return mahjongCalculator.normalizeState(JSON.parse(saved));
    } catch {
      return mahjongCalculator.normalizeState();
    }
  }

  async function persistMahjong(next = state.mahjong) {
    try {
      if (cloud) await cloud.save('mahjong', next);
      else localStorage.setItem(mahjongStorageKey, JSON.stringify(next));
      Object.assign(state.mahjong, next);
      return true;
    } catch (error) {
      showNotice(cloud ? error.message : '麻将数据未能保存到此浏览器');
      return false;
    }
  }

  function updateIcons() {
    globalThis.lucide?.createIcons({ attrs: { width: 18, height: 18 } });
  }

  function cloudRecordTime(previous) {
    const createdAt = previous ? previous.createdAt : cloud ? Date.now() : undefined;
    return createdAt ? { createdAt } : {};
  }

  function syncHeader() {
    const hasModuleTabs = state.page === 'modules';
    const isChangelog = state.page === 'changelog';
    pageTitle.textContent = pageLabels[state.page];
    pageTitle.hidden = hasModuleTabs;
    addButton.hidden = state.page !== 'recent';
    releaseBack.hidden = !isChangelog;
    mainNavigation.hidden = isChangelog;
    moduleTabs.hidden = !hasModuleTabs;
    syncModuleViewPicker();
    syncModuleWindow();
  }

  function applyAppearance() {
    app.dataset.appearance = state.appearance;
  }

  function setPage(key) {
    if (key !== state.page) stopModuleMotion();
    const previous = pages.find((page) => page.dataset.page === state.page);
    scrollPositions.set(state.page, previous.scrollTop);
    state.page = key;
    syncHeader();
    for (const page of pages) page.hidden = page.dataset.page !== key;
    const tabKey = key === 'changelog' ? 'settings' : key;
    for (const tab of tabs) {
      if (tab.dataset.tab === tabKey) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    }
    pages.find((page) => page.dataset.page === key).scrollTop = scrollPositions.get(key) || 0;
  }

  function parkingTitle(parking) {
    return [parking.area, parking.number].filter(Boolean).join(' · ') || parking.place;
  }

  function parkingWidgetView() {
    return state.parking
      ? { label: '当前停车', title: parkingTitle(state.parking), meta: `${state.parking.place} · ${state.parking.time}`, action: 'record', key: 'parking' }
      : { label: '停车记录', title: '记录停车', meta: '保存楼层、区域和车位号', action: 'create', key: 'parking' };
  }

  function renderWidget() {
    const choice = widgetChoices.find((option) => option.key === state.widget);
    const item = choice?.view?.();
    if (!item) {
      widgetSlot.innerHTML = `<button class="secondary cursor-interaction" type="button" data-action="widget-settings">${icon('plus')}添加小组件</button>`;
      return;
    }
    widgetSlot.innerHTML = `
      <article class="widget">
        <span class="widget-decoration" aria-hidden="true"></span>
        <button class="widget-body cursor-interaction" type="button" data-action="${item.action}" data-key="${item.key}">
          <span class="widget-label">${icon(choice.symbol)}<span></span></span>
          <span class="widget-title"></span>
          <span class="widget-meta"></span>
        </button>
        <button class="widget-config cursor-interaction" type="button" data-action="widget-settings" aria-label="编辑小组件"><svg aria-hidden="true"><use href="#m-app-icon-settings"/></svg></button>
      </article>`;
    widgetSlot.querySelector('.widget-label span').textContent = item.label;
    widgetSlot.querySelector('.widget-title').textContent = item.title;
    widgetSlot.querySelector('.widget-meta').textContent = item.meta;
  }

  function recordRow(record, moduleCard = false) {
    const button = document.createElement('button');
    button.className = `${moduleCard ? 'module-record-card' : 'record'} cursor-interaction`;
    button.type = 'button';
    button.dataset.action = 'record';
    button.dataset.key = record.id;
    const time = '<span class="record-time"></span>';
    button.innerHTML = `
      <span class="${moduleCard ? 'module-record-thumbnail' : 'record-icon'}" data-kind="${record.kind}" aria-hidden="true">${moduleCard ? '' : icon(modules[record.kind].icon)}</span>
      <span class="record-info"><span class="record-name"></span><span class="record-meta"></span></span>
      ${moduleCard ? `<span class="module-record-end">${time}${icon('chevron-right')}</span>` : time}`;
    const badge = button.firstElementChild;
    let summary = record.kind === 'cooking' ? cookingModel.formatRecipeMeta(record) : record.summary;
    if (record.kind === 'people') {
      const person = peopleModel.personFor(record);
      summary = personSummary(person, state.peopleSettings);
      badge.classList.add('person-list-avatar');
      if (person.avatar && state.peopleSettings.fields.includes('avatar')) {
        const avatar = document.createElement('img');
        avatar.src = person.avatar;
        avatar.alt = '';
        badge.replaceChildren(avatar);
      } else badge.textContent = peopleModel.initial(record.title);
    } else if (moduleCard) {
      badge.textContent = Array.from(record.title.trim())[0] ?? '·';
    }
    button.querySelector('.record-name').textContent = record.title;
    const meta = button.querySelector('.record-meta');
    meta.textContent = moduleCard ? summary : [modules[record.kind].label, summary].filter(Boolean).join(' · ');
    if (moduleCard && (!summary || (record.kind === 'food' && modulePreference('food') === 'hide'))) meta.hidden = true;
    button.querySelector('.record-time').textContent = record.time;
    return button;
  }

  function renderRecent() {
    const records = cloud ? state.records.toSorted((left, right) => (right.createdAt ?? 0) - (left.createdAt ?? 0)) : state.records;
    const rows = records.map((record) => recordRow(record));
    if (state.parking && state.widget !== 'parking') {
      rows.unshift(recordRow({ id: 'parking', kind: 'parking', title: parkingTitle(state.parking), summary: state.parking.place, time: state.parking.time }));
    }
    if (rows.length) recentList.replaceChildren(...rows);
    else recentList.innerHTML = '<p class="empty">还没有最近记录</p>';
  }

  function render() {
    renderWidget();
    renderRecent();
    renderModules();
    syncHeader();
    enabledModuleCount.textContent = `${state.enabledModules.length} 个模块`;
    updateIcons();
  }

  function toggleManagedModule(key) {
    const wasEnabled = state.enabledModules.includes(key);
    state.enabledModules = Object.keys(modules).filter((module) => module === key ? !wasEnabled : state.enabledModules.includes(module));
    if (!state.enabledModules.includes(state.module)) state.module = null;
    render();
  }

  function createRecordActions() {
    const layer = root.querySelector('[data-record-delete]');
    const panel = layer.querySelector('.record-delete-panel');
    const title = layer.querySelector('#m-app-record-delete-title');
    const description = layer.querySelector('#m-app-record-delete-description');
    const errorMessage = layer.querySelector('[data-record-delete-error]');
    const cancel = layer.querySelector('[data-record-delete-cancel]');
    const confirm = layer.querySelector('[data-record-delete-confirm]');
    let activeMenu;
    let confirmation;
    let pending = false;

    const lineIcon = (paths) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths}"/></svg>`;
    const actionRow = (action, label, paths) => `<button class="record-action-row cursor-interaction" type="button"
      data-record-action="${action}">${lineIcon(paths)}${label}</button>`;

    function markup(key, editable = true) {
      const menuId = `m-app-${key}-record-menu`;
      return `<div class="record-actions">
        <button class="module-toolbar-button cursor-interaction" type="button" data-record-action="toggle"
          aria-label="更多操作" aria-expanded="false" aria-controls="${menuId}">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="1.65"/><circle cx="12" cy="12" r="1.65"/><circle cx="19" cy="12" r="1.65"/>
          </svg>
        </button>
        <div class="record-action-menu" id="${menuId}" role="group" aria-label="记录操作" aria-hidden="true" inert>
          <div class="record-action-menu-inner">
            ${editable ? actionRow('edit', '编辑', 'M14 5l5 5M4 20l1-5L16 4a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3L9 19l-5 1Z') : ''}
            ${actionRow('delete', '删除记录', 'M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14M10 10v6m4-6v6')}
          </div>
        </div>
      </div>`;
    }

    function closeMenu(restoreFocus = false) {
      if (!activeMenu) return;
      const { menu, toggle } = activeMenu;
      activeMenu = undefined;
      if (restoreFocus || menu.contains(document.activeElement)) toggle.focus({ preventScroll: true });
      toggle.setAttribute('aria-expanded', 'false');
      menu.inert = true;
      menu.setAttribute('aria-hidden', 'true');
      menu.removeAttribute('data-open');
    }

    function dismiss(owner) {
      if (activeMenu?.owner === owner) closeMenu();
    }

    function ask(options, toggle) {
      closeMenu();
      confirmation = { ...options, toggle };
      title.textContent = `删除「${options.record.title}」？`;
      description.textContent = cloud ? '这条记录也会从已同步的设备上移除。' : '删除后，这条记录将从列表和「最近」移除。';
      errorMessage.hidden = true;
      options.owner.inert = true;
      layer.inert = false;
      layer.removeAttribute('aria-hidden');
      layer.setAttribute('data-open', '');
      cancel.focus({ preventScroll: true });
    }

    function closeConfirmation(restoreFocus) {
      if (!confirmation || pending) return;
      const { owner, toggle } = confirmation;
      confirmation = undefined;
      owner.inert = false;
      if (restoreFocus) toggle.focus({ preventScroll: true });
      else if (layer.contains(document.activeElement)) document.activeElement.blur();
      layer.inert = true;
      layer.setAttribute('aria-hidden', 'true');
      layer.removeAttribute('data-open');
    }

    function bind(container, options) {
      const anchor = container.querySelector('.record-actions');
      const toggle = anchor.querySelector('[data-record-action="toggle"]');
      const menu = anchor.querySelector('.record-action-menu');
      toggle.onclick = (event) => {
        if (activeMenu?.anchor === anchor) {
          closeMenu(true);
          return;
        }
        closeMenu();
        activeMenu = { anchor, menu, toggle, owner: options.owner };
        menu.inert = false;
        menu.removeAttribute('aria-hidden');
        menu.setAttribute('data-open', '');
        toggle.setAttribute('aria-expanded', 'true');
        if (event.detail === 0) menu.querySelector('button').focus({ preventScroll: true });
      };
      const edit = menu.querySelector('[data-record-action="edit"]');
      if (edit) edit.onclick = () => { closeMenu(); options.onEdit(); };
      menu.querySelector('[data-record-action="delete"]').onclick = () => ask(options, toggle);
      anchor.addEventListener('focusout', (event) => {
        if (activeMenu?.anchor === anchor && !anchor.contains(event.relatedTarget)) closeMenu();
      });
    }

    cancel.onclick = () => closeConfirmation(true);
    layer.addEventListener('click', (event) => { if (event.target === layer) closeConfirmation(true); });
    confirm.onclick = async () => {
      if (!confirmation || pending) return;
      const { onDelete, onDeleted } = confirmation;
      pending = true;
      panel.focus({ preventScroll: true });
      confirm.disabled = cancel.disabled = true;
      confirm.textContent = '正在删除…';
      errorMessage.hidden = true;
      try {
        await onDelete();
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.hidden = false;
        cloud?.refresh().catch(() => {});
        return;
      } finally {
        pending = false;
        confirm.disabled = cancel.disabled = false;
        confirm.textContent = '删除';
        if (!errorMessage.hidden) cancel.focus({ preventScroll: true });
      }
      closeConfirmation(false);
      onDeleted();
      showNotice('记录已删除');
    };

    document.addEventListener('pointerdown', (event) => {
      if (activeMenu && !activeMenu.anchor.contains(event.target)) closeMenu();
    }, true);
    root.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && (confirmation || activeMenu)) {
        event.preventDefault();
        event.stopPropagation();
        if (confirmation) closeConfirmation(true);
        else closeMenu(true);
      } else if (event.key === 'Tab' && confirmation) {
        event.preventDefault();
        if (!pending) (document.activeElement === cancel ? confirm : cancel).focus();
      }
    }, true);
    return { markup, bind, dismiss };
  }

  function setSheet(label, html, trigger, { onBack, onEdit, record, backLabel, focusMore } = {}) {
    if (overlay.dataset.open === 'false' && !overlay.hidden) return false;
    recordActions.dismiss(overlay);
    overlay.dataset.mode = record?.kind === 'food' ? 'record' : onBack ? 'people' : '';
    sheetBack.hidden = !onBack;
    sheetBack.setAttribute('aria-label', backLabel ?? (state.page === 'modules' ? '返回人物列表' : '返回最近'));
    sheetBack.onclick = onBack ? () => onBack() : null;
    sheetActions.hidden = !record;
    sheetActions.innerHTML = record ? recordActions.markup('sheet', Boolean(onEdit)) : '';
    if (record) recordActions.bind(sheetActions, { record, owner: overlay, onEdit, onDelete: () => deleteRecord(record), onDeleted: closeSheet });
    closeButton.hidden = Boolean(onBack);
    sheetTitle.classList.toggle('live-status', Boolean(onEdit));
    sheetTitle.textContent = label;
    sheetContent.innerHTML = html;
    sheet.scrollTop = 0;
    if (overlay.hidden) {
      overlay.dataset.motion = record ? 'horizontal' : '';
      returnFocus = trigger;
      overlay.hidden = false;
      shell.inert = true;
      notice.inert = true;
      overlay.getBoundingClientRect();
      overlay.dataset.open = 'true';
    }
    const focus = focusMore ? sheetActions.querySelector('[data-record-action="toggle"]') : onBack ? sheetBack : closeButton;
    focus.focus({ preventScroll: true });
    updateIcons();
    return true;
  }

  function replacementFocus(trigger) {
    const replacement = [...root.querySelectorAll('[data-action]')].find((button) => !button.closest('[hidden], [inert]')
      && button.dataset.action === trigger?.dataset.action && button.dataset.key === trigger?.dataset.key);
    const widgetButton = trigger?.matches('.widget-body') && widgetSlot.querySelector('.widget-body');
    const pageControl = state.page === 'modules'
      ? (state.module ? moduleBack : moduleTabs.querySelector('[aria-selected="true"]'))
      : tabs.find((tab) => tab.dataset.tab === state.page);
    return replacement || widgetButton || pageControl;
  }

  function focusAfterClose() {
    (returnFocus?.isConnected ? returnFocus : replacementFocus(returnFocus))?.focus({ preventScroll: true });
  }

  function closeSheet(afterClose) {
    if (overlay.dataset.open !== 'true') return;
    recordActions.dismiss(overlay);
    overlay.dataset.open = 'false';
    sheet.style.removeProperty('--drag');
    const finish = () => {
      overlay.hidden = true;
      shell.inert = false;
      notice.inert = false;
      focusAfterClose();
      afterClose?.();
    };
    if (reducedMotion.matches) finish();
    else setTimeout(finish, 280);
  }

  function showNotice(text, canUndo = false) {
    clearTimeout(noticeTimer);
    notice.innerHTML = `<span></span>${canUndo ? '<button class="notice-action cursor-interaction" type="button" data-action="undo-parking">撤销</button>' : ''}`;
    notice.firstElementChild.textContent = text;
    notice.hidden = false;
    status.textContent = text;
    noticeTimer = setTimeout(() => { notice.hidden = true; }, canUndo ? 5200 : 2300);
  }

  function showSheetError(trigger, error) {
    const message = sheetContent.querySelector('[data-cloud-error]');
    if (message && backupSheetIsOpen(trigger)) {
      message.textContent = error.message;
      message.hidden = false;
    } else showNotice(error.message);
  }

  function optionRow({ action, key, name, meta, symbol, selected }) {
    const marker = selected === undefined ? icon('chevron-right') : selected ? icon('check') : '';
    const pressed = selected === undefined ? '' : ` aria-pressed="${selected}"`;
    return `<button class="option cursor-interaction" type="button" data-action="${action}" data-key="${key}"${pressed}>
      ${symbol ? `<span class="record-icon">${icon(symbol)}</span>` : ''}
      <span class="option-text"><span class="option-name">${name}</span>${meta ? `<span class="option-meta">${meta}</span>` : ''}</span>
      <span class="option-marker">${marker}</span>
    </button>`;
  }

  function showWidgetSettings(trigger) {
    const options = widgetChoices.map((item) => optionRow({ ...item, action: 'set-widget', selected: state.widget === item.key }));
    setSheet('编辑小组件', `<div class="rows">${options.join('')}</div>`, trigger);
  }

  function showAdd(trigger) {
    const options = ['parking', ...persistentKinds].map((kind) => optionRow({

  }

  function showCreate(kind, trigger) {
    if (!cloudReadyForEdit()) return;
    if (kind === 'people') {
      peopleView.showEditor(null, trigger);
      return;
    }
    if (kind === 'cooking') {
      if (overlay.dataset.open === 'true') {
        const source = returnFocus;
        closeSheet(() => cookingWindow.open(null, source));
      } else if (overlay.hidden) cookingWindow.open(null, trigger);
      return;
    }
    const parking = kind === 'parking';
    const updatingParking = parking && state.parking;
    const module = modules[kind];
    const fields = parking
      ? '<label class="field">停车地点<input name="place" maxlength="28" required placeholder="例如环贸广场"></label><label class="field">楼层和区域<input name="area" maxlength="18" placeholder="例如 B2 · C 区"></label><label class="field">车位号<input name="number" maxlength="12" placeholder="例如 128"></label>'
      : `<label class="field">${module.field}<input name="title" maxlength="30" required></label><label class="field">${module.note}<textarea name="note" rows="2" maxlength="180"></textarea></label>`;
    const label = updatingParking ? '更新车位' : parking ? '记录停车' : `新增${module.item}`;
    setSheet(label, `<form class="form" data-create="${kind}">
      ${fields}<p class="settings-meta" data-cloud-error role="alert" hidden></p>
      <button class="primary cursor-interaction" type="button" data-action="save">${parking ? '保存车位' : '保存记录'}</button></form>`, trigger);
    const draft = drafts.get(kind) || (updatingParking && Object.entries(updatingParking).filter(([name]) => name !== 'time'));
    const form = sheetContent.querySelector('form');
    if (cloud && parking) form.dataset.cloudRevision = String(cloud.revision('parking'));
    if (draft) for (const [name, value] of draft) form.elements.namedItem(name).value = value;

  function showRecord(key, trigger) {
    if (key === 'parking') {
      if (!state.parking) {
        showCreate('parking', trigger);

      }
      setSheet('当前停车', `<div class="detail">

      return;
    }
    const record = findRecord(key);
    if (!record) return;
    if (record.kind === 'cooking') {
      cookingWindow.open(record, trigger);
      return;
    }
    if (record.kind === 'people') {
      peopleView.showDetails(record, trigger);
      return;
    }
    if (!setSheet(record.title, '<div class="detail"><p></p></div>', trigger, {
      record, onBack: closeSheet, backLabel: state.page === 'modules' ? '返回美食记录' : '返回最近记录'
    })) return;
    sheetContent.querySelector('p').textContent = record.detail || record.summary;

  async function save(form) {
    if (!form || overlay.dataset.open !== 'true') return;
    const button = form.querySelector('[data-action="save"]');
    if (button.disabled) return;
    const required = form.querySelector('input[required]');
    required.value = required.value.trim();
    if (!form.reportValidity()) return;
    const values = new FormData(form);
    const kind = form.dataset.create;
    button.disabled = true;
    form.querySelector('[data-cloud-error]').hidden = true;
    try {
      if (kind === 'parking') {
        const next = { place: values.get('place'), area: values.get('area').trim(), number: values.get('number').trim(), time: timeNow() };
        if (cloud) await cloud.save('parking', next, Number(form.dataset.cloudRevision));
        state.parking = next;
        recentlyCompleted = undefined;
      } else {
        const detail = values.get('note').trim();
        const summary = detail ? detail.split('\n', 1)[0] : '刚刚添加';
        const record = { id: `food-${crypto.randomUUID()}`, kind, title: values.get('title'), summary, detail,
          time: timeNow(), ...cloudRecordTime() };
        await changeFood((records) => [record, ...records]);
      }
    } catch (error) {
      showSheetError(form, error);
      return;
    } finally {
      button.disabled = false;
    }
    drafts.delete(kind);
    render();
    const announce = () => showNotice(kind === 'parking' ? '车位已保存' : '记录已保存');
    if (backupSheetIsOpen(form)) closeSheet(announce);
    else announce();
  }

  const moduleTabs = root.querySelector('[data-module-tabs]');
  const moduleViewPicker = root.querySelector('[data-module-view-picker]');
  const moduleViewTrigger = moduleViewPicker.querySelector('[data-action="toggle-module-view-menu"]');

    const keys = moduleCategories[state.category].filter((key) => state.enabledModules.includes(key));

      moduleDirectory.innerHTML = `<div class="module-feature">
        <p class="feature-meta">此分类暂无已启用的模块。</p>

    if (state.category === 'temporary' && state.parking) {

  }

  function renderModuleHome(key) {
    const module = modules[key];
    const updatingParking = key === 'parking' && Boolean(state.parking);
    const actionLabel = key === 'parking'
      ? (updatingParking ? '更新车位' : '记录停车')

    const action = actionLabel ? `<button class="primary cursor-interaction" type="button" data-action="create" data-key="${key}">

      <div class="module-home">
        <header class="module-home-header">
          <h1>${module.label}</h1>

        </header>
        <div class="module-home-content"></div>
      </div>`;
    const content = modulePane.querySelector('.module-home-content');
    if (key === 'parking') renderParkingModule(content);
    else if (key === 'calculator') renderCalculatorModule(content);
    else if (key === 'mahjong') globalThis.MahjongModule.render(content, state.mahjong, persistMahjong);
    else renderPersistentModule(content, key);
  }

  function renderPersistentModule(content, key) {
    const entries = state.records.filter((record) => record.kind === key);
    if (modulePreference(key) === 'name') entries.sort((left, right) => left.title.localeCompare(right.title, 'zh-CN'));
    if (key === 'cooking') {
      cookingModule.renderList(content, entries, icon);

    if (entries.length === 0) {
      content.innerHTML = `<p class="module-record-empty">还没有${modules[key].item}</p>`;
      return;
    }
    const list = document.createElement('div');
    list.className = 'module-record-list';
    for (const record of entries) list.append(recordRow(record, true));
    content.append(list);
  }

  function renderParkingModule(content) {
    content.innerHTML = `
      <section class="module-feature">
        <div>
          <p class="feature-value"></p>
          <p class="feature-meta"></p>
        </div>
        ${state.parking ? '<button class="secondary cursor-interaction" type="button" data-action="complete-parking">已取车</button>' : ''}
      </section>`;
    content.querySelector('.feature-value').textContent = state.parking ? parkingTitle(state.parking) : '当前没有停车记录';
    content.querySelector('.feature-meta').textContent = state.parking
      ? [state.parking.place, ...(modulePreference('parking') === 'show' ? [state.parking.time] : [])].join(' · ')
      : '保存地点和车位，取车后结束。';
  }

  function updateCalculatorResult(form) {
    const amount = form.elements.amount.valueAsNumber;
    const people = form.elements.people.valueAsNumber;
    const digits = modulePreference('calculator') === 'whole' ? 0 : 2;
    form.querySelector('output').textContent = form.checkValidity()
      ? `每人 ¥${(amount / people).toFixed(digits)}`
      : '请输入金额和人数';
  }

  function renderCalculatorModule(content) {
    content.innerHTML = `
      <section class="module-feature">
        <h2>聚餐分摊</h2>
        <form class="form" data-calculator>
          <label class="field">总金额<input name="amount" type="number" min="0" step="any" inputmode="decimal" required></label>
          <label class="field">人数<input name="people" type="number" min="1" inputmode="numeric" required></label>
          <output class="feature-value" aria-live="polite"></output>
        </form>
      </section>`;
    const form = content.querySelector('[data-calculator]');
    form.elements.amount.value = calculatorDraft.amount;
    form.elements.people.value = calculatorDraft.people;
    updateCalculatorResult(form);
  }

  function syncModuleWindow() {
    const open = state.page === 'modules' && Boolean(state.module);
    shell.classList.toggle('module-open', open);
    topbar.inert = mainNavigation.inert = modulePage.inert = open;
    moduleWindow.inert = !open;
    moduleWindow.hidden = !open && !moduleMotion;
  }

  function stopModuleMotion() {
    if (!moduleMotion) return;
    moduleMotion.cancel();
    moduleMotion = null;
    shell.classList.remove('module-moving');
    syncModuleWindow();
  }

  function playModuleMotion(iconBounds, closing = false) {
    const paintedBounds = moduleWindow.getBoundingClientRect();
    const style = getComputedStyle(moduleWindow);
    const opacity = Number(style.opacity);
    const borderRadius = style.borderRadius;
    stopModuleMotion();
    if (!iconBounds?.width || reducedMotion.matches || typeof moduleWindow.animate !== 'function') return;
    const bounds = moduleWindow.getBoundingClientRect();
    if (!bounds.width || !bounds.height) return;
    const pageBounds = modulePage.getBoundingClientRect();
    const scale = Math.min(iconBounds.width / bounds.width, iconBounds.height / bounds.height);
    const iconCenterX = iconBounds.left + iconBounds.width / 2;
    const iconCenterY = Math.max(pageBounds.top, Math.min(pageBounds.bottom, iconBounds.top + iconBounds.height / 2));
    const x = iconCenterX - bounds.left;
    const y = iconCenterY - bounds.top;
    const atIcon = (size) => `translate(${x - bounds.width * size / 2}px, ${y - bounds.height * size / 2}px) scale(${size})`;
    const current = {
      transform: `translate(${paintedBounds.left - bounds.left}px, ${paintedBounds.top - bounds.top}px) scale(${paintedBounds.width / bounds.width})`,
      opacity,
      borderRadius
    };
    const frames = closing
      ? [current, { transform: atIcon(0), opacity: 0, borderRadius: '32px' }]
      : [{ transform: atIcon(scale), opacity: .45, borderRadius: '32px' }, { transform: 'none', opacity: 1, borderRadius: '0px' }];
    shell.classList.add('module-moving');
    const animation = moduleWindow.animate(frames, closing ? moduleReturnTiming : moduleMotionTiming);
    moduleMotion = animation;
    animation.onfinish = () => { if (moduleMotion === animation) stopModuleMotion(); };
  }

  function renderModules() {
    stopModuleMotion();
    const calculator = modulePane.querySelector('[data-calculator]');
    if (calculator) {
      calculatorDraft.amount = calculator.elements.amount.value;
      calculatorDraft.people = calculator.elements.people.value;
    }

    if (!state.enabledModules.includes(state.module)) state.module = null;
    renderModuleTabs();
    renderCategoryEntries();
    syncModuleWindow();
    if (!state.module) {
      state.moduleScreen = 'content';
      modulePane.replaceChildren();
      return;
    }

    if (state.moduleScreen === 'settings') renderModuleSettings(state.module);
    else if (state.moduleScreen === 'releases') renderModuleReleases(state.module);
    else renderModuleHome(state.module);
    const categoryLabel = categoryTabs.find((tab) => tab.dataset.key === state.category).textContent;
    const moduleLabel = modules[state.module].label;
    const backLabel = state.moduleScreen === 'releases' ? '模块设置'
      : state.moduleScreen === 'settings' ? moduleLabel : categoryLabel;
    moduleWindow.setAttribute('aria-label', moduleLabel);
    moduleBack.setAttribute('aria-label', `返回${backLabel}`);
    moduleBack.dataset.action = state.moduleScreen === 'content' ? 'back-to-category' : 'back-in-module';
    moduleSettingsButton.hidden = state.moduleScreen !== 'content';
    moduleSettingsButton.setAttribute('aria-label', `${moduleLabel}设置`);
  }

  function selectCategory(key) {
    if (key === state.category) return;
    stopModuleMotion();
    categoryScrollPositions.set(state.category, modulePage.scrollTop);
    state.category = key;
    renderModuleTabs();
    renderCategoryEntries();
    updateIcons();
    modulePage.scrollTop = categoryScrollPositions.get(key) || 0;
  }

  function openModule(key, button) {
    if (!state.enabledModules.includes(key) || !moduleCategories[state.category].includes(key)) return;
    const iconBounds = button.querySelector('.record-icon').getBoundingClientRect();
    categoryScrollPositions.set(state.category, modulePage.scrollTop);
    state.module = key;
    state.moduleScreen = 'content';
    renderModules();
    updateIcons();
    modulePane.scrollTop = 0;
    playModuleMotion(iconBounds);
    moduleBack.focus({ preventScroll: true });
  }

  function backToModuleCategory() {
    const module = state.module;
    if (!module) return;
    modulePage.scrollTop = categoryScrollPositions.get(state.category) || 0;
    const entry = moduleDirectory.querySelector(`[data-action="open-module"][data-key="${module}"]`);
    playModuleMotion(entry?.querySelector('.record-icon').getBoundingClientRect(), true);
    state.module = null;
    state.moduleScreen = 'content';
    syncModuleWindow();
    entry?.focus({ preventScroll: true });
  }

  function setModuleScreen(screen, focusTarget) {
    moduleScrollPositions.set(`${state.module}:${state.moduleScreen}`, modulePane.scrollTop);
    state.moduleScreen = screen;
    renderModules();
    updateIcons();
    modulePane.scrollTop = moduleScrollPositions.get(`${state.module}:${screen}`) || 0;
    const target = focusTarget ? moduleWindow.querySelector(focusTarget) : moduleBack;
    target?.focus({ preventScroll: true });
  }

  function backInModule() {
    if (state.moduleScreen === 'releases') setModuleScreen('settings', '[data-action="open-module-releases"]');
    else setModuleScreen('content', '[data-action="open-module-settings"]');
  }

  async function setModulePreference(key) {
    if (!moduleSettings[state.module].options.some((option) => option.key === key)) return;
    const module = state.module;
    if (state.module === 'mahjong') {
      if (!await persistMahjong({ ...state.mahjong, colorMode: key })) return;
    } else if (module === 'people') {
      try {
        await changePeople((bundle) => ({ ...bundle, sort: key }));
      } catch (error) {
        showNotice(error.message);
        return;
      }
      if (state.module !== module || state.moduleScreen !== 'settings') return;
      for (const button of modulePane.querySelectorAll('[data-action="module-preference"]')) {
        button.setAttribute('aria-pressed', String(button.dataset.key === key));
        const marker = button.querySelector('.option-marker');
        marker.innerHTML = button.dataset.key === key ? icon('check') : '';
      }
      updateIcons();
      return;
    } else state.modulePreferences[module] = key;
    const scrollTop = modulePane.scrollTop;
    renderModules();
    updateIcons();
    modulePane.scrollTop = scrollTop;
    modulePane.querySelector(`[data-action="module-preference"][data-key="${key}"]`)?.focus({ preventScroll: true });
  }

  const moduleSettings = {
    cooking: {
      preferenceLabel: '菜谱排序',
      defaultPreference: 'recent',
      options: [
        { key: 'recent', label: '最近添加优先', symbol: 'clock-3' },
        { key: 'name', label: '按菜名排序', symbol: 'book-open' }
      ],
      releases: [{
        version: '0.4.0',
        date: '2026-11-24',

    if (!moduleViewMenu.hidden && (event.key === 'Escape' || backTab)) {
      event.preventDefault();
      setModuleViewMenu(false, true);
      return;
    }
    const order = moduleViewOptions.indexOf(event.target);
    const isArrowKey = event.key === 'ArrowDown' || event.key === 'ArrowUp';
    if (isArrowKey && event.target === moduleViewTrigger) {
      event.preventDefault();
      setModuleViewMenu(true);
      return;
    }
    if (order < 0 || !(isArrowKey || event.key === 'Home' || event.key === 'End')) return;
    event.preventDefault();
    const last = moduleViewOptions.length - 1;
    const next = isArrowKey ? last - order : event.key === 'Home' ? 0 : last;
    moduleViewOptions[next].focus({ preventScroll: true });
  });

    if (event.relatedTarget && !moduleViewPicker.contains(event.relatedTarget)) setModuleViewMenu(false);

    const current = categoryTabs.indexOf(tab);
    const last = categoryTabs.length - 1;
    let next;
    if (event.key === 'ArrowRight') next = current === last ? 0 : current + 1;
    else if (event.key === 'ArrowLeft') next = current === 0 ? last : current - 1;
    else if (event.key === 'Home') next = 0;
    else if (event.key === 'End') next = last;
    else return;

    event.preventDefault();
    const target = categoryTabs[next];
    selectCategory(target.dataset.key);
    target.focus({ preventScroll: true });
  });

  }

  function backupSheetIsOpen(element) {
    return overlay.dataset.open === 'true' && sheetContent.contains(element);
  }

  async function showBackupExport(trigger, local = false) {
    const description = local ? '备份包含这个浏览器已保存的菜谱、人物卡片、美食和麻将记录。'
      : '备份包含长期记录、人物属性设置、车位和麻将结算数据。';
    setSheet(local ? '导出旧记录' : '导出数据', `<p class="settings-meta">${description}选中后可复制到本地文件。</p>
      <label class="field">JSON 备份<textarea class="data-text" data-backup-output rows="7" readonly spellcheck="false" placeholder="正在读取记录…"></textarea></label>
      <p class="settings-meta" data-backup-error role="alert" hidden></p>
      <button class="primary cursor-interaction" type="button" data-action="select-settings-backup" disabled>选中全部 JSON</button>`, trigger);
    const output = sheetContent.querySelector('[data-backup-output]');
    const copy = sheetContent.querySelector('[data-action="select-settings-backup"]');
    const message = sheetContent.querySelector('[data-backup-error]');
    try {
      if (importingBackup) throw new Error('正在导入数据，请完成后再导出备份。');
      let data;
      if (local) {
        cookingStore ??= globalThis.CookingStore.createStore(loadLegacyCooking());
        const recipes = await cookingStore.read();
        const people = peopleModel.readStore();
        data = {
          records: [...recipes, ...(people?.records ?? []), ...(readFoodRecords() ?? [])],
          peopleSettings: people?.settings, peopleSort: people?.sort,
          parking: null, mahjong: loadMahjong()
        };
      } else {
        if (cloud) await cloud.refresh();
        else {
          await refreshCookingRecords();
          await peopleModel.withStoreLock(() => {
            const bundle = peopleModel.readStore();
            if (bundle) updatePeopleRecords(bundle);
            replaceRecordKind('food', readFoodRecords() ?? [sampleFood]);
          });
        }
        data = {
          records: state.records, peopleSettings: state.peopleSettings, peopleSort: state.peopleSort,
          parking: state.parking, mahjong: state.mahjong
        };
      }
      if (!backupSheetIsOpen(output)) return;
      output.value = JSON.stringify({ format: backupFormat, schema: 1, ...data }, null, 2);
      copy.disabled = false;
    } catch (error) {
      if (!backupSheetIsOpen(output)) return;
      message.hidden = false;
      message.textContent = error.message;
    } finally {
      if (backupSheetIsOpen(output)) output.removeAttribute('placeholder');
    }
  }

  function backupString(value, field, maxLength, required = false) {
    if (typeof value !== 'string' || value.length > maxLength || (required && !value.trim())) {
      throw new Error(`备份中的${field}格式不正确。`);
    }
    return value;
  }

  function parseSettingsBackup(source) {
    if (!source.trim()) throw new Error('请先粘贴 JSON 备份。');
    let json;
    try {
      json = JSON.parse(source);
    } catch {
      throw new Error('没有读到有效的 JSON，请检查备份是否完整。');
    }
    if (json?.format !== backupFormat || json.schema !== 1 || !Array.isArray(json.records)) {
      throw new Error('请选择由这个预览导出的 M_APP 备份。');
    }
    const recordIds = new Set();
    const records = json.records.map((record) => {
      if (!record || !persistentKinds.includes(record.kind) || typeof record.id !== 'string'
        || !backupIdPattern.test(record.id) || ['parking', 'none'].includes(record.id) || recordIds.has(record.id)) {
        throw new Error('备份中的记录类型或编号无效。');
      }
      recordIds.add(record.id);
      const recipe = record.kind === 'cooking' && Object.hasOwn(record, 'recipe')
        ? cookingModel.normalizeRecipe(record.recipe, { strict: true }) : undefined;
      const duration = record.kind === 'cooking' && Object.hasOwn(record, 'durationMinutes')
        ? { durationMinutes: cookingModel.normalizeDuration(record.durationMinutes) } : {};
      const person = record.kind === 'people'
        ? (Object.hasOwn(record, 'person') ? peopleModel.normalizePerson(record.person, { strict: true }) : peopleModel.personFor(record))
        : undefined;
      const experiences = Object.hasOwn(record, 'experiences')
        ? globalThis.RecordExperiences.normalize(record.experiences, record.kind) : undefined;
      return {
        id: record.id,
        kind: record.kind,
        title: backupString(record.title, '标题', 30, true),
        summary: backupString(record.summary, '摘要', 180),
        time: backupString(record.time, '时间', 32, true),
        detail: backupString(record.detail, '内容', 180),
        ...duration,
        ...(recipe && { recipe }),
        ...(person && { person }),
        ...(experiences && { experiences }),
        ...(Number.isSafeInteger(record.createdAt) && record.createdAt > 0 && { createdAt: record.createdAt })
      };
    });
    let parking = null;
    if (json.parking !== null) {
      if (!json.parking || typeof json.parking !== 'object' || Array.isArray(json.parking)) {
        throw new Error('备份中的停车记录格式不正确。');
      }
      parking = {
        place: backupString(json.parking.place, '停车地点', 28, true),
        area: backupString(json.parking.area, '楼层和区域', 18),
        number: backupString(json.parking.number, '车位号', 12),
        time: backupString(json.parking.time, '停车时间', 32, true)
      };
    }
    const mahjong = Object.hasOwn(json, 'mahjong')
      ? mahjongCalculator.normalizeState(json.mahjong, { strict: true })
      : undefined;
    const peopleSettings = Object.hasOwn(json, 'peopleSettings')
      ? peopleModel.normalizeSettings(json.peopleSettings, { strict: true }) : undefined;
    if (Object.hasOwn(json, 'peopleSort') && !['recent', 'name'].includes(json.peopleSort)) {
      throw new Error('备份中的人物排序格式不正确。');
    }
    return { records, parking, mahjong, peopleSettings, peopleSort: json.peopleSort, source };
  }

  async function reviewSettingsImport(trigger) {
    const input = sheetContent.querySelector('[data-backup-input]');
    const message = sheetContent.querySelector('[data-backup-error]');
    trigger.disabled = true;
    input.readOnly = true;
    message.hidden = true;
    try {
      if (importingBackup) throw new Error('上一份备份仍在导入，请稍后检查。');
      const backup = parseSettingsBackup(input.value);
      if (cloud) {
        await cloud.refresh();
        backup.cloudRevisions = cloud.revisions();
      } else {
        await refreshCookingRecords();
        backup.cookingBase = state.records.filter((record) => record.kind === 'cooking');
        backup.peopleBase = peopleModel.readStore() ?? peopleSnapshot();
        backup.foodBase = readFoodRecords();
      }
      if (!backupSheetIsOpen(input)) return;
      pendingBackup = backup;
      const { records, parking, mahjong } = backup;
      setSheet('确认导入', `<div class="detail settings-detail">
        <strong>${records.length} 条长期记录 · ${parking ? '1 条车位记录' : '无车位记录'}${mahjong ? ` · ${mahjong.rounds.length} 局麻将` : ''}</strong>
        <p>确认后，备份将替换${cloud ? '云端' : '当前预览中'}的记录和车位${mahjong ? '，以及麻将结算数据' : ''}。</p></div>
        <p class="settings-meta" data-backup-error role="alert" hidden></p>
        <button class="primary cursor-interaction" type="button" data-action="apply-settings-import">确认导入</button>
        <button class="secondary cursor-interaction" type="button" data-action="edit-settings-import">返回修改</button>`, trigger);
    } catch (error) {
      if (!backupSheetIsOpen(input)) return;
      message.hidden = false;
      message.textContent = error.message;
    } finally {
      if (backupSheetIsOpen(input)) {
        input.readOnly = false;
        trigger.disabled = false;
      }
    }
  }

  async function applySettingsImport(_, trigger) {
    if (!pendingBackup || importingBackup) return;
    const backup = pendingBackup;
    const { records, parking, mahjong, cookingBase, peopleSettings, peopleSort, peopleBase } = backup;
    const edit = sheetContent.querySelector('[data-action="edit-settings-import"]');
    const message = sheetContent.querySelector('[data-backup-error]');
    importingBackup = true;
    trigger.disabled = true;
    trigger.textContent = '正在导入…';
    edit.disabled = true;
    message.hidden = true;
    try {
      if (cloud) {
        const people = { records: records.filter((record) => record.kind === 'people'),
          settings: peopleSettings ?? state.peopleSettings, sort: peopleSort ?? state.peopleSort };
        await cloud.replace({
          people, parking, cooking: records.filter((record) => record.kind === 'cooking'),
          food: records.filter((record) => record.kind === 'food'), ...(mahjong && { mahjong })
        }, backup.cloudRevisions);
        state.peopleSettings = people.settings;
        state.peopleSort = people.sort;
      } else await peopleModel.withStoreLock(async () => {
        const stored = peopleModel.readStore();
        const previous = stored ?? peopleSnapshot();
        if (JSON.stringify(previous) !== JSON.stringify(peopleBase)) {
          throw new Error('其他页面更新了人物卡片。请重新检查备份后再确认导入。');
        }
        const previousFood = readFoodRecords();
        if (JSON.stringify(previousFood) !== JSON.stringify(backup.foodBase)) {
          throw new Error('其他页面更新了美食记录。请重新检查备份后再确认导入。');
        }
        const imported = {
          records: records.filter((record) => record.kind === 'people'),
          settings: peopleSettings ?? previous.settings,
          sort: peopleSort ?? previous.sort
        };
        writePeopleStore(imported);
        try {
          writeFoodRecords(records.filter((record) => record.kind === 'food'));
          try {
            await replaceCookingRecords(records, cookingBase);
          } catch (error) {
            if (previousFood) writeFoodRecords(previousFood);
            else localStorage.removeItem(foodStorageKey);
            throw error;
          }
        } catch (error) {
          if (stored) writePeopleStore(stored);
          else localStorage.removeItem(peopleModel.storageKey);
          throw error;
        }
        state.peopleSettings = imported.settings;
        state.peopleSort = imported.sort;
      });
    } catch (error) {
      if (backupSheetIsOpen(trigger)) {
        trigger.disabled = false;
        trigger.textContent = '确认导入';
        edit.disabled = false;
        message.hidden = false;
        message.textContent = error.message;
        trigger.focus({ preventScroll: true });
      } else showNotice(error.message);
      return;
    } finally {
      importingBackup = false;
    }
    if (pendingBackup === backup) pendingBackup = undefined;
    state.records = records;
    state.parking = parking;
    recentlyCompleted = undefined;
    drafts.clear();
    cookingWindow.clearDraft();
    peopleView.clearDrafts();
    notice.hidden = true;
    if (cloud && mahjong) Object.assign(state.mahjong, mahjong);
    const saved = !mahjong || cloud || await persistMahjong(mahjong);
    render();
    const announce = () => showNotice(saved ? '已导入数据' : '记录和车位已导入，麻将数据未保存');
    if (backupSheetIsOpen(trigger)) closeSheet(announce);
    else announce();
  }

  function showSettingsItem(key, trigger) {
    switch (key) {
      case 'account':
        if (cloud) {
          setSheet('访问与同步', `<div class="rows">
            ${optionRow({ action: 'sync-cloud', name: '立即同步', meta: '读取其他设备在云端保存的记录', symbol: 'refresh-cw' })}
            ${optionRow({ action: 'logout', name: '退出登录', symbol: 'log-out' })}
            <p class="settings-meta" data-cloud-error role="alert" hidden></p></div>`, trigger);
        } else {
          setSheet('我的账号', `<div class="detail settings-detail">
            <h3>M_APP 预览用户</h3><p>本地示例账号</p></div>`, trigger);
        }
        break;
      case 'modules':
        showManagedModules(trigger);
        break;
      case 'preferences':
        showPreferences(trigger);
        break;
      case 'data':
        showDataSettings(trigger);
        break;
      case 'about':
        setSheet('关于我们', `<div class="detail settings-detail">
          <h3>M_APP</h3><p>在一处整理菜谱、人物、美食和临时停车记录。</p><p>当前原型版本 v${settingsVersion}</p></div>`, trigger);
        break;
      case 'changelog':
        showChangelog();
        break;
    }
  }

  const settingsActions = {
    'settings-item': showSettingsItem,
    'back-from-changelog': backFromChangelog,
    'toggle-managed-module': (key, button) => {
      const scrollTop = sheet.scrollTop;
      toggleManagedModule(key);
      showManagedModules(button);
      sheet.scrollTop = scrollTop;
      sheetContent.querySelector(`[data-key="${key}"]`).focus({ preventScroll: true });
    },
    'settings-appearance': (key, button) => {
      state.appearance = key;
      applyAppearance();
      showPreferences(button);
      sheetContent.querySelector(`[data-key="${key}"]`).focus({ preventScroll: true });
    },
    'settings-backup-view': (key, button) => {
      if (key === 'import') showBackupImport(button);
      else showBackupExport(button, key === 'local');
    },
    'sync-cloud': async (_, button) => {
      try {
        await cloud.refresh();
        closeSheet(() => showNotice('已读取最新云端记录'));
      } catch (error) { showSheetError(button, error); }
    },
    logout: async (_, button) => {
      try {
        await cloud.logout();
        location.reload();
      } catch (error) { showSheetError(button, error); }
    },
    'select-settings-backup': () => {
      const output = sheetContent.querySelector('[data-backup-output]');
      output.focus();
      output.select();
    },
    'review-settings-import': (_, button) => reviewSettingsImport(button),
    'edit-settings-import': (_, button) => showBackupImport(button, pendingBackup?.source),
    'apply-settings-import': applySettingsImport
  };

  const actions = {
    ...moduleActions,
    ...settingsActions,
    'widget-settings': (_, button) => showWidgetSettings(button),
    'set-widget': (key) => {
      if (!widgetChoices.some((option) => option.key === key)) return;
      state.widget = key;
      render();
      closeSheet(() => showNotice(key === 'none' ? '小组件已隐藏' : '小组件已更新'));
    },
    add: (_, button) => showAdd(button),
    create: showCreate,
    record: showRecord,
    save: (_, button) => save(button.closest('[data-create]')),
    'complete-parking': async (_, button) => {
      if (!state.parking) return;
      const current = state.parking;
      try {
        if (cloud) await cloud.save('parking', null, Number(button.dataset.cloudRevision ?? cloud.revision('parking')));
      } catch (error) {
        showSheetError(button, error);
        return;
      }
      recentlyCompleted = current;
      state.parking = null;
      drafts.delete('parking');
      render();
      if (backupSheetIsOpen(button)) closeSheet(() => showNotice('停车记录已结束', true));
      else {
        modulePane.querySelector('[data-action="create"][data-key="parking"]')?.focus({ preventScroll: true });
        showNotice('停车记录已结束', true);
      }
    },
    'undo-parking': async () => {
      if (state.parking || !recentlyCompleted) return;
      const previous = recentlyCompleted;
      try {
        if (cloud) await cloud.save('parking', previous);
      } catch (error) {
        showNotice(error.message);
        return;
      }
      state.parking = previous;
      recentlyCompleted = undefined;
      render();
      const pageControl = state.page === 'changelog' ? releaseBack
        : state.page === 'modules' && state.module ? moduleBack : tabs.find((tab) => tab.dataset.tab === state.page);
      pageControl.focus({ preventScroll: true });
      showNotice('停车记录已恢复');
    }
  };

  root.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (button?.dataset.tab) setPage(button.dataset.tab);
    if (button === handle && draggedHandle && event.detail !== 0) return;
    if (button?.hasAttribute('data-close-sheet') || event.target === overlay) closeSheet();
    if (button?.dataset.action) actions[button.dataset.action]?.(button.dataset.key, button);
  });

  root.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape' || !overlay.hidden || event.defaultPrevented) return;
    if (state.page === 'changelog') {
      event.preventDefault();
      backFromChangelog();
    } else if (state.page === 'modules' && state.module) {
      event.preventDefault();
      if (state.moduleScreen === 'content') backToModuleCategory();
      else backInModule();
    }
  });

  root.addEventListener('input', (event) => {
    const form = event.target.closest('form');
    if (!form) return;
    if (form.dataset.create) drafts.set(form.dataset.create, new FormData(form));
    if (form.hasAttribute('data-calculator')) updateCalculatorResult(form);
  });
  root.addEventListener('submit', (event) => event.preventDefault());

  overlay.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      event.preventDefault();
      if (sheetBack.hidden) closeSheet();
      else sheetBack.click();
    }
    if (event.key === 'Enter' && event.target.tagName === 'INPUT' && !event.isComposing) {
      const form = event.target.closest('[data-create]');
      if (form) {
        event.preventDefault();
        save(form);
      }
    }
    if (event.key !== 'Tab') return;
    const controls = [...sheet.querySelectorAll('button, input, textarea, select, a[href], summary')]
      .filter((element) => !element.matches(':disabled')
        && !element.closest('[inert], [hidden], details:not([open]) > :not(summary)') && element.getClientRects().length);
    const first = controls[0];
    const last = controls[controls.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  handle.addEventListener('pointerdown', (event) => {
    if (!event.isPrimary || event.button !== 0) return;
    draggedHandle = false;
    dragStart = event.clientY;
    sheet.dataset.dragging = 'true';
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', (event) => {
    if (dragStart === undefined || !event.isPrimary) return;
    const distance = event.clientY - dragStart;
    if (Math.abs(distance) > 6) draggedHandle = true;
    if (!reducedMotion.matches) sheet.style.setProperty('--drag', `${Math.max(0, distance)}px`);
  });
  function finishDrag(event) {
    if (dragStart === undefined || !event.isPrimary) return;
    const distance = event.clientY - dragStart;
    dragStart = undefined;
    sheet.dataset.dragging = 'false';
    if (event.type === 'pointerup' && distance > 54) closeSheet();
    else sheet.style.removeProperty('--drag');
  }
  handle.addEventListener('pointerup', finishDrag);
  handle.addEventListener('pointercancel', finishDrag);

  setPage(state.page);
  applyAppearance();
  root.querySelector('[data-app-version]').textContent = `v${settingsVersion}`;
  renderChangelog();
  render();
  if (cloud) {
    window.addEventListener('focus', refreshWhenAvailable);
    window.addEventListener('pageshow', refreshWhenAvailable);
    document.addEventListener('visibilitychange', refreshWhenAvailable);
    refreshWhenAvailable();
    root.querySelector('[data-key="account"] .record-name').textContent = '访问与同步';
  } else {
    const syncCookingRecords = () => refreshCookingRecords().catch(() => {});
    cookingUpdates?.addEventListener('message', syncCookingRecords);
    window.addEventListener('focus', syncCookingRecords);
    window.addEventListener('storage', (event) => {
      if (event.key === foodStorageKey) {
        peopleModel.withStoreLock(() => {
          replaceRecordKind('food', readFoodRecords() ?? [sampleFood]);
          render();
        }).catch(() => {});
        return;
      }
      if (event.key !== peopleModel.storageKey) return;
      peopleModel.withStoreLock(() => {
        const bundle = peopleModel.readStore();
        if (bundle) updatePeopleRecords(bundle);
      }).catch(() => {});
    });
    syncCookingRecords();
  }
})();
</script>
</body>
</html>
